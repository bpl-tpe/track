<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動人次追蹤系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fa;
  --surface:#ffffff;
  --surface2:#f0f4f8;
  --surface3:#e8eef5;
  --accent:#2563eb;
  --accent-h:#1d4ed8;
  --accent-pale:#eff6ff;
  --text:#0f172a;
  --text2:#475569;
  --text3:#94a3b8;
  --border:#e2e8f0;
  --border2:#cbd5e1;
  --success:#059669;
  --danger:#dc2626;
  --warn:#d97706;
  --r:10px;--r-sm:6px;--r-lg:14px;
  --sh-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 12px rgba(0,0,0,.08);
  --sh-lg:0 8px 30px rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;}

/* ── TOPBAR ── */
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:200;box-shadow:var(--sh-sm);}
.brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--text);}
.brand-icon{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.sync-pill{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .3s;}
.sdot.synced{background:var(--success);}
.sdot.syncing{background:var(--warn);animation:blink 1s infinite;}
.sdot.error{background:var(--danger);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.role-btn{font-size:12px;font-weight:500;padding:5px 13px;border-radius:6px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;font-family:inherit;}
.role-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ── VIEWS ── */
.view{display:none;}
.view.active{display:block;}

/* ── LAYOUT ── */
.wrap{max-width:960px;margin:0 auto;padding:28px 20px;}
.wrap-sm{max-width:480px;margin:0 auto;padding:28px 20px;}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.ph-title{font-size:18px;font-weight:700;letter-spacing:-.3px;}
.ph-sub{font-size:13px;color:var(--text2);margin-top:2px;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;font-family:inherit;line-height:1.4;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-h);}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2);}
.btn-ghost:hover{background:var(--surface2);color:var(--text);}
.btn-danger{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;}
.btn-danger:hover{background:var(--danger);color:#fff;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-lg{padding:10px 20px;font-size:14px;}
.btn-full{width:100%;justify-content:center;}
.back-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--text2);cursor:pointer;padding:5px 8px;border-radius:var(--r-sm);border:none;background:none;font-family:inherit;margin-bottom:18px;transition:all .15s;}
.back-btn:hover{background:var(--surface2);color:var(--text);}

/* ── CARDS ── */
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;cursor:pointer;transition:all .2s;position:relative;}
.pcard:hover{border-color:var(--accent);box-shadow:var(--sh-md);transform:translateY(-1px);}
.pcard.dragging{opacity:.4;border-style:dashed;}
.pcard.drag-over{border-color:var(--accent);background:var(--accent-pale);}
.pcard-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px;}
.pcard-title{font-size:14px;font-weight:600;line-height:1.4;}
.badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0;}
.badge-on{background:#d1fae5;color:#065f46;}
.badge-off{background:var(--surface2);color:var(--text3);}
.pcard-date{font-size:12px;color:var(--text3);margin-bottom:8px;}
.pcard-fields{font-size:12px;color:var(--text3);margin-bottom:12px;}
.pcard-stats{display:flex;gap:14px;padding-top:12px;border-top:1px solid var(--border);}
.stat{text-align:center;}
.stat-n{font-size:18px;font-weight:700;color:var(--accent);}
.stat-l{font-size:11px;color:var(--text3);margin-top:1px;}

/* ── SUMMARY ── */
.summary-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:center;}
.scard-n{font-size:26px;font-weight:700;color:var(--accent);line-height:1;}
.scard-l{font-size:12px;color:var(--text2);margin-top:5px;}

/* ── TABLE ── */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:auto;margin-bottom:22px;}
table{width:100%;border-collapse:collapse;min-width:400px;}
th{background:var(--surface2);padding:9px 14px;text-align:center;font-size:12px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap;}
th:first-child{text-align:left;}
td{padding:9px 14px;border-bottom:1px solid var(--border);font-size:13px;text-align:center;}
td:first-child{text-align:left;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2);}
.total-row td{background:var(--accent-pale);font-weight:700;color:var(--accent-h);border-top:2px solid var(--border2);}
.total-row:hover td{background:var(--accent-pale);}
.date-cell{font-weight:500;color:var(--text2);white-space:nowrap;}

/* ── ASSISTANT FORM ── */
.entry-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-top:14px;}
.entry-card h3{font-size:15px;font-weight:700;margin-bottom:3px;}
.entry-meta{font-size:13px;color:var(--text2);margin-bottom:20px;}
.entry-fields{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;}
.efield-row{display:flex;align-items:center;gap:12px;}
.efield-label{flex:1;font-size:14px;font-weight:500;}
.efield-input{width:100px;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:20px;font-weight:700;text-align:center;font-family:inherit;color:var(--accent);outline:none;transition:border-color .15s;}
.efield-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
.efield-input:disabled{background:var(--surface2);color:var(--text2);border-color:var(--border);}
.done-banner{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:var(--r-sm);padding:12px 16px;font-size:13px;color:#166534;display:flex;align-items:center;gap:8px;margin-bottom:14px;}

/* ── PROJECT SELECT ── */
.psel-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.psel-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between;}
.psel-item:hover{border-color:var(--accent);box-shadow:var(--sh-sm);}
.psel-name{font-weight:600;font-size:14px;}
.psel-date{font-size:12px;color:var(--text3);margin-top:2px;}

/* ── MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(3px);z-index:500;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:26px;width:100%;max-width:480px;box-shadow:var(--sh-lg);max-height:90vh;overflow-y:auto;animation:mIn .18s ease;}
@keyframes mIn{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-size:16px;font-weight:700;margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--text2);margin-bottom:18px;}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
.modal-foot-space{justify-content:space-between;}

/* ── FORM ── */
.fg{margin-bottom:14px;}
.fl{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.fi{width:100%;padding:8px 11px;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:14px;font-family:inherit;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s;}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08);}
.field-list{display:flex;flex-direction:column;gap:7px;}
.field-item{display:flex;gap:7px;align-items:center;}
.field-item .fi{flex:1;}
.rm-btn{width:26px;height:26px;border:none;border-radius:5px;background:#fef2f2;color:var(--danger);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.rm-btn:hover{background:var(--danger);color:#fff;}
.add-field-btn{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:12px;font-weight:500;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px 0;margin-top:4px;}
.add-field-btn:hover{text-decoration:underline;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border);}
.toggle-label{font-size:14px;font-weight:500;}
.toggle-desc{font-size:12px;color:var(--text3);margin-top:1px;}
.tog{position:relative;width:40px;height:22px;flex-shrink:0;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;inset:0;background:var(--border2);border-radius:22px;cursor:pointer;transition:.25s;}
.tog-sl:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
input:checked+.tog-sl{background:var(--accent);}
input:checked+.tog-sl:before{transform:translateX(18px);}

/* ── DIVIDER ── */
.section-divider{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 10px;}

/* ── TOAST ── */
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:7px;}
.toast{background:var(--text);color:#fff;padding:11px 16px;border-radius:var(--r-sm);font-size:13px;box-shadow:var(--sh-lg);animation:tIn .25s ease;min-width:180px;}
.toast.ok{background:var(--success);}
.toast.err{background:var(--danger);}
@keyframes tIn{from{transform:translateX(16px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── EMPTY ── */
.empty{text-align:center;padding:48px 20px;color:var(--text3);}
.empty-ico{font-size:36px;margin-bottom:10px;}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

@media(max-width:600px){
  .wrap,.wrap-sm{padding:16px;}
  .project-grid{grid-template-columns:1fr;}
  .summary-row{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon">&#128202;</div>
    活動人次追蹤系統
  </div>
  <div class="topbar-right">
    <div class="sync-pill">
      <div class="sdot" id="syncDot"></div>
      <span id="syncText">連線中...</span>
    </div>
    <button class="role-btn" id="switchRoleBtn" onclick="window.switchRole()">切換至編輯者</button>
  </div>
</div>

<!-- 協助者 -->
<div class="view active" id="viewAssistant">
  <div class="wrap-sm">
    <div id="assistantList">
      <div class="ph">
        <div>
          <div class="ph-title">選擇活動專案</div>
          <div class="ph-sub">請選擇您要填報的活動</div>
        </div>
      </div>
      <div id="assistantListInner" class="psel-list"></div>
    </div>
    <div id="assistantForm" style="display:none">
      <button class="back-btn" onclick="backToList()">&#8592; 返回選擇專案</button>
      <div class="entry-card">
        <h3 id="entryName"></h3>
        <div class="entry-meta" id="entryMeta"></div>
        <div id="entryFields" class="entry-fields"></div>
        <div id="doneBanner" class="done-banner" style="display:none">
          &#10003; 今日數據已送出，欄位顯示已填報數字
        </div>
        <button class="btn btn-primary btn-full btn-lg" id="submitBtn" onclick="handleSubmit()">送出</button>
      </div>
    </div>
  </div>
</div>

<!-- 編輯者：專案列表 -->
<div class="view" id="viewEditor">
  <div class="wrap">
    <div class="ph">
      <div>
        <div class="ph-title">專案總覽</div>
        <div class="ph-sub">拖曳卡片可調整順序</div>
      </div>
      <button class="btn btn-primary" onclick="openNewProjectModal()">&#65291; 新增專案</button>
    </div>
    <div class="project-grid" id="editorGrid"></div>
  </div>
</div>

<!-- 編輯者：專案詳情 -->
<div class="view" id="viewDetail">
  <div class="wrap">
    <button class="back-btn" onclick="backToEditor()">&#8592; 返回專案列表</button>
    <div class="ph">
      <div>
        <div class="ph-title" id="detailName"></div>
        <div class="ph-sub" id="detailDates"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="openEditModal()">&#9881; 編輯設定</button>
        <button class="btn btn-ghost btn-sm" onclick="openManualModal()">&#65291; 手動新增數據</button>
      </div>
    </div>
    <div id="summaryRow" class="summary-row"></div>
    <div class="table-wrap">
      <table><thead id="tHead"></thead><tbody id="tBody"></tbody></table>
    </div>
  </div>
</div>

<!-- MODAL: 新增/編輯專案 -->
<div class="overlay" id="projectModal">
  <div class="modal">
    <div class="modal-title" id="projectModalTitle">新增專案</div>
    <div class="modal-sub">設定活動資訊與登記項目</div>
    <div class="fg">
      <label class="fl">活動名稱</label>
      <input class="fi" id="fieldName" placeholder="例：2026 夏日藝術展">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="fg">
        <label class="fl">開始日期</label>
        <input class="fi" type="date" id="fieldStart">
      </div>
      <div class="fg">
        <label class="fl">結束日期</label>
        <input class="fi" type="date" id="fieldEnd">
      </div>
    </div>
    <div class="fg">
      <label class="fl">登記項目</label>
      <div class="field-list" id="fieldList"></div>
      <button class="add-field-btn" onclick="addFieldItem()">&#65291; 新增項目</button>
    </div>
    <div class="section-divider">專案狀態</div>
    <div class="toggle-row">
      <div>
        <div class="toggle-label">進行中</div>
        <div class="toggle-desc">開啟後協助者可看到此專案</div>
      </div>
      <label class="tog">
        <input type="checkbox" id="statusToggle" checked>
        <span class="tog-sl"></span>
      </label>
    </div>
    <div class="modal-foot modal-foot-space">
      <button class="btn btn-danger btn-sm" id="deleteBtn" onclick="deleteProject()" style="display:none">刪除專案</button>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="closeModal('projectModal')">取消</button>
        <button class="btn btn-primary" onclick="saveProject()">儲存</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: 手動新增數據 -->
<div class="overlay" id="manualModal">
  <div class="modal">
    <div class="modal-title">手動新增數據</div>
    <div class="modal-sub" id="manualSub"></div>
    <div class="fg">
      <label class="fl">日期</label>
      <input class="fi" type="date" id="manualDate">
    </div>
    <div id="manualFields"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal('manualModal')">取消</button>
      <button class="btn btn-primary" onclick="saveManualEntry()">儲存</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
var projects = {};
var projectOrder = [];
var currentRole = 'assistant';
var currentProjectId = null;
var editingProjectId = null;
var dragSrcEl = null;

/* ── UI UTILS ── */
function showView(id) {
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}
function setSyncStatus(s, t) {
  document.getElementById('syncDot').className = 'sdot ' + s;
  document.getElementById('syncText').textContent = t;
}
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
window.openModal = openModal;
window.closeModal = closeModal;
function todayStr() {
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, type) {
  var w = document.getElementById('toastWrap');
  var t = document.createElement('div');
  t.className = 'toast' + (type === 'err' ? ' err' : type === 'ok' ? ' ok' : '');
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3000);
}

document.querySelectorAll('.overlay').forEach(function(o){
  o.addEventListener('click', function(e){ if(e.target===o) o.classList.remove('open'); });
});

/* ── ROLE ── */
function switchRole() {
  currentRole = currentRole === 'assistant' ? 'editor' : 'assistant';
  document.getElementById('switchRoleBtn').textContent =
    currentRole === 'assistant' ? '切換至編輯者' : '切換至協助者';
  if (currentRole === 'assistant') { showView('viewAssistant'); renderAssistantProjects(); }
  else { showView('viewEditor'); renderEditorProjects(); }
}
window.switchRole = switchRole;

/* ── RENDER ── */
function renderAssistantProjects() {
  var el = document.getElementById('assistantListInner');
  var active = projectOrder.filter(function(k){ return projects[k] && projects[k].status === 'active'; });
  if (!active.length) {
    el.innerHTML = '<div class="empty"><div class="empty-ico">&#128237;</div><p>目前沒有進行中的活動</p></div>';
    return;
  }
  el.innerHTML = active.map(function(k){
    var p = projects[k];
    return '<div class="psel-item" onclick="selectProject(\'' + k + '\')">' +
      '<div><div class="psel-name">'+esc(p.name)+'</div>'+
      '<div class="psel-date">'+p.startDate+' ～ '+p.endDate+'</div></div>'+
      '<span style="color:var(--accent);font-size:16px">&#8250;</span></div>';
  }).join('');
}

function renderEditorProjects() {
  var el = document.getElementById('editorGrid');
  if (!projectOrder.length) {
    el.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-ico">&#128193;</div><p>尚無專案，點擊「新增專案」開始</p></div>';
    return;
  }
  el.innerHTML = projectOrder.filter(function(k){ return !!projects[k]; }).map(function(k){
    var p = projects[k];
    var total = 0;
    Object.values(p.entries||{}).forEach(function(e){ Object.values(e).forEach(function(v){ total+=(parseInt(v)||0); }); });
    var on = p.status === 'active';
    return '<div class="pcard" draggable="true" data-id="'+k+'"'+
      ' ondragstart="onDS(event)" ondragover="onDO(event)" ondrop="onDP(event)" ondragleave="onDL(event)" ondragend="onDE(event)"'+
      ' onclick="openDetail(\'' + k + '\')">' +
      '<div class="pcard-head">'+
      '<div class="pcard-title">'+esc(p.name)+'</div>'+
      '<span class="badge '+(on?'badge-on':'badge-off')+'">'+(on?'進行中':'已結束')+'</span></div>'+
      '<div class="pcard-date">'+p.startDate+' ～ '+p.endDate+'</div>'+
      '<div class="pcard-fields">'+((p.fields||[]).join(' · ')||'—')+'</div>'+
      '<div class="pcard-stats">'+
      '<div class="stat"><div class="stat-n">'+Object.keys(p.entries||{}).length+'</div><div class="stat-l">填報天數</div></div>'+
      '<div class="stat"><div class="stat-n">'+total.toLocaleString()+'</div><div class="stat-l">累計人次</div></div>'+
      '</div></div>';
  }).join('');
}

function renderDetail(id) {
  var p = projects[id]; if (!p) return;
  document.getElementById('detailName').textContent = p.name;
  document.getElementById('detailDates').textContent = p.startDate + ' ～ ' + p.endDate;
  var fields = p.fields||[], entries = p.entries||{};
  /* summary — 只顯示各項目總和，無「累計總人次」 */
  var ft = fields.map(function(_,fi){
    var t=0; Object.values(entries).forEach(function(e){ t+=parseInt(e['f'+fi]||0); }); return t;
  });
  document.getElementById('summaryRow').innerHTML = fields.map(function(f,i){
    return '<div class="scard"><div class="scard-n">'+ft[i].toLocaleString()+'</div><div class="scard-l">'+esc(f)+'</div></div>';
  }).join('');
  /* table — all cells centered */
  var dates = Object.keys(entries).sort();
  var th = document.getElementById('tHead'), tb = document.getElementById('tBody');
  if (!dates.length) {
    th.innerHTML=''; tb.innerHTML='<tr><td colspan="99" style="text-align:center;padding:32px;color:var(--text3)">尚無數據</td></tr>'; return;
  }
  th.innerHTML='<tr><th>日期</th>'+fields.map(function(f){return '<th>'+esc(f)+'</th>';}).join('')+'<th>當日合計</th></tr>';
  var ct=fields.map(function(){return 0;}), gs=0;
  tb.innerHTML=dates.map(function(d){
    var e=entries[d]||{};
    var rv=fields.map(function(_,i){return parseInt(e['f'+i]||0);});
    var rs=rv.reduce(function(a,b){return a+b;},0);
    rv.forEach(function(v,i){ct[i]+=v;}); gs+=rs;
    return '<tr><td class="date-cell">'+d+'</td>'+rv.map(function(v){return '<td>'+v.toLocaleString()+'</td>';}).join('')+'<td style="font-weight:600;color:var(--accent)">'+rs.toLocaleString()+'</td></tr>';
  }).join('')+
  '<tr class="total-row"><td>合計</td>'+ct.map(function(v){return '<td>'+v.toLocaleString()+'</td>';}).join('')+'<td>'+gs.toLocaleString()+'</td></tr>';
}

function refreshView() {
  if (currentRole==='assistant') renderAssistantProjects();
  else if (currentProjectId && document.getElementById('viewDetail').classList.contains('active')) renderDetail(currentProjectId);
  else if (currentRole==='editor') renderEditorProjects();
}

/* ── ASSISTANT ── */
window.selectProject = function(id) {
  currentProjectId = id;
  var p = projects[id];
  document.getElementById('assistantList').style.display = 'none';
  document.getElementById('assistantForm').style.display = 'block';
  document.getElementById('entryName').textContent = p.name;
  document.getElementById('entryMeta').textContent = '填報日期：' + todayStr();
  document.getElementById('doneBanner').style.display = 'none';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('entryFields').innerHTML = (p.fields||[]).map(function(f,i){
    return '<div class="efield-row"><div class="efield-label">'+esc(f)+'</div>'+
      '<input class="efield-input" type="number" min="0" id="ef_'+i+'" placeholder="0"></div>';
  }).join('');
};

window.backToList = function() {
  document.getElementById('assistantList').style.display = 'block';
  document.getElementById('assistantForm').style.display = 'none';
};

window.handleSubmit = function() {
  /* 直接送出，不用預覽 */
  var p = projects[currentProjectId];
  var values = (p.fields||[]).map(function(f,i){
    return { label:f, value:parseInt(document.getElementById('ef_'+i).value)||0 };
  });
  if (window._dbSubmit) {
    window._dbSubmit(currentProjectId, todayStr(), values);
  } else {
    toast('資料庫尚未就緒，請稍後', 'err');
  }
};

/* ── EDITOR ── */
window.openDetail = function(id) {
  currentProjectId = id;
  showView('viewDetail');
  renderDetail(id);
};
window.backToEditor = function() {
  currentProjectId = null;
  showView('viewEditor');
  renderEditorProjects();
};

window.openNewProjectModal = function() {
  editingProjectId = null;
  document.getElementById('projectModalTitle').textContent = '新增專案';
  document.getElementById('fieldName').value = '';
  document.getElementById('fieldStart').value = '';
  document.getElementById('fieldEnd').value = '';
  document.getElementById('fieldList').innerHTML = '';
  document.getElementById('statusToggle').checked = true;
  document.getElementById('deleteBtn').style.display = 'none';
  addFieldItem('一般入場');
  openModal('projectModal');
};

window.openEditModal = function() {
  if (!currentProjectId) return;
  editingProjectId = currentProjectId;
  var p = projects[currentProjectId];
  document.getElementById('projectModalTitle').textContent = '編輯設定';
  document.getElementById('fieldName').value = p.name;
  document.getElementById('fieldStart').value = p.startDate;
  document.getElementById('fieldEnd').value = p.endDate;
  document.getElementById('statusToggle').checked = p.status === 'active';
  document.getElementById('deleteBtn').style.display = 'inline-flex';
  var fl = document.getElementById('fieldList'); fl.innerHTML = '';
  (p.fields||[]).forEach(function(f){ addFieldItem(f); });
  openModal('projectModal');
};

function addFieldItem(val) {
  var fl = document.getElementById('fieldList');
  var div = document.createElement('div'); div.className = 'field-item';
  div.innerHTML = '<input class="fi" placeholder="例：一般入場" value="'+esc(val||'')+'">'+
    '<button class="rm-btn" onclick="this.parentElement.remove()">&#215;</button>';
  fl.appendChild(div);
}
window.addFieldItem = addFieldItem;

window.openManualModal = function() {
  var p = projects[currentProjectId];
  document.getElementById('manualSub').textContent = p.name;
  document.getElementById('manualDate').value = todayStr();
  document.getElementById('manualFields').innerHTML = (p.fields||[]).map(function(f,i){
    return '<div class="fg"><label class="fl">'+esc(f)+'</label>'+
      '<input class="fi" type="number" min="0" id="mf_'+i+'" placeholder="0"></div>';
  }).join('');
  openModal('manualModal');
};

/* ── DRAG & DROP ── */
window.onDS = function(e){ dragSrcEl=e.currentTarget; dragSrcEl.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',dragSrcEl.dataset.id); };
window.onDO = function(e){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
window.onDL = function(e){ e.currentTarget.classList.remove('drag-over'); };
window.onDE = function(e){ e.currentTarget.classList.remove('dragging'); };
window.onDP = function(e){ e.preventDefault(); }; /* overwritten after Firebase ready */

/* ── FIREBASE ── */
(async function(){
  try {
    var fbApp = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    var fbDb  = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
    var initializeApp=fbApp.initializeApp, getApps=fbApp.getApps;
    var getDatabase=fbDb.getDatabase, ref=fbDb.ref, set=fbDb.set, update=fbDb.update, remove=fbDb.remove, onValue=fbDb.onValue;
    var app = getApps().length ? getApps()[0] : initializeApp({databaseURL:'https://project-1794474641398451810-default-rtdb.asia-southeast1.firebasedatabase.app/'});
    var db = getDatabase(app);

    setSyncStatus('syncing','連線中...');
    onValue(ref(db,'tracker'), function(snap){
      var d = snap.val()||{};
      projects = d.projects||{};
      projectOrder = d.projectOrder||Object.keys(projects);
      Object.keys(projects).forEach(function(k){ if(projectOrder.indexOf(k)<0) projectOrder.push(k); });
      projectOrder = projectOrder.filter(function(k){ return !!projects[k]; });
      setSyncStatus('synced','已同步');
      refreshView();
    }, function(err){ setSyncStatus('error','連線失敗'); toast('連線失敗：'+err.message,'err'); });

    /* Seed if empty */
    try {
      var s0 = await new Promise(function(res){ var u=onValue(ref(db,'tracker/projects'),function(s){u();res(s);}); });
      if (!s0.val()) {
        await update(ref(db,'tracker/projects/p_citynorth2026'),{name:'2026城西夏樂慶',startDate:'2026-05-16',endDate:'2026-05-31',fields:['服務台人次'],status:'active'});
        await update(ref(db,'tracker'),{projectOrder:['p_citynorth2026']});
      }
    } catch(e){ console.warn('seed skip',e.message); }

    /* DB writes */
    window._dbSubmit = async function(pid, date, values) {
      var obj={}; values.forEach(function(v,i){ obj['f'+i]=v.value; });
      try {
        await set(ref(db,'tracker/projects/'+pid+'/entries/'+date), obj);
        /* 送出後：disable inputs & show filled values */
        values.forEach(function(v,i){
          var el = document.getElementById('ef_'+i);
          if (el) { el.value = v.value; el.disabled = true; }
        });
        document.getElementById('doneBanner').style.display = 'flex';
        document.getElementById('submitBtn').disabled = true;
        toast('✅ 數據已送出！','ok');
      } catch(e){ toast('送出失敗：'+e.message,'err'); }
    };

    window.saveProject = async function() {
      var name  = document.getElementById('fieldName').value.trim();
      var start = document.getElementById('fieldStart').value;
      var end   = document.getElementById('fieldEnd').value;
      var fields= Array.from(document.querySelectorAll('#fieldList .field-item .fi')).map(function(i){return i.value.trim();}).filter(Boolean);
      var status= document.getElementById('statusToggle').checked ? 'active' : 'ended';
      if (!name||!start||!end){ toast('請填寫活動名稱與日期','err'); return; }
      if (!fields.length){ toast('請至少新增一個登記項目','err'); return; }
      var id = editingProjectId||'p_'+Date.now();
      setSyncStatus('syncing','儲存中...');
      try {
        await update(ref(db,'tracker/projects/'+id),{name:name,startDate:start,endDate:end,fields:fields,status:status});
        if (!editingProjectId) await update(ref(db,'tracker'),{projectOrder:projectOrder.concat([id])});
        closeModal('projectModal');
        toast('✅ 已儲存','ok');
      } catch(e){ toast('儲存失敗：'+e.message,'err'); setSyncStatus('error','儲存失敗'); }
    };

    window.deleteProject = async function() {
      if (!editingProjectId) return;
      var p = projects[editingProjectId];
      if (!confirm('確定要刪除「'+(p?p.name:editingProjectId)+'」？此操作無法復原。')) return;
      try {
        await remove(ref(db,'tracker/projects/'+editingProjectId));
        var newOrder = projectOrder.filter(function(k){ return k !== editingProjectId; });
        await update(ref(db,'tracker'),{projectOrder:newOrder});
        closeModal('projectModal');
        /* if we're in detail view, go back */
        if (currentProjectId === editingProjectId) { currentProjectId=null; showView('viewEditor'); }
        toast('專案已刪除');
      } catch(e){ toast('刪除失敗：'+e.message,'err'); }
    };

    window.saveManualEntry = async function() {
      var date = document.getElementById('manualDate').value;
      if (!date){ toast('請選擇日期','err'); return; }
      var p=projects[currentProjectId], obj={};
      (p.fields||[]).forEach(function(_,i){ obj['f'+i]=parseInt(document.getElementById('mf_'+i).value)||0; });
      try {
        await set(ref(db,'tracker/projects/'+currentProjectId+'/entries/'+date), obj);
        closeModal('manualModal');
        toast('✅ 數據已儲存','ok');
      } catch(e){ toast('儲存失敗：'+e.message,'err'); }
    };

    window.onDP = function(e) {
      e.preventDefault();
      var tgt=e.currentTarget; tgt.classList.remove('drag-over');
      if (!dragSrcEl||dragSrcEl===tgt) return;
      var si=projectOrder.indexOf(dragSrcEl.dataset.id), ti=projectOrder.indexOf(tgt.dataset.id);
      if (si<0||ti<0) return;
      projectOrder.splice(si,1); projectOrder.splice(ti,0,dragSrcEl.dataset.id);
      update(ref(db,'tracker'),{projectOrder:projectOrder.slice()});
    };

    console.log('Firebase ready');
  } catch(err){
    console.error('Firebase error:',err);
    setSyncStatus('error','連線失敗');
    toast('初始化失敗：'+err.message,'err');
  }
})();
</script>
</body>
</html>
