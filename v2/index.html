<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>人次填報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
button,input,select{-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#F5F2EC;
  --surface:#FFFFFF;
  --surface2:#EDEAE3;
  --line:#DDD8CE;
  --line-light:#EDEAE3;
  --amber:#C8900E;
  --amber-pale:#FDF6E0;
  --amber-mid:#EDD080;
  --teal:#1A8F6A;
  --teal-pale:#E3F4EE;
  --danger:#C0422A;
  --text:#1C1A14;
  --text2:#4A4640;
  --text3:#8A8278;
  --mono:'DM Mono',monospace;
  --sans:'Noto Sans TC',system-ui,sans-serif;
  --safe-top:env(safe-area-inset-top, 0px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1C24;--surface:#252830;--surface2:#2A2C38;
  --line:#363848;--line-light:#2E3040;
  --amber-pale:#2A2010;--teal-pale:#0E2A22;
  --text:#F0EDE6;--text2:#C8C4BA;--text3:#7A7870;
}}
:root[data-theme="dark"]{
  --bg:#1A1C24;--surface:#252830;--surface2:#2A2C38;
  --line:#363848;--line-light:#2E3040;
  --amber-pale:#2A2010;--teal-pale:#0E2A22;
  --text:#F0EDE6;--text2:#C8C4BA;--text3:#7A7870;
}
html{height:100%;background:var(--bg);}
body{
  height:100%;background:var(--bg);
  font-family:var(--sans);color:var(--text);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}

/* Full-screen app layout */
#appRoot{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  /* On desktop: constrain width, center */
  max-width:480px;width:100%;margin:0 auto;
  position:relative;
}
@media(min-width:520px){
  body{align-items:center;justify-content:flex-start;background:#E8E4DC;}
  #appRoot{
    margin-top:32px;margin-bottom:32px;
    border-radius:24px;border:1px solid var(--line);
    box-shadow:0 20px 60px rgba(28,26,20,.15);
    overflow:hidden;background:var(--bg);
    flex:0 0 auto;height:calc(100vh - 64px);max-height:820px;
  }
}

/* Screens */
.screen{display:none;flex-direction:column;flex:1;overflow:hidden;}
.screen.on{display:flex;}

/* ── Topbar ─────────────────────────────────────── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-top) + 12px) 20px 12px;
  flex-shrink:0;border-bottom:1px solid var(--line-light);
  background:var(--bg);
}
.tb-logo{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.18em;font-weight:500;}
.tb-sync{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.05em;}
.tb-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .3s;}
.tb-dot.ok{background:var(--teal);}
.tb-dot.err{background:var(--danger);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.tb-dot.sync{background:var(--amber);animation:blink 1.2s infinite;}
.tb-back{
  font-family:var(--mono);font-size:11px;color:var(--text2);
  background:none;border:none;cursor:pointer;
  display:flex;align-items:center;gap:6px;letter-spacing:.04em;padding:6px 0;
  -webkit-appearance:none;
}
.tb-back-arrow{display:block;flex-shrink:0;pointer-events:none;color:var(--amber);}

/* ── Project list screen ─────────────────────────── */
.list-header{padding:28px 20px 16px;flex-shrink:0;}
.list-hl{
  font-size:32px;font-weight:500;color:var(--text);
  line-height:1.15;letter-spacing:-.5px;
}
.list-hl span{display:block;color:var(--amber);}
.list-sub{font-size:13px;color:var(--text3);margin-top:8px;}

.proj-list{padding:4px 16px 0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;}
.proj-card{
  width:100%;text-align:left;background:var(--surface);
  border:1.5px solid var(--line);border-radius:16px;
  padding:16px 18px;cursor:pointer;position:relative;
  transition:border-color .15s,box-shadow .15s;font-family:var(--sans);
  -webkit-appearance:none;
}
.proj-card:active{border-color:var(--amber);box-shadow:0 2px 12px rgba(200,144,14,.15);}
.pc-name{font-size:15px;font-weight:500;color:var(--text);margin-bottom:5px;}
.pc-dates{font-family:var(--mono);font-size:10px;color:var(--amber);letter-spacing:.04em;margin-bottom:10px;}
.pc-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:9px;padding:4px 9px;
  border-radius:5px;letter-spacing:.07em;
}
.pc-badge.inperiod{background:var(--teal-pale);color:var(--teal);}
.pc-badge.pending-start{background:var(--amber-pale);color:var(--amber);border:1px solid var(--amber-mid);}
.pc-badge.ended-p{background:var(--surface2);color:var(--text3);border:1px solid var(--line);}
.pc-arrow{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  color:var(--line);font-size:20px;font-weight:300;
}

.list-footer{
  padding:14px 20px calc(var(--safe-bottom) + 14px);
  border-top:1px solid var(--line-light);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
}
.admin-lnk{font-family:var(--mono);font-size:9px;color:var(--text3);background:none;border:none;cursor:pointer;letter-spacing:.07em;padding:0;}
.admin-lnk:active{color:var(--amber);}

/* ── Offline banner ── */
.offline-banner{background:var(--danger);color:#fff;font-family:var(--mono);font-size:10px;padding:8px 20px;letter-spacing:.06em;display:none;flex-shrink:0;align-items:center;justify-content:center;gap:6px;}
.offline-banner.show{display:flex;}

/* ── Report screen ─────────────────────────────────── */
.date-block{
  padding:20px 20px 12px;flex-shrink:0;cursor:pointer;position:relative;
  border-bottom:1px solid var(--line-light);
}
.date-big{font-family:var(--mono);font-size:30px;font-weight:500;color:var(--text);letter-spacing:-1.5px;line-height:1;}
.date-wd{font-size:12px;color:var(--text3);margin-top:5px;}
.date-hint{font-family:var(--mono);font-size:9px;color:var(--amber);letter-spacing:.06em;margin-top:6px;display:flex;align-items:center;gap:4px;}
.date-hidden{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;-webkit-appearance:none;appearance:none;font-size:16px;border:none;background:transparent;}

/* Category tabs */
.cat-tabs{
  display:flex;padding:0 20px;overflow-x:auto;flex-shrink:0;
  scrollbar-width:none;border-bottom:1px solid var(--line-light);
  gap:0;
}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{
  font-family:var(--mono);font-size:11px;
  padding:10px 14px 12px;border-bottom:2px solid transparent;
  color:var(--text3);cursor:pointer;white-space:nowrap;letter-spacing:.05em;flex-shrink:0;
  background:none;border-top:none;border-left:none;border-right:none;
  -webkit-appearance:none;transition:color .14s;
}
.cat-tab.active{color:var(--amber);border-bottom-color:var(--amber);}

/* Status badge */
.st-row{padding:10px 20px 6px;flex-shrink:0;}
.st-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:10px;padding:4px 10px;
  border-radius:5px;letter-spacing:.06em;
}
.st-badge.pending{background:var(--surface2);color:var(--text3);border:1px solid var(--line);}
.st-badge.reported{background:var(--teal-pale);color:var(--teal);}

/* Field rows */
.fields-area{flex:1;overflow-y:auto;}
.field-row{
  display:flex;align-items:center;padding:16px 20px;gap:12px;
  border-bottom:1px solid var(--line-light);transition:background .12s;
}
.field-row:last-child{border-bottom:none;}
.field-row:focus-within{background:var(--amber-pale);}
.fi-left{flex:1;min-width:0;}
.fi-name{font-size:13px;color:var(--text2);letter-spacing:.02em;}
.fi-note{font-size:11px;color:var(--text3);margin-top:3px;}
.fi-num{
  font-family:var(--mono);font-size:40px;font-weight:400;
  color:var(--text);letter-spacing:-1px;line-height:1;
  width:88px;text-align:right;
  border:none;background:transparent;outline:none;
  caret-color:var(--amber);
  -moz-appearance:textfield;appearance:textfield;
}
.fi-num::-webkit-inner-spin-button,.fi-num::-webkit-outer-spin-button{-webkit-appearance:none;}
.fi-num:focus{color:var(--amber);}
.fi-num::placeholder{color:var(--line);}
.fi-unit{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.06em;align-self:flex-end;padding-bottom:6px;}

/* Submit */
.submit-bar{
  padding:12px 20px calc(var(--safe-bottom) + 16px);
  flex-shrink:0;border-top:1px solid var(--line-light);background:var(--bg);
}
.submit-btn{
  width:100%;padding:15px;font-family:var(--mono);font-size:12px;font-weight:500;
  letter-spacing:.14em;color:#fff;background:var(--text);
  border:none;border-radius:12px;cursor:pointer;text-transform:uppercase;
  transition:background .15s,transform .1s;-webkit-appearance:none;
}
.submit-btn:active{background:var(--amber);transform:scale(.99);}

/* Empty state */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:var(--text3);text-align:center;}
.empty-icon{font-size:40px;opacity:.25;margin-bottom:12px;}
.empty-msg{font-family:var(--mono);font-size:11px;letter-spacing:.06em;}

/* Toast */
.toast-wrap{position:fixed;bottom:calc(var(--safe-bottom) + 28px);left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
.toast{
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;
  background:var(--text);color:#fff;
  padding:10px 18px;border-radius:8px;
  white-space:nowrap;max-width:calc(100vw - 48px);text-align:center;
  animation:tIn .2s ease;
}
.toast.ok{background:var(--teal);}
.toast.err{background:var(--danger);}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="appRoot">
  <div class="offline-banner" id="offlineBanner"><svg style="display:block;flex-shrink:0" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> 目前離線，恢復連線後自動同步</div>

  <!-- Project list -->
  <div class="screen on" id="sList">
    <div class="topbar">
      <div class="tb-logo">TRACK</div>
      <div class="tb-sync">
        <div class="tb-dot sync" id="syncDot"></div>
        <span id="syncText">連線中</span>
      </div>
    </div>
    <div class="list-header">
      <div class="list-hl">填報<span>人次</span></div>
      <div class="list-sub">選擇進行中的活動</div>
    </div>
    <div class="proj-list" id="projList"></div>
    <div class="list-footer">
      <button class="admin-lnk" onclick="location.href='/v2/admin/'">管理後台 <svg style="display:inline-block;vertical-align:middle" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
    </div>
  </div>

  <!-- Report -->
  <div class="screen" id="sReport">
    <div class="topbar">
      <button class="tb-back" id="repBack"><svg class="tb-back-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>返回</button>
      <div class="tb-sync">
        <div class="tb-dot" id="syncDot2"></div>
        <span id="syncText2" style="font-family:var(--mono);font-size:9px;color:var(--text3);">連線中</span>
      </div>
    </div>
    <div class="date-block" id="dateBlock">
      <div class="date-big" id="dateBig"></div>
      <div class="date-wd" id="dateWd"></div>
      <div class="date-hint">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        點擊更改日期
      </div>
      <input type="date" class="date-hidden" id="dateInput" onchange="onDateChange()">
    </div>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="st-row"><span class="st-badge pending" id="stBadge">● 尚未回報</span></div>
    <div class="fields-area" id="fieldsArea"></div>
    <div class="submit-bar"><button class="submit-btn" id="submitBtn">SEND ／ 送出</button></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
var projects={}, projectOrder=[], curPid=null, curCat=0, curDate='';
var WD=['日','一','二','三','四','五','六'];

function fname(f){return typeof f==='string'?f:(f&&f.name?f.name:'');}
function fnote(f){return typeof f==='string'?'':(f&&f.note?f.note:'');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(d){var p=d.split('-');return parseInt(p[1])+'月 '+parseInt(p[2])+'日';}
function fmtWd(d){return '星期'+WD[new Date(d+'T00:00:00').getDay()];}
function clamp(d,p){return p.startDate&&d<p.startDate?p.startDate:p.endDate&&d>p.endDate?p.endDate:d;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function setSyncStatus(s,t){
  var cls='tb-dot '+(s==='ok'?'ok':s==='err'?'err':'sync');
  var dot=document.getElementById('syncDot');
  if(dot)dot.className=cls;
  var dot2=document.getElementById('syncDot2');
  if(dot2)dot2.className=cls;
  var tx=document.getElementById('syncText');
  if(tx)tx.textContent=t;
  var tx2=document.getElementById('syncText2');
  if(tx2)tx2.textContent=t;
}

function toast(msg,type){
  var w=document.getElementById('toastWrap');
  var el=document.createElement('div');
  el.className='toast'+(type?' '+type:'');
  el.textContent=msg;w.appendChild(el);
  setTimeout(function(){el.remove();},2800);
}

function show(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on');});
  document.getElementById(id).classList.add('on');
}

/* Project list */
function renderList(){
  var list=document.getElementById('projList');
  // Show all active projects (admin sets status='active')
  var active=projectOrder.filter(function(k){return projects[k]&&projects[k].status==='active';});
  if(!active.length){
    list.innerHTML='<div class="empty"><div class="empty-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3H10l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div><div class="empty-msg">目前沒有進行中的活動</div></div>';
    show('sList');return;
  }
  // Auto-jump if single active project
  if(active.length===1&&!document.getElementById('sReport').classList.contains('on')){
    openReport(active[0]);return;
  }
  list.innerHTML='';
  var today=todayStr();
  active.forEach(function(k){
    var p=projects[k];
    var btn=document.createElement('button');
    btn.className='proj-card';
    var beforeStart=p.startDate&&today<p.startDate;
    var afterEnd=p.endDate&&today>p.endDate;
    var inPeriod=!beforeStart&&!afterEnd;
    var badgeCls=inPeriod?'inperiod':beforeStart?'pending-start':'ended-p';
    var dot='<span style="width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block;vertical-align:middle;"></span>';
    var badgeTxt=inPeriod?dot+' 進行中':beforeStart?'○ 尚未開始':'○ 活動已結束';
    btn.innerHTML=
      '<div class="pc-name">'+esc(p.name)+'</div>'+
      '<div class="pc-dates">'+esc(p.startDate||'—')+' ～ '+esc(p.endDate||'—')+'</div>'+
      '<span class="pc-badge '+badgeCls+'">'+badgeTxt+'</span>'+
      '<span class="pc-arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>';
    btn.onclick=function(){openReport(k);};
    list.appendChild(btn);
  });
  show('sList');
}

/* Report */
function openReport(pid){
  curPid=pid;curCat=0;
  var p=projects[pid];
  curDate=clamp(todayStr(),p);
  document.getElementById('repBack').childNodes[document.getElementById('repBack').childNodes.length-1].textContent=' '+p.name;
  updateDateDisplay();renderCatTabs();renderFields();
  show('sReport');
}

function updateDateDisplay(){
  document.getElementById('dateBig').textContent=fmtDate(curDate);
  document.getElementById('dateWd').textContent=fmtWd(curDate);
  var inp=document.getElementById('dateInput'),p=projects[curPid];
  inp.value=curDate;inp.min=p.startDate||'';inp.max=p.endDate||'';
}

window.onDateChange=function(){
  var el=document.getElementById('dateInput'),d=el.value;if(!d)return;
  var p=projects[curPid];
  if(p.startDate&&d<p.startDate){el.value=p.startDate;d=p.startDate;toast('只能選擇活動期間（'+p.startDate+' ～ '+p.endDate+'）','err');}
  else if(p.endDate&&d>p.endDate){el.value=p.endDate;d=p.endDate;toast('只能選擇活動期間（'+p.startDate+' ～ '+p.endDate+'）','err');}
  curDate=d;updateDateDisplay();renderCatTabs();renderFields();
};

function renderCatTabs(){
  var p=projects[curPid],tabs=document.getElementById('catTabs');
  tabs.innerHTML='';
  (p.categories||[]).forEach(function(cat,i){
    var btn=document.createElement('button');
    btn.className='cat-tab'+(i===curCat?' active':'');
    btn.textContent=cat.name;
    btn.onclick=function(){curCat=i;renderCatTabs();renderFields();};
    tabs.appendChild(btn);
  });
}

function getEntry(){
  var p=projects[curPid],key='cat'+curCat+'_'+curDate;
  return (p.entries&&p.entries[key])||null;
}

function renderFields(){
  var p=projects[curPid],cat=(p.categories||[])[curCat];
  if(!cat){document.getElementById('fieldsArea').innerHTML='';return;}
  var ent=getEntry();
  var sb=document.getElementById('stBadge');
  sb.className='st-badge '+(ent?'reported':'pending');
  sb.innerHTML=ent
    ?'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:4px"><polyline points="20 6 9 17 4 12"/></svg>已回報'
    :'<span style="width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;vertical-align:middle;margin-right:4px"></span>尚未回報';
  var area=document.getElementById('fieldsArea');area.innerHTML='';
  (cat.fields||[]).forEach(function(f,fi){
    var val=ent?(ent['f'+fi]!=null?ent['f'+fi]:''):'';
    var row=document.createElement('div');row.className='field-row';
    var note=fnote(f);
    row.innerHTML=
      '<div class="fi-left"><div class="fi-name">'+esc(fname(f))+'</div>'+
      (note?'<div class="fi-note">'+esc(note)+'</div>':'')+
      '</div>'+
      '<input class="fi-num" id="fn_'+fi+'"'+
        ' type="text" inputmode="numeric" pattern="[0-9]*"'+
        ' value="'+esc(String(val))+'" placeholder="—" autocomplete="off">'+
      '<div class="fi-unit">人</div>';
    area.appendChild(row);
  });
}

document.getElementById('repBack').onclick=function(){curPid=null;show('sList');};

document.getElementById('submitBtn').onclick=function(){
  if(!curPid)return;
  var p=projects[curPid];
  if(p.startDate&&curDate<p.startDate||p.endDate&&curDate>p.endDate){
    toast('日期不在活動期間內','err');return;
  }
  var cat=(p.categories||[])[curCat];if(!cat)return;
  var data={},any=false;
  var ok=true;
  (cat.fields||[]).forEach(function(f,fi){
    var inp=document.getElementById('fn_'+fi);
    var v=(inp?inp.value:'').trim();
    if(v!==''){
      var n=parseInt(v);
      if(isNaN(n)||n<0){toast('數值必須為整數 ≥ 0','err');ok=false;return;}
      data['f'+fi]=n;any=true;
    }
  });
  if(!ok)return;
  if(!any){toast('請至少填寫一個數值','err');return;}
  var isOverwrite=!!getEntry();
  if(isOverwrite&&!confirm('「'+curDate+'」的「'+cat.name+'」已填報過，確定要覆蓋？'))return;
  if(!window._dbSet){toast('資料庫尚未就緒，請稍後','err');return;}
  var key='cat'+curCat+'_'+curDate;
  window._dbSet(curPid,key,data,cat.name,isOverwrite);
};

/* Firebase */
(async function(){
  try{
    var fbApp=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    var fbDb=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
    var initializeApp=fbApp.initializeApp,getApps=fbApp.getApps;
    var getDatabase=fbDb.getDatabase,ref=fbDb.ref,set=fbDb.set,onValue=fbDb.onValue;
    var app=getApps().length?getApps()[0]:initializeApp({
      databaseURL:'https://project-1794474641398451810-default-rtdb.asia-southeast1.firebasedatabase.app/'
    });
    var db=getDatabase(app);
    window.addEventListener('online',function(){document.getElementById('offlineBanner').classList.remove('show');});
    window.addEventListener('offline',function(){document.getElementById('offlineBanner').classList.add('show');setSyncStatus('err','離線中');});
    if(!navigator.onLine)document.getElementById('offlineBanner').classList.add('show');
    setSyncStatus('sync','連線中...');
    onValue(ref(db,'tracker'),function(snap){
      var d=snap.val()||{};
      projects=d.projects||{};
      projectOrder=d.projectOrder||Object.keys(projects);
      Object.keys(projects).forEach(function(k){if(projectOrder.indexOf(k)<0)projectOrder.push(k);});
      projectOrder=projectOrder.filter(function(k){return!!projects[k];});
      setSyncStatus('ok','已同步');
      renderList();
      if(curPid&&document.getElementById('sReport').classList.contains('on')){
        renderCatTabs();renderFields();
      }
    },function(e){setSyncStatus('err','連線失敗');toast('連線失敗','err');});
    window._dbSet=async function(pid,entryKey,dataObj,catName,isOverwrite){
      var p=projects[pid];
      try{
        await set(ref(db,'tracker/projects/'+pid+'/entries/'+entryKey),dataObj);
        toast((catName||'數據')+' 已送出 ✓','ok');
        if(p&&p.entries)p.entries[entryKey]=dataObj;
        renderCatTabs();renderFields();
        var vals=Object.keys(dataObj).map(function(k){return k+':'+dataObj[k];}).join('、');
        var t=Date.now();
        set(ref(db,'tracker/logs/'+t),{t:t,u:'協助者(v2)',a:isOverwrite?'覆蓋填報':'填報數據',d:entryKey+' @ '+(p?p.name:pid)+'｜'+vals}).catch(function(){});
      }catch(e){setSyncStatus('err','送出失敗');toast('送出失敗，請稍後重試','err');}
    };
  }catch(e){setSyncStatus('err','初始化失敗');toast('初始化失敗','err');}
})();
</script>
