<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>人次追蹤 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#F5F2EC;
  --surface:#FFFFFF;
  --surface2:#EDEAE3;
  --line:#DDD8CE;
  --line-light:#EDEAE3;
  --amber:#B07D0A;
  --amber-bright:#C8900E;
  --amber-pale:#FDF6E0;
  --amber-mid:#EDD080;
  --teal:#1A8F6A;
  --teal-pale:#E3F4EE;
  --danger:#C0422A;
  --danger-pale:#FDECEA;
  --text:#1C1A14;
  --text2:#4A4640;
  --text3:#8A8278;
  --mono:'DM Mono',monospace;
  --sans:'Noto Sans TC',system-ui,sans-serif;
}
html,body{
  height:100%;background:var(--bg);
  font-family:var(--sans);color:var(--text);
  -webkit-font-smoothing:antialiased;
}
body{
  display:flex;justify-content:center;align-items:flex-start;
  padding-block:16px env(safe-area-inset-bottom,16px);
  padding-inline:12px;
  min-height:100%;
}

/* ── Phone Shell ── */
.shell{
  width:100%;max-width:430px;
  background:var(--surface);
  border-radius:28px;
  border:1.5px solid var(--line);
  box-shadow:0 16px 48px rgba(28,26,20,.12),0 4px 12px rgba(28,26,20,.07);
  overflow:hidden;
  display:flex;flex-direction:column;
  min-height:calc(100svh - 32px);
}
.notch{
  height:28px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding-top:8px;flex-shrink:0;
}
.notch-pill{width:80px;height:5px;background:#CCC8BF;border-radius:5px;}

/* ── Screens ── */
.screen{display:none;flex-direction:column;flex:1;overflow:hidden;}
.screen.on{display:flex;}

/* ── Topbar ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px 10px;flex-shrink:0;
  border-bottom:1px solid var(--line-light);
}
.tb-logo{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.18em;font-weight:500;}
.tb-sync{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.05em;}
.tb-dot{width:5px;height:5px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .3s;}
.tb-dot.ok{background:var(--teal);}
.tb-dot.err{background:var(--danger);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.tb-dot.sync{background:var(--amber);animation:blink 1.2s infinite;}
.tb-back{
  font-family:var(--mono);font-size:10px;color:var(--text2);
  background:none;border:none;cursor:pointer;
  display:flex;align-items:center;gap:5px;
  letter-spacing:.04em;padding:0;
}
.tb-back::before{content:"←";color:var(--amber);}
.tb-tag{font-family:var(--mono);font-size:9px;color:var(--amber);letter-spacing:.1em;text-transform:uppercase;}

/* ── Project list ── */
.list-header{padding:24px 20px 14px;flex-shrink:0;}
.list-hl{font-family:var(--mono);font-size:26px;font-weight:500;color:var(--text);line-height:1.1;letter-spacing:-1px;}
.list-sub{font-size:12px;color:var(--text3);margin-top:6px;}
.proj-list{padding:0 14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;padding-bottom:16px;}
.proj-card{
  width:100%;text-align:left;background:var(--surface);
  border:1.5px solid var(--line);border-radius:14px;
  padding:14px 16px 12px;cursor:pointer;position:relative;overflow:hidden;
  transition:border-color .18s,box-shadow .18s;font-family:var(--sans);
}
.proj-card:hover,.proj-card:focus-visible{
  border-color:var(--amber-bright);
  box-shadow:0 2px 14px rgba(176,125,10,.12);outline:none;
}
.proj-card::before{
  content:'';position:absolute;left:0;top:8px;bottom:8px;
  width:3px;background:var(--amber-bright);border-radius:0 2px 2px 0;
  opacity:0;transition:opacity .18s;
}
.proj-card:hover::before,.proj-card:focus-visible::before{opacity:1;}
.pc-name{font-size:14px;font-weight:500;color:var(--text);margin-bottom:4px;}
.pc-dates{font-family:var(--mono);font-size:9px;color:var(--amber);letter-spacing:.04em;margin-bottom:9px;}
.pc-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--mono);font-size:8px;padding:3px 8px;
  border-radius:4px;letter-spacing:.07em;
}
.pc-badge.active{background:var(--teal-pale);color:var(--teal);}
.pc-badge.ended{background:var(--surface2);color:var(--text3);border:1px solid var(--line);}
.pc-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--line);font-size:18px;}
.list-footer{padding:10px 20px 16px;border-top:1px solid var(--line-light);flex-shrink:0;}
.admin-lnk{font-family:var(--mono);font-size:9px;color:var(--amber);background:none;border:none;cursor:pointer;letter-spacing:.07em;padding:0;}

/* ── Report screen ── */
/* Date display (tappable) */
.date-block{padding:16px 20px 10px;flex-shrink:0;cursor:pointer;position:relative;}
.date-big{font-family:var(--mono);font-size:26px;font-weight:500;color:var(--text);letter-spacing:-1px;line-height:1;}
.date-wd{font-size:11px;color:var(--text3);margin-top:4px;}
.date-change-hint{font-family:var(--mono);font-size:9px;color:var(--amber);letter-spacing:.06em;margin-top:5px;display:flex;align-items:center;gap:4px;}
/* Hidden native date input floated over date block */
.date-hidden{
  position:absolute;inset:0;opacity:0;cursor:pointer;
  width:100%;height:100%;
  -webkit-appearance:none;appearance:none;
  font-size:16px;/* prevent iOS zoom */
  border:none;background:transparent;
}

/* Category tabs */
.cat-tabs{
  display:flex;padding:0 20px;overflow-x:auto;
  flex-shrink:0;scrollbar-width:none;
  border-bottom:1px solid var(--line-light);
}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{
  font-family:var(--mono);font-size:10px;
  padding:8px 12px 10px;border-bottom:2px solid transparent;
  color:var(--text3);cursor:pointer;white-space:nowrap;letter-spacing:.05em;flex-shrink:0;
  background:none;border-top:none;border-left:none;border-right:none;
  transition:color .14s,border-color .14s;
}
.cat-tab.active{color:var(--amber);border-bottom-color:var(--amber-bright);}

/* Status badge */
.st-row{padding:8px 20px 4px;flex-shrink:0;}
.st-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:9px;padding:3px 9px;
  border-radius:4px;letter-spacing:.06em;
}
.st-badge.pending{background:var(--surface2);color:var(--text3);border:1px solid var(--line);}
.st-badge.reported{background:var(--teal-pale);color:var(--teal);}

/* Field rows — BIG NUMBER */
.fields-area{flex:1;overflow-y:auto;}
.field-row{
  display:flex;align-items:center;padding:14px 20px;gap:10px;
  border-bottom:1px solid var(--line-light);transition:background .12s;
}
.field-row:last-child{border-bottom:none;}
.field-row:focus-within{background:var(--amber-pale);}
.fi-left{flex:1;min-width:0;}
.fi-name{font-size:12px;color:var(--text2);letter-spacing:.02em;}
.fi-note{font-size:10px;color:var(--text3);margin-top:2px;}
.fi-num{
  font-family:var(--mono);font-size:38px;font-weight:400;
  color:var(--text);letter-spacing:-1px;line-height:1;
  width:80px;text-align:right;
  border:none;background:transparent;outline:none;
  caret-color:var(--amber);
  font-size:38px;/* repeated for iOS override */
  -moz-appearance:textfield;appearance:textfield;
}
.fi-num::-webkit-inner-spin-button,.fi-num::-webkit-outer-spin-button{-webkit-appearance:none;}
.fi-num:focus{color:var(--amber-bright);}
.fi-num::placeholder{color:var(--line);}
.fi-unit{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.06em;align-self:flex-end;padding-bottom:5px;}

/* Submit */
.submit-bar{padding:10px 20px 20px;flex-shrink:0;}
.submit-btn{
  width:100%;padding:14px;font-family:var(--mono);font-size:11px;font-weight:500;
  letter-spacing:.14em;color:#fff;background:var(--text);
  border:none;border-radius:10px;cursor:pointer;text-transform:uppercase;
  transition:background .15s;
}
.submit-btn:hover{background:var(--amber);}
.submit-btn:active{transform:scale(.99);}

/* ── Toast ── */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:center;}
.toast{
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;
  background:var(--text);color:#fff;
  padding:10px 18px;border-radius:8px;
  white-space:nowrap;max-width:calc(100vw - 40px);text-align:center;
  animation:tIn .2s ease;
}
.toast.ok{background:var(--teal);}
.toast.err{background:var(--danger);}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── Offline banner ── */
.offline-banner{background:var(--danger);color:#fff;text-align:center;font-family:var(--mono);font-size:9px;padding:7px 20px;letter-spacing:.06em;display:none;flex-shrink:0;}
.offline-banner.show{display:block;}

/* ── Empty state ── */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:var(--text3);}
.empty-msg{font-family:var(--mono);font-size:11px;letter-spacing:.06em;margin-top:12px;}
</style>
</head>
<body>

<div class="toast-wrap" id="toastWrap"></div>

<div class="shell">
  <div class="notch"><div class="notch-pill"></div></div>
  <div class="offline-banner" id="offlineBanner">⚠ 目前離線，恢復連線後自動同步</div>

  <!-- ── Screen: Project list ── -->
  <div class="screen on" id="sList">
    <div class="topbar">
      <div class="tb-logo">TRACK</div>
      <div class="tb-sync">
        <div class="tb-dot sync" id="syncDot"></div>
        <span id="syncText">連線中</span>
      </div>
    </div>
    <div class="list-header">
      <div class="list-hl">填報<br>人次</div>
      <div class="list-sub">選擇進行中的活動</div>
    </div>
    <div class="proj-list" id="projList"></div>
    <div class="list-footer">
      <button class="admin-lnk" onclick="location.href='../admin/'">編輯者後台 →</button>
    </div>
  </div>

  <!-- ── Screen: Report ── -->
  <div class="screen" id="sReport">
    <div class="topbar">
      <button class="tb-back" id="repBack">返回專案列表</button>
      <div class="tb-sync">
        <div class="tb-dot ok"></div>
        <span style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.05em;">已同步</span>
      </div>
    </div>
    <!-- Date block — tap to change -->
    <div class="date-block" id="dateBlock">
      <div class="date-big" id="dateBig"></div>
      <div class="date-wd" id="dateWd"></div>
      <div class="date-change-hint">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        點擊更改日期
      </div>
      <input type="date" class="date-hidden" id="dateInput" onchange="onDateChange()">
    </div>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="st-row"><span class="st-badge pending" id="stBadge">● 尚未回報</span></div>
    <div class="fields-area" id="fieldsArea"></div>
    <div class="submit-bar"><button class="submit-btn" id="submitBtn">SEND ／ 送出</button></div>
  </div>
</div>

<script>
var projects={}, projectOrder=[], curPid=null, curCat=0, curDate='';
var WD=['日','一','二','三','四','五','六'];

function fname(f){return typeof f==='string'?f:(f&&f.name?f.name:'');}
function fnote(f){return typeof f==='string'?'':(f&&f.note?f.note:'');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(d){var p=d.split('-');return parseInt(p[1])+'月 '+parseInt(p[2])+'日';}
function fmtWd(d){return '星期'+WD[new Date(d+'T00:00:00').getDay()];}
function clamp(d,p){return d<p.startDate?p.startDate:d>p.endDate?p.endDate:d;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function setSyncStatus(s,t){
  var dot=document.getElementById('syncDot');
  dot.className='tb-dot '+(s==='ok'?'ok':s==='err'?'err':'sync');
  document.getElementById('syncText').textContent=t;
}

function toast(msg,type){
  var w=document.getElementById('toastWrap');
  var el=document.createElement('div');
  el.className='toast'+(type?' '+type:'');
  el.textContent=msg;
  w.appendChild(el);
  setTimeout(function(){el.remove();},2600);
}

function show(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on');});
  document.getElementById(id).classList.add('on');
}

/* ── Project list ── */
function renderList(){
  var list=document.getElementById('projList');
  var active=projectOrder.filter(function(k){return projects[k]&&projects[k].status==='active';});
  if(!active.length){
    list.innerHTML='<div class="empty"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".3"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><div class="empty-msg">目前沒有進行中的活動</div></div>';
    show('sList');return;
  }
  // Auto-jump if only one active project
  if(active.length===1&&!document.getElementById('sReport').classList.contains('on')){
    openReport(active[0]);return;
  }
  list.innerHTML='';
  active.forEach(function(k){
    var p=projects[k];
    var btn=document.createElement('button');
    btn.className='proj-card';
    var now=todayStr();
    var isActive=now>=p.startDate&&now<=p.endDate;
    btn.innerHTML='<div class="pc-name">'+esc(p.name)+'</div>'+
      '<div class="pc-dates">'+esc(p.startDate)+' ～ '+esc(p.endDate)+'</div>'+
      '<span class="pc-badge '+(isActive?'active':'ended')+'">'+
        '<svg width="4" height="4" viewBox="0 0 4 4" fill="currentColor"><circle cx="2" cy="2" r="2"/></svg>'+
        (isActive?'進行中':'活動期間外')+
      '</span>'+
      '<span class="pc-arrow">›</span>';
    btn.onclick=function(){openReport(k);};
    list.appendChild(btn);
  });
  show('sList');
}

/* ── Report ── */
function openReport(pid){
  curPid=pid; curCat=0;
  var p=projects[pid];
  curDate=clamp(todayStr(),p);
  document.getElementById('repBack').textContent=' 返回專案列表';
  updateDateDisplay();
  renderCatTabs();
  renderFields();
  show('sReport');
}

function updateDateDisplay(){
  document.getElementById('dateBig').textContent=fmtDate(curDate);
  document.getElementById('dateWd').textContent=fmtWd(curDate);
  var inp=document.getElementById('dateInput');
  var p=projects[curPid];
  inp.value=curDate;
  inp.min=p.startDate||'';
  inp.max=p.endDate||'';
}

window.onDateChange=function(){
  var el=document.getElementById('dateInput');
  var d=el.value; if(!d)return;
  var p=projects[curPid];
  if(p.startDate&&d<p.startDate){
    el.value=p.startDate; d=p.startDate;
    toast('只能選擇活動期間（'+p.startDate+'～'+p.endDate+'）的日期','err');
  } else if(p.endDate&&d>p.endDate){
    el.value=p.endDate; d=p.endDate;
    toast('只能選擇活動期間（'+p.startDate+'～'+p.endDate+'）的日期','err');
  }
  curDate=d;
  updateDateDisplay();
  renderCatTabs();
  renderFields();
};

function renderCatTabs(){
  var p=projects[curPid];
  var tabs=document.getElementById('catTabs');
  tabs.innerHTML='';
  (p.categories||[]).forEach(function(cat,i){
    var btn=document.createElement('button');
    btn.className='cat-tab'+(i===curCat?' active':'');
    btn.textContent=cat.name;
    btn.onclick=function(){curCat=i;renderCatTabs();renderFields();};
    tabs.appendChild(btn);
  });
}

function getEntry(){
  var p=projects[curPid];
  var key='cat'+curCat+'_'+curDate;
  return (p.entries&&p.entries[key])||null;
}

function renderFields(){
  var p=projects[curPid];
  var cat=(p.categories||[])[curCat];
  if(!cat){document.getElementById('fieldsArea').innerHTML='';return;}
  var ent=getEntry();

  /* status badge */
  var sb=document.getElementById('stBadge');
  sb.className='st-badge '+(ent?'reported':'pending');
  sb.textContent=ent?'✓ 今日已回報':'● 尚未回報';

  /* fields */
  var area=document.getElementById('fieldsArea');
  area.innerHTML='';
  (cat.fields||[]).forEach(function(f,fi){
    var val=ent?(ent['f'+fi]!=null?ent['f'+fi]:''):'';
    var row=document.createElement('div');
    row.className='field-row';
    var note=fnote(f);
    row.innerHTML='<div class="fi-left">'+
      '<div class="fi-name">'+esc(fname(f))+'</div>'+
      (note?'<div class="fi-note">'+esc(note)+'</div>':'')+
      '</div>'+
      '<input class="fi-num" id="fn_'+fi+'"'+
        ' type="text" inputmode="numeric" pattern="[0-9]*"'+
        ' style="font-size:38px;"'+
        ' value="'+esc(String(val))+'" placeholder="—" autocomplete="off">'+
      '<div class="fi-unit">人</div>';
    area.appendChild(row);
  });
}

document.getElementById('repBack').onclick=function(){curPid=null;show('sList');};

document.getElementById('submitBtn').onclick=function(){
  if(!curPid)return;
  var p=projects[curPid];
  /* date range guard */
  if(curDate<(p.startDate||'')||curDate>(p.endDate||'')){
    toast('日期不在活動期間（'+p.startDate+'～'+p.endDate+'）內','err');return;
  }
  var cat=(p.categories||[])[curCat];
  if(!cat)return;
  var data={}, any=false;
  (cat.fields||[]).forEach(function(f,fi){
    var inp=document.getElementById('fn_'+fi);
    var v=(inp?inp.value:'').trim();
    if(v!==''){
      var n=parseInt(v);
      if(isNaN(n)||n<0){toast('數值必須為整數 ≥ 0','err');return;}
      data['f'+fi]=n; any=true;
    }
  });
  if(!any){toast('請至少填寫一個數值','err');return;}
  var isOverwrite=!!getEntry();
  if(isOverwrite&&!confirm('「'+curDate+'」的「'+cat.name+'」已填報過，確定要覆蓋？'))return;
  if(!window._dbSet){toast('資料庫尚未就緒，請稍後','err');return;}
  var key='cat'+curCat+'_'+curDate;
  window._dbSet(curPid,key,data,cat.name,isOverwrite);
};

/* ── Firebase ── */
(async function(){
  try{
    var fbApp=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    var fbDb=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
    var initializeApp=fbApp.initializeApp,getApps=fbApp.getApps;
    var getDatabase=fbDb.getDatabase,ref=fbDb.ref,set=fbDb.set,onValue=fbDb.onValue;
    var app=getApps().length?getApps()[0]:initializeApp({
      databaseURL:'https://project-1794474641398451810-default-rtdb.asia-southeast1.firebasedatabase.app/'
    });
    var db=getDatabase(app);

    window.addEventListener('online',function(){document.getElementById('offlineBanner').classList.remove('show');});
    window.addEventListener('offline',function(){document.getElementById('offlineBanner').classList.add('show');setSyncStatus('err','離線中');});
    if(!navigator.onLine)document.getElementById('offlineBanner').classList.add('show');

    setSyncStatus('sync','連線中...');
    onValue(ref(db,'tracker'),function(snap){
      var d=snap.val()||{};
      projects=d.projects||{};
      projectOrder=d.projectOrder||Object.keys(projects);
      Object.keys(projects).forEach(function(k){if(projectOrder.indexOf(k)<0)projectOrder.push(k);});
      projectOrder=projectOrder.filter(function(k){return!!projects[k];});
      setSyncStatus('ok','已同步');
      renderList();
      /* refresh report if open */
      if(curPid&&document.getElementById('sReport').classList.contains('on')){
        renderCatTabs();
        renderFields();
      }
    },function(e){setSyncStatus('err','連線失敗');toast('連線失敗：'+e.message,'err');});

    window._dbSet=async function(pid,entryKey,dataObj,catName,isOverwrite){
      var p=projects[pid];
      try{
        await set(ref(db,'tracker/projects/'+pid+'/entries/'+entryKey),dataObj);
        toast((catName||'數據')+' 已成功送出 ✓','ok');
        /* refresh */
        if(p&&p.entries){p.entries[entryKey]=dataObj;}
        renderCatTabs();renderFields();
        /* log */
        var vals=Object.keys(dataObj).map(function(k){return k+':'+dataObj[k];}).join('、');
        var t=Date.now();
        set(ref(db,'tracker/logs/'+t),{
          t:t,u:'協助者(v2)',a:isOverwrite?'覆蓋填報':'填報數據',
          d:entryKey+' @ '+(p?p.name:pid)+'｜'+vals
        }).catch(function(){});
      }catch(e){
        setSyncStatus('err','送出失敗');
        toast('送出失敗，請稍後重試','err');
      }
    };
  }catch(e){setSyncStatus('err','初始化失敗');toast('初始化失敗：'+e.message,'err');}
})();
</script>
</body>
</html>
