<script type="module">

const firebaseConfig={
  apiKey:"AIzaSyBFucVUrmJ0eslklp1QZMwLj2JCU05wTIQ",
  authDomain:"project-1794474641398451810.firebaseapp.com",
  databaseURL:"https://project-1794474641398451810-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"project-1794474641398451810",
  storageBucket:"project-1794474641398451810.firebasestorage.app",
  messagingSenderId:"660717432614",
  appId:"1:660717432614:web:5067d9a791339b6c275be7",

const db=getDatabase(initializeApp(firebaseConfig));

const C={bg:"#F6F9FA",bgCard:"#FFFFFF",bgSurface:"#E8ECF4",border:"#D8DEEC",borderMid:"#BEC8DC",accent:"#9B8EC7",accentDark:"#7A6BAA",accentLight:"#F0EDF9",text:"#1E2030",textMid:"#4A5068",textMuted:"#8A90A8",success:"#3D8A6A",successBg:"#E8F4EE",danger:"#A83838",dangerBorder:"#E8C4C4"};
const PALETTE=["#5B8DD9","#4EAA80","#D4A843","#D05858","#E0784A","#9B8EC7","#4EA8C0","#7ABD5E"];
const EMPTY={ownerPin:"1234",projects:[],records:[]};
const LBL={fontSize:13,color:"#4A5068",display:"block",marginBottom:6,fontWeight:500};

function uid(){return Math.random().toString(36).slice(2,9)}
function todayStr(){return new Date().toISOString().slice(0,10)}
function toDisplay(iso){if(!iso)return"";const[y,m,d]=iso.split("-");return`${y.slice(2)}/${m}/${d}`}
function toISO(s){if(!s)return"";const c=s.trim();if(/^\d{4}-\d{2}-\d{2}$/.test(c))return c;const m=c.match(/^(\d{2})\/(\d{2})\/(\d{2})$/);return m?`20${m[1]}-${m[2]}-${m[3]}`:c}
function exportCSV(proj,records){
  const dates=[...new Set(records.filter(r=>r.projectId===proj.id).map(r=>r.date))].sort();
  const header=["日期",...proj.items.map(i=>i.name),"合計"].join(",");
  const rows=dates.map(d=>{const vals=proj.items.map(i=>{const r=records.find(r=>r.projectId===proj.id&&r.itemId===i.id&&r.date===d);return r?r.value:""});return[d,...vals,vals.reduce((s,v)=>s+(Number(v)||0),0)].join(",")});
  const tot=["總計",...proj.items.map(i=>records.filter(r=>r.projectId===proj.id&&r.itemId===i.id).reduce((s,r)=>s+r.value,0)),records.filter(r=>r.projectId===proj.id).reduce((s,r)=>s+r.value,0)].join(",");
  const blob=new Blob(["\uFEFF",[header,...rows,tot].join("\n")],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${proj.name}_人次數據.csv`;a.click();
}

// ── tiny helpers replacing JSX ──────────────────────────────────────────
const e=(...a)=>h(...a);
function PBtn({children,onClick,full,color,disabled,style:s}){
  return e("button",{onClick,disabled,style:{background:disabled?"#ccc":(color||C.accent),color:"#fff",fontWeight:700,padding:"13px 22px",fontSize:15,borderRadius:14,width:full?"100%":undefined,opacity:disabled?.6:1,cursor:disabled?"default":"pointer",...s}},children);
}
function GBtn({children,onClick,danger,style:s}){
  return e("button",{onClick,style:{background:"transparent",border:`1.5px solid ${danger?"#F0C4C4":C.border}`,color:danger?C.danger:C.textMid,fontWeight:500,padding:"9px 16px",fontSize:14,borderRadius:12,...s}},children);
}
function Card({children,style:s}){
  return e("div",{style:{background:C.bgCard,borderRadius:18,border:`1px solid ${C.border}`,padding:"18px 20px",...s}},children);
}
function Logo({size=26}){
  return e("svg",{width:size,height:size,viewBox:"0 0 32 32",style:{borderRadius:7,flexShrink:0}},
    e("rect",{width:32,height:32,rx:8,fill:C.accent}),
    e("rect",{x:7,y:8,width:11,height:2.8,rx:1.4,fill:"white",opacity:.9}),
    e("rect",{x:7,y:14,width:18,height:2.8,rx:1.4,fill:"white"}),
    e("rect",{x:7,y:20,width:14,height:2.8,rx:1.4,fill:"white",opacity:.75}),
    e("circle",{cx:24.5,cy:9.5,r:4.5,fill:"#C4B8E8"}),
    e("path",{d:"M22.8 9.5l1.4 1.4 2.4-2.4",stroke:"white",strokeWidth:1.4,strokeLinecap:"round",strokeLinejoin:"round",fill:"none"})
  );
}
function Topbar({back,title,right}){
  return e("div",{style:{position:"sticky",top:0,zIndex:20,background:"rgba(246,249,250,.96)",backdropFilter:"blur(14px)",borderBottom:`1px solid ${C.border}`,height:54,padding:"0 16px",display:"flex",alignItems:"center",gap:10}},
    back?e("button",{onClick:back,style:{background:"none",border:"none",color:C.textMuted,fontSize:24,lineHeight:1,padding:"0 6px 0 0",cursor:"pointer"}},"\u2039"):e(Logo),
    e("span",{style:{flex:1,fontWeight:back?600:700,fontSize:back?16:19,fontFamily:back?"'DM Sans'":"'DM Serif Display'",letterSpacing:back?0:-.3}},title||"TrackIt"),
    right
  );
}
function ModalShell({open,onClose,children}){
  if(!open)return null;
  return e("div",{onClick:ev=>ev.target===ev.currentTarget&&onClose(),style:{position:"fixed",inset:0,background:"rgba(26,23,19,.3)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:100}},
    e("div",{style:{background:C.bgCard,borderRadius:"22px 22px 0 0",padding:"28px 22px 40px",width:"100%",maxWidth:540,boxShadow:"0 -12px 48px rgba(0,0,0,.1)",animation:"slideUp .22s ease forwards"}},children)
  );
}

// ── App ──────────────────────────────────────────────────────────────────
function App(){
  const [data,setData]=useState(EMPTY);
  const [loading,setLoading]=useState(true);
  const [role,setRole]=useState(null);
  const [screen,setScreen]=useState("projects");
  const [activeProjId,setActiveProjId]=useState(null);
  const [ownerTab,setOwnerTab]=useState("data");
  const [dashView,setDashView]=useState("date");
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [pinInput,setPinInput]=useState("");
  const [pinErr,setPinErr]=useState("");
  const [formErr,setFormErr]=useState("");
  const [toast,setToast]=useState(null);
  const [editCell,setEditCell]=useState(null);
  const [editVal,setEditVal]=useState("");
  const [confirm,setConfirm]=useState(null);
  const [dragId,setDragId]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  const [dateSearch,setDateSearch]=useState("");
  const [dateSearchOpen,setDateSearchOpen]=useState(false);
  const toastRef=useRef(null);

  useEffect(()=>{
    document.title="TrackIt · 活動人次登記";
    const svg="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 32 32\'%3E%3Crect width=\'32\' height=\'32\' rx=\'8\' fill=\'%239B8EC7\'/%3E%3C/svg%3E";
    let link=document.querySelector("link[rel~=\'icon\']");
    if(!link){link=document.createElement("link");link.rel="icon";document.head.appendChild(link);}
    link.href=svg;
  },[]);

  useEffect(()=>{
    const unsub=onValue(ref(db,"trackit"),snap=>{
      const raw=snap.val()||{};
      setData({
        ownerPin:raw.ownerPin||"1234",
        projects:raw.projects?Object.values(raw.projects).sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0)):[],
        records:raw.records?Object.values(raw.records):[],
      });
      setLoading(false);
    });
    return()=>unsub();
  },[]);

  const notify=useCallback(msg=>{clearTimeout(toastRef.current);setToast(msg);toastRef.current=setTimeout(()=>setToast(null),2200);},[]);
  const getProj=useCallback(id=>data.projects.find(p=>p.id===(id??activeProjId)),[data.projects,activeProjId]);

  function doLogin(){if(pinInput===data.ownerPin){setRole("owner");setPinInput("");setPinErr("");setModal(null);}else setPinErr("密碼錯誤，請再試一次");}
  function doLogout(){setRole(null);setScreen("projects");setActiveProjId(null);}
  function closeModal(){setModal(null);setForm({});setPinErr("");setFormErr("");}
  function getRecord(pid,iid,date){return data.records.find(r=>r.projectId===pid&&r.itemId===iid&&r.date===date);}

  function saveData(d){
    setData(d);
    const pm={};d.projects.forEach((p,i)=>{pm[p.id]={...p,sortOrder:i};});
    set(ref(db,"trackit/projects"),pm).catch(console.error);
    const rm={};d.records.forEach(r=>{rm[r.id]=r;});
    set(ref(db,"trackit/records"),Object.keys(rm).length?rm:null).catch(console.error);
  }
  function saveRec(rec){set(ref(db,`trackit/records/${rec.id}`),rec).catch(console.error);}
  function savePin(pin){set(ref(db,"trackit/ownerPin"),pin).catch(console.error);}

  function upsertRecord(pid,iid,date,raw,base){
    const d=base||data;const value=parseInt(raw,10);if(isNaN(value)||value<0)return d;
    const ex=d.records.find(r=>r.projectId===pid&&r.itemId===iid&&r.date===date);
    const rec=ex?{...ex,value}:{id:uid(),projectId:pid,itemId:iid,date,value};
    saveRec(rec);
    return{...d,records:ex?d.records.map(r=>r.id===ex.id?rec:r):[...d.records,rec]};
  }
  function batchUpsert(pid,entries,date){let d=data;entries.forEach(({iid,val})=>{d=upsertRecord(pid,iid,date,val,d);});setData(d);}
  function allDates(pid){return[...new Set(data.records.filter(r=>r.projectId===pid).map(r=>r.date))].sort();}

  function submitModal(){
    if(modal==="newProject"){
      if(!form.name?.trim()){setFormErr("請填寫專案名稱");return;}
      if(!form.dateRange?.trim()){setFormErr("請填寫活動日期");return;}
      if(!/^\d{2}\/\d{2}\/\d{2}/.test(form.dateRange.trim())){setFormErr("日期格式應為 YY/MM/DD");return;}
      saveData({...data,projects:[...data.projects,{id:uid(),name:form.name.trim(),dateRange:form.dateRange.trim(),description:form.desc?.trim()||"",color:form.color||C.accent,published:false,items:[]}]});notify("專案已建立");
    }else if(modal==="editProject"){
      if(!form.name?.trim()){setFormErr("請填寫專案名稱");return;}
      if(!form.dateRange?.trim()){setFormErr("請填寫活動日期");return;}
      if(!/^\d{2}\/\d{2}\/\d{2}/.test(form.dateRange.trim())){setFormErr("日期格式應為 YY/MM/DD");return;}
      saveData({...data,projects:data.projects.map(p=>p.id===activeProjId?{...p,name:form.name.trim(),dateRange:form.dateRange.trim(),description:form.desc?.trim()||"",color:form.color||p.color}:p)});notify("已更新");
    }else if(modal==="newItem"){
      if(!form.name?.trim()){setFormErr("請填寫項目名稱");return;}
      saveData({...data,projects:data.projects.map(p=>p.id===activeProjId?{...p,items:[...p.items,{id:uid(),name:form.name.trim()}]}:p)});notify("項目已新增");
    }else if(modal==="editItem"){
      if(!form.name?.trim()){setFormErr("請填寫項目名稱");return;}
      saveData({...data,projects:data.projects.map(p=>p.id!==activeProjId?p:{...p,items:p.items.map(i=>i.id===form.itemId?{...i,name:form.name.trim()}:i)})});notify("已更新");
    }else if(modal==="changePin"){
      if(!form.currentPin){setFormErr("請輸入目前密碼");return;}
      if(form.currentPin!==data.ownerPin){setFormErr("目前密碼錯誤");return;}
      if(!form.newPin||form.newPin.length<4){setFormErr("新密碼至少 4 碼");return;}
      if(form.newPin!==form.confirm){setFormErr("兩次輸入不一致");return;}
      savePin(form.newPin);setData(d=>({...d,ownerPin:form.newPin}));notify("密碼已更新");
    }
    closeModal();
  }

  function deleteProject(id){setConfirm({msg:"確定刪除此專案及所有記錄？此操作無法復原。",onOk:()=>{
    remove(ref(db,`trackit/projects/${id}`)).catch(console.error);
    const rem=data.records.filter(r=>r.projectId!==id);const rm={};rem.forEach(r=>{rm[r.id]=r;});
    set(ref(db,"trackit/records"),Object.keys(rm).length?rm:null).catch(console.error);
    setData(d=>({...d,projects:d.projects.filter(p=>p.id!==id),records:rem}));
    setScreen("projects");notify("已刪除");
  }});}
  function deleteItem(itemId){setConfirm({msg:"確定刪除此項目及所有記錄？此操作無法復原。",onOk:()=>{
    saveData({...data,projects:data.projects.map(p=>p.id!==activeProjId?p:{...p,items:p.items.filter(i=>i.id!==itemId)}),records:data.records.filter(r=>!(r.projectId===activeProjId&&r.itemId===itemId))});notify("已刪除");
  }});}
  function togglePublished(id){saveData({...data,projects:data.projects.map(p=>p.id===id?{...p,published:!p.published}:p)});}
  function reorderProjects(fromId,toId){
    if(fromId===toId)return;
    const ps=[...data.projects];const fi=ps.findIndex(p=>p.id===fromId),ti=ps.findIndex(p=>p.id===toId);
    ps.splice(ti,0,ps.splice(fi,1)[0]);saveData({...data,projects:ps});
  }
  function commitCellEdit(pid){
    if(!editCell)return;
    const d=upsertRecord(pid,editCell.itemId,editCell.date,editVal);
    saveData(d);setEditCell(null);setEditVal("");notify("數據已更新");
  }

  // ── modal content ────────────────────────────────────────────────────
  function MHead({title}){
    return e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}},
      e("span",{style:{fontSize:18,fontWeight:700}},title),
      e("button",{onClick:closeModal,style:{background:C.bgSurface,border:"none",borderRadius:20,width:30,height:30,fontSize:18,color:C.textMuted,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}},"×")
    );
  }
  function MFoot(){
    return e("div",{style:{display:"flex",gap:10,marginTop:6}},
      e(GBtn,{onClick:closeModal,style:{flex:1}},"取消"),
      e(PBtn,{onClick:submitModal,style:{flex:2}},"確認")
    );
  }
  function FRow({label,hint,children}){
    return e("div",null,
      e("label",{style:LBL},label,hint&&e("span",{style:{color:C.textMuted,fontWeight:400,fontSize:12}},` ${hint}`)),
      children
    );
  }

  function modalContent(){
    if(modal==="login") return e(Fragment,null,
      e(MHead,{title:"擁有者登入"}),
      e("div",{style:{display:"flex",flexDirection:"column",gap:16}},
        e("div",null,
          e("label",{style:LBL},"密碼"),
          e("input",{type:"password",placeholder:"請輸入密碼",value:pinInput,autoFocus:true,onChange:ev=>{setPinInput(ev.target.value);setPinErr("");},onKeyDown:ev=>ev.key==="Enter"&&doLogin()}),
          pinErr&&e("p",{style:{color:C.danger,fontSize:13,marginTop:5}},pinErr)
        ),
        e(PBtn,{full:true,onClick:doLogin},"登入")
      )
    );
    if(modal==="newProject"||modal==="editProject") return e(Fragment,null,
      e(MHead,{title:modal==="newProject"?"新增專案":"編輯專案"}),
      e("div",{style:{display:"flex",flexDirection:"column",gap:16}},
        e(FRow,{label:"專案名稱 *"},e("input",{autoFocus:true,value:form.name||"",onChange:ev=>{setForm(f=>({...f,name:ev.target.value}));setFormErr("");},placeholder:"例：2025 社區博覽會"})),
        e(FRow,{label:"活動日期 *",hint:"(YY/MM/DD，範圍如 25/05/01–25/05/05)"},e("input",{value:form.dateRange||"",onChange:ev=>{setForm(f=>({...f,dateRange:ev.target.value}));setFormErr("");},placeholder:"25/05/01"})),
        e(FRow,{label:"說明（選填）"},e("input",{value:form.desc||"",onChange:ev=>setForm(f=>({...f,desc:ev.target.value})),placeholder:"備註說明"})),
        e("div",null,
          e("label",{style:LBL},"主題色彩"),
          e("div",{style:{display:"flex",gap:10,flexWrap:"wrap"}},
            PALETTE.map(c=>e("div",{key:c,onClick:()=>setForm(f=>({...f,color:c})),style:{width:34,height:34,borderRadius:10,background:c,cursor:"pointer",outline:form.color===c?`3px solid ${C.text}`:"3px solid transparent",outlineOffset:2}}))
          )
        ),
        formErr&&e("p",{style:{color:C.danger,fontSize:13}},formErr),
        e(MFoot)
      )
    );
    if(modal==="newItem"||modal==="editItem") return e(Fragment,null,
      e(MHead,{title:modal==="newItem"?"新增登記項目":"編輯項目"}),
      e("div",{style:{display:"flex",flexDirection:"column",gap:16}},
        e(FRow,{label:"項目名稱 *"},e("input",{autoFocus:true,value:form.name||"",onChange:ev=>{setForm(f=>({...f,name:ev.target.value}));setFormErr("");},placeholder:"例：參觀人數",onKeyDown:ev=>ev.key==="Enter"&&submitModal()})),
        formErr&&e("p",{style:{color:C.danger,fontSize:13}},formErr),
        e(MFoot)
      )
    );
    if(modal==="changePin") return e(Fragment,null,
      e(MHead,{title:"修改登入密碼"}),
      e("div",{style:{display:"flex",flexDirection:"column",gap:16}},
        e(FRow,{label:"目前密碼"},e("input",{type:"password",autoFocus:true,placeholder:"請輸入目前密碼",value:form.currentPin||"",onChange:ev=>{setForm(f=>({...f,currentPin:ev.target.value}));setFormErr("");}})),
        e("div",{style:{height:1,background:C.border}}),
        e(FRow,{label:"新密碼（至少 4 碼）"},e("input",{type:"password",placeholder:"請輸入新密碼",value:form.newPin||"",onChange:ev=>{setForm(f=>({...f,newPin:ev.target.value}));setFormErr("");}})),
        e(FRow,{label:"確認新密碼"},e("input",{type:"password",placeholder:"再次輸入新密碼",value:form.confirm||"",onChange:ev=>{setForm(f=>({...f,confirm:ev.target.value}));setFormErr("");}})),
        formErr&&e("p",{style:{color:C.danger,fontSize:13}},formErr),
        e(MFoot)
      )
    );
    return null;
  }

  // ── screens ──────────────────────────────────────────────────────────
  function ViewerList(){
    const visible=data.projects.filter(p=>p.published);
    return e("div",{style:{minHeight:"100vh"}},
      e(Topbar,{right:e("button",{onClick:()=>{setModal("login");setPinInput("");setPinErr("");},style:{background:C.accentLight,border:"none",borderRadius:20,padding:"6px 14px",fontSize:13,color:C.accent,fontWeight:600,cursor:"pointer"}},"登入管理")}),
      e("div",{style:{padding:"28px 16px 48px",maxWidth:500,margin:"0 auto"}},
        e("h1",{style:{fontFamily:"'DM Serif Display'",fontSize:28,fontWeight:400,letterSpacing:-.4,marginBottom:6}},"選擇活動"),
        e("p",{style:{color:C.textMuted,fontSize:14,marginBottom:24}},"點選活動以登記人次"),
        visible.length===0
          ?e(Card,{style:{textAlign:"center",padding:"48px 20px"}},e("p",{style:{fontSize:38,marginBottom:10}},"📋"),e("p",{style:{color:C.textMuted}},"目前沒有開放中的活動"))
          :e("div",{style:{display:"flex",flexDirection:"column",gap:12}},
            visible.map(p=>e("button",{key:p.id,onClick:()=>{setActiveProjId(p.id);setScreen("entry");},
              style:{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:18,padding:"18px 20px",cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:14,width:"100%",transition:"box-shadow .18s,border-color .18s"},
              onMouseEnter:ev=>{ev.currentTarget.style.boxShadow=`0 4px 20px rgba(155,142,199,.16)`;ev.currentTarget.style.borderColor=p.color;},
              onMouseLeave:ev=>{ev.currentTarget.style.boxShadow="none";ev.currentTarget.style.borderColor=C.border;}},
              e("div",{style:{width:12,height:12,borderRadius:3,background:p.color,flexShrink:0}}),

    toast&&e("div",{style:{position:"fixed",bottom:28,left:"50%",transform:"translateX(-50%)",background:C.accent,color:"#fff",padding:"11px 24px",borderRadius:14,fontSize:13,fontWeight:700,zIndex:300,whiteSpace:"nowrap",boxShadow:"0 8px 28px rgba(0,0,0,.15)",pointerEvents:"none",animation:"fadeIn .2s ease"}},toast)
  );
}

createRoot(document.getElementById("root")).render(e(App));
</script>
