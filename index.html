<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動人次追蹤系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-base: #f0f4f8;
    --bg-surface: #ffffff;
    --bg-surface2: #e8eef5;
    --bg-surface3: #dde6f0;
    --accent: #3b7dd8;
    --accent-light: #6fa3e8;
    --accent-pale: #ddeaf8;
    --accent-dark: #2560b0;
    --text-primary: #1a2a3a;
    --text-secondary: #4a6080;
    --text-muted: #8aa0b8;
    --border: #c8d8e8;
    --border-light: #dde8f2;
    --shadow-sm: 0 1px 4px rgba(59,125,216,0.08);
    --shadow-md: 0 4px 16px rgba(59,125,216,0.12);
    --shadow-lg: 0 8px 32px rgba(59,125,216,0.15);
    --radius: 14px;
    --radius-sm: 8px;
    --radius-lg: 20px;
    --success: #2eac82;
    --warning: #e08a2a;
    --danger: #d04040;
    --status-active: #2eac82;
    --status-ended: #8aa0b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', 'DM Sans', sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── TOPBAR ── */
  .topbar {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-light);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm);
  }
  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 15px;
    color: var(--accent);
    letter-spacing: -0.3px;
  }
  .topbar-brand .logo-icon {
    width: 30px; height: 30px;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 15px;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .sync-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    padding: 4px 10px;
    background: var(--bg-surface2);
    border-radius: 20px;
    border: 1px solid var(--border-light);
  }
  .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: all 0.3s;
  }
  .sync-dot.synced { background: var(--success); box-shadow: 0 0 6px rgba(46,172,130,0.5); }
  .sync-dot.syncing { background: var(--warning); animation: pulse 1s infinite; }
  .sync-dot.error { background: var(--danger); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .role-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    background: var(--accent-pale);
  }
  .role-badge:hover { background: var(--accent); color: white; }

  /* ── VIEWS ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ── ROLE SELECT ── */
  #roleSelect {
    min-height: calc(100vh - 56px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  .role-select-wrap {
    text-align: center;
    max-width: 480px;
    width: 100%;
  }
  .role-select-wrap h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .role-select-wrap p {
    color: var(--text-secondary);
    margin-bottom: 40px;
    font-size: 15px;
  }
  .role-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .role-card {
    background: var(--bg-surface);
    border: 2px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px 20px;
    cursor: pointer;
    transition: all 0.25s;
    text-align: center;
  }
  .role-card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-lg);
    transform: translateY(-3px);
  }
  .role-card .role-icon {
    font-size: 36px;
    margin-bottom: 14px;
    display: block;
  }
  .role-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .role-card p { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }

  /* ── MAIN LAYOUT ── */
  .main-layout {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 24px;
  }

  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .page-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .page-sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: var(--accent-dark); box-shadow: 0 4px 12px rgba(59,125,216,0.3); }
  .btn-secondary {
    background: var(--bg-surface);
    color: var(--text-primary);
    border: 1.5px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: #fff0f0; color: var(--danger); border: 1.5px solid #f0c0c0; }
  .btn-danger:hover { background: var(--danger); color: white; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-lg { padding: 12px 24px; font-size: 15px; border-radius: var(--radius); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── PROJECT CARDS ── */
  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .project-card {
    background: var(--bg-surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }
  .project-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    opacity: 0;
    transition: opacity 0.2s;
  }
  .project-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .project-card:hover::before { opacity: 1; }
  .project-card.dragging { opacity: 0.5; border: 2px dashed var(--accent); }
  .project-card.drag-over { border-color: var(--accent-light); background: var(--accent-pale); }

  .card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .card-title { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .status-badge {
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
    margin-left: 8px;
  }
  .status-active { background: rgba(46,172,130,0.12); color: var(--status-active); }
  .status-ended { background: var(--bg-surface2); color: var(--status-ended); }

  .card-date { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
  .card-stats { display: flex; gap: 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-light); }
  .stat-item { text-align: center; }
  .stat-num { font-size: 20px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--text-muted); }

  .drag-handle {
    cursor: grab;
    color: var(--text-muted);
    padding: 2px 4px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1;
  }
  .drag-handle:hover { color: var(--accent); background: var(--accent-pale); }

  /* ── DETAIL VIEW ── */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    margin-bottom: 20px;
    transition: all 0.2s;
    background: none;
    border: none;
    font-family: inherit;
  }
  .back-btn:hover { color: var(--accent); background: var(--accent-pale); }

  /* ── SUMMARY CARDS ── */
  .summary-row {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .summary-card {
    background: var(--bg-surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
  }
  .summary-card.total {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border-color: transparent;
    color: white;
  }
  .summary-card.total .s-label { color: rgba(255,255,255,0.8); }
  .summary-card.total .s-num { color: white; }
  .s-num { font-size: 28px; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .s-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  /* ── TABLE ── */
  .table-wrap {
    background: var(--bg-surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: auto;
    margin-bottom: 24px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 500px;
  }
  th {
    background: var(--bg-surface2);
    padding: 10px 14px;
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    border-bottom: 1.5px solid var(--border);
    white-space: nowrap;
  }
  th.date-col { color: var(--text-primary); font-size: 13px; }
  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-light);
    font-size: 13px;
    color: var(--text-primary);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg-surface2); }
  .total-row td {
    background: var(--accent-pale);
    font-weight: 700;
    color: var(--accent-dark);
    border-top: 2px solid var(--border);
  }
  .total-row:hover td { background: var(--accent-pale); }
  td.date-cell { font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
  td.num-cell { text-align: right; font-variant-numeric: tabular-nums; }
  td.num-cell.highlight { color: var(--accent); font-weight: 600; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 40, 60, 0.4);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-surface);
    border-radius: var(--radius-lg);
    padding: 28px;
    width: 100%;
    max-width: 500px;
    box-shadow: var(--shadow-lg);
    animation: modalIn 0.2s ease;
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes modalIn { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .modal-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ── FORM ── */
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--bg-surface);
    transition: border-color 0.2s;
    outline: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,125,216,0.12); }
  .field-list { display: flex; flex-direction: column; gap: 8px; }
  .field-item {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .field-item input { flex: 1; }
  .remove-field-btn {
    width: 28px; height: 28px;
    border: none; border-radius: 6px;
    background: #fff0f0;
    color: var(--danger);
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .remove-field-btn:hover { background: var(--danger); color: white; }
  .add-field-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    padding: 4px 0;
    margin-top: 4px;
  }
  .add-field-btn:hover { text-decoration: underline; }

  /* ── ASSISTANT VIEW ── */
  .assistant-wrap { max-width: 480px; margin: 0 auto; padding: 28px 24px; }
  .project-select-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .project-select-item {
    background: var(--bg-surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .project-select-item:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
  .project-select-item .p-name { font-weight: 600; font-size: 14px; }
  .project-select-item .p-date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .entry-form {
    background: var(--bg-surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 16px;
  }
  .entry-form h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .entry-form .entry-date { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; }
  .entry-fields { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
  .entry-field-row { display: flex; align-items: center; gap: 12px; }
  .entry-field-label { flex: 1; font-size: 14px; font-weight: 500; }
  .entry-field-input {
    width: 110px;
    padding: 8px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    font-family: inherit;
    color: var(--accent-dark);
    outline: none;
    transition: border-color 0.2s;
  }
  .entry-field-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,125,216,0.12); }

  .confirm-box {
    background: var(--accent-pale);
    border: 1.5px solid var(--accent-light);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 14px;
    display: none;
  }
  .confirm-box.show { display: block; }
  .confirm-box h4 { font-size: 14px; font-weight: 700; color: var(--accent-dark); margin-bottom: 8px; }
  .confirm-list { list-style: none; font-size: 13px; color: var(--text-secondary); }
  .confirm-list li { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid var(--border-light); }
  .confirm-list li:last-child { border-bottom: none; }
  .confirm-list .cv { font-weight: 700; color: var(--text-primary); }

  /* ── TOAST ── */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toast {
    background: var(--text-primary);
    color: white;
    padding: 12px 18px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    animation: toastIn 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 200px;
  }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  @keyframes toastIn { from{transform:translateX(20px);opacity:0} to{transform:translateX(0);opacity:1} }

  /* ── PROJECT SETTINGS ── */
  .settings-section {
    background: var(--bg-surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .settings-section h4 { font-size: 13px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .toggle-wrap { display: flex; align-items: center; gap: 12px; }
  .toggle {
    position: relative;
    width: 44px; height: 24px;
    flex-shrink: 0;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 24px;
    cursor: pointer;
    transition: 0.3s;
  }
  .toggle-slider:before {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    left: 3px; top: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  input:checked + .toggle-slider { background: var(--accent); }
  input:checked + .toggle-slider:before { transform: translateX(20px); }
  .toggle-label { font-size: 14px; font-weight: 500; }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
  }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* ── CHIPS / TABS ── */
  .tab-bar {
    display: flex;
    gap: 4px;
    background: var(--bg-surface2);
    border-radius: var(--radius-sm);
    padding: 4px;
    margin-bottom: 20px;
    width: fit-content;
  }
  .tab-item {
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-secondary);
  }
  .tab-item.active { background: var(--bg-surface); color: var(--accent); box-shadow: var(--shadow-sm); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-light); }

  @media (max-width: 600px) {
    .main-layout { padding: 16px; }
    .project-grid { grid-template-columns: 1fr; }
    .role-cards { grid-template-columns: 1fr; }
    .summary-row { grid-template-columns: repeat(2, 1fr); }
    .topbar { padding: 0 14px; }
  }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-brand">
    <div class="logo-icon">📊</div>
    活動人次追蹤系統
  </div>
  <div class="topbar-right">
    <div class="sync-indicator" id="syncIndicator">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncText">未連線</span>
    </div>
    <button class="role-badge" id="switchRoleBtn" onclick="showRoleSelect()" style="display:none">切換角色</button>
  </div>
</div>

<!-- VIEWS -->

<!-- 1. Role Select -->
<div class="view active" id="viewRoleSelect" style="display:flex;min-height:calc(100vh - 56px);align-items:center;justify-content:center;padding:40px 24px;">
  <div class="role-select-wrap">
    <h1>歡迎使用 👋</h1>
    <p>請選擇您的角色以繼續</p>
    <div class="role-cards">
      <div class="role-card" onclick="enterRole('assistant')">
        <span class="role-icon">✏️</span>
        <h3>協助者</h3>
        <p>選擇活動專案，填寫並送出當日人次數字</p>
      </div>
      <div class="role-card" onclick="enterRole('editor')">
        <span class="role-icon">📋</span>
        <h3>編輯者</h3>
        <p>管理專案、查看統計表格、建立與設定活動</p>
      </div>
    </div>
  </div>
</div>

<div class="view" id="viewAssistant">

        <div class="page-title">專案總覽</div>

<!-- ── MODALS ── -->
<!-- New/Edit Project Modal -->
<div class="modal-overlay" id="projectModal">
  <div class="modal">
    <div class="modal-title" id="projectModalTitle">新增專案</div>
    <div class="modal-sub">設定活動基本資訊與登記項目</div>
    <div class="form-group">
      <label class="form-label">活動名稱</label>
      <input class="form-input" id="fieldName" placeholder="例：2025 夏日藝術展" />

      <label class="form-label">登記項目</label>

      <button class="btn btn-secondary" onclick="closeModal('projectModal')">取消</button>
      <button class="btn btn-primary" onclick="saveProject()">儲存</button>

</div>

<!-- Manual Entry Modal -->
<div class="modal-overlay" id="manualModal">
  <div class="modal">
    <div class="modal-title">手動新增數據</div>

<!-- Confirm Entry -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <div class="modal-title">確認送出</div>
    <div class="modal-sub" id="confirmModalSub"></div>
    <ul class="confirm-list" id="confirmModalList" style="background:var(--bg-surface2);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;"></ul>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('confirmModal')">返回修改</button>
      <button class="btn btn-primary" onclick="doSubmitEntry()">確認送出</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- Firebase + App Script -->
<script>
// Use dynamic import so Firebase loads as a module but all window.* functions
// are registered synchronously before any user interaction.
let _set, _ref, _update, _onValue, _db;

(async () => {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
  const { getDatabase, ref, set, onValue, update } =
    await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");

  const firebaseConfig = {
    databaseURL: "https://project-1794474641398451810-default-rtdb.firebaseio.com/"
  };
  const app = initializeApp(firebaseConfig);
  _db = getDatabase(app);
  _ref = ref; _set = set; _update = update; _onValue = onValue;
  startListening();
})();



// ── State ──
let projects = {};
let projectOrder = [];
let currentRole = null;
let currentProjectId = null;
let editingProjectId = null;
let pendingEntryData = null;
let dragSrcEl = null;

// ── Sync UI ──
function setSyncStatus(status, text) {
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncText');
  dot.className = 'sync-dot ' + status;
  label.textContent = text;
}

// ── Listen to Firebase ──
function startListening() {
  setSyncStatus('syncing', '連線中...');
  const dbRef = _ref(_db, 'tracker');
  _onValue(dbRef, (snapshot) => {
    const data = snapshot.val() || {};
    projects = data.projects || {};
    projectOrder = data.projectOrder || Object.keys(projects);
    // Ensure all keys present in order
    Object.keys(projects).forEach(k => { if (!projectOrder.includes(k)) projectOrder.push(k); });
    projectOrder = projectOrder.filter(k => projects[k]);
    setSyncStatus('synced', '已同步');
    refreshCurrentView();
  }, (err) => {
    setSyncStatus('error', '連線失敗');
    showToast('Firebase 連線失敗：' + err.message, 'error');
  });
}

function refreshCurrentView() {
  if (currentRole === 'assistant') renderAssistantProjects();
  if (currentRole === 'editor') renderEditorProjects();
  if (currentProjectId && document.getElementById('viewProjectDetail').classList.contains('active')) renderProjectDetail(currentProjectId);
}

// ── Role ──
window.enterRole = function(role) {
  currentRole = role;
  document.getElementById('switchRoleBtn').style.display = 'inline-flex';
  if (role === 'assistant') { showView('viewAssistant'); renderAssistantProjects(); }
  else { showView('viewEditor'); renderEditorProjects(); }
};

window.showRoleSelect = function() {
  currentRole = null;
  document.getElementById('switchRoleBtn').style.display = 'none';
  showView('viewRoleSelect');
};

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const el = document.getElementById(id);
  el.classList.add('active');
  el.style.display = '';
}

// ── ASSISTANT ──
function renderAssistantProjects() {
  const container = document.getElementById('assistantProjectListInner');
  const active = projectOrder.filter(k => projects[k] && projects[k].status === 'active');
  if (active.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>目前沒有進行中的活動</p></div>';
    return;
  }
  container.innerHTML = active.map(k => {
    const p = projects[k];
    return `<div class="project-select-item" onclick="selectAssistantProject('${k}')">
      <div>
        <div class="p-name">${esc(p.name)}</div>
        <div class="p-date">${p.startDate} ～ ${p.endDate}</div>
      </div>
      <span style="color:var(--accent);font-size:18px">›</span>
    </div>`;
  }).join('');
}

window.selectAssistantProject = function(id) {
  currentProjectId = id;
  const p = projects[id];
  document.getElementById('assistantProjectList').style.display = 'none';
  document.getElementById('assistantEntryForm').style.display = 'block';
  document.getElementById('entryProjectName').textContent = p.name;
  const today = todayStr();
  document.getElementById('entryTodayDate').textContent = '填報日期：' + today;
  const fields = document.getElementById('entryFields');
  fields.innerHTML = (p.fields || []).map((f, i) => `
    <div class="entry-field-row">
      <div class="entry-field-label">${esc(f)}</div>
      <input class="entry-field-input" type="number" min="0" id="ef_${i}" placeholder="0" />
    </div>
  `).join('');
  document.getElementById('confirmBox').classList.remove('show');
  document.getElementById('submitBtn').textContent = '預覽確認';
  document.getElementById('submitBtn').onclick = handleSubmit;
};

window.backToProjectList = function() {
  document.getElementById('assistantProjectList').style.display = 'block';
  document.getElementById('assistantEntryForm').style.display = 'none';
};

window.handleSubmit = function() {
  const p = projects[currentProjectId];
  const today = todayStr();
  const values = (p.fields || []).map((f, i) => {
    const v = parseInt(document.getElementById('ef_' + i).value) || 0;
    return { label: f, value: v };
  });

  // Show confirm modal
  document.getElementById('confirmModalSub').textContent = p.name + '｜' + today;
  const list = document.getElementById('confirmModalList');
  list.innerHTML = values.map(v => `<li><span>${esc(v.label)}</span><span class="cv">${v.value}</span></li>`).join('');
  pendingEntryData = { projectId: currentProjectId, date: today, values };
  openModal('confirmModal');
};

window.doSubmitEntry = async function() {
  const { projectId, date, values } = pendingEntryData;
  const entryObj = {};
  values.forEach((v, i) => { entryObj['f' + i] = v.value; });
  setSyncStatus('syncing', '儲存中...');
  try {
    await _set(_ref(_db, `tracker/projects/${projectId}/entries/${date}`), entryObj);
    closeModal('confirmModal');
    showToast('✅ 數據已送出！', 'success');
    backToProjectList();
  } catch (e) {
    showToast('送出失敗：' + e.message, 'error');
  }
};

// ── EDITOR LIST ──
function renderEditorProjects() {
  const grid = document.getElementById('editorProjectGrid');
  if (projectOrder.length === 0) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📁</div><p>尚無專案，點擊「新增專案」開始</p></div>';
    return;
  }
  grid.innerHTML = projectOrder.filter(k => projects[k]).map(k => {
    const p = projects[k];
    const totalEntries = Object.keys(p.entries || {}).length;
    const total = calcTotal(p);
    const isActive = p.status === 'active';
    return `<div class="project-card" draggable="true" data-id="${k}"
      ondragstart="dragStart(event)" ondragover="dragOver(event)" ondrop="dropCard(event)" ondragleave="dragLeave(event)" ondragend="dragEnd(event)"
      onclick="openProjectDetail('${k}')">
      <div class="card-header">
        <div class="card-title">${esc(p.name)}</div>
        <span class="status-badge ${isActive ? 'status-active' : 'status-ended'}">${isActive ? '進行中' : '已結束'}</span>
      </div>
      <div class="card-date">📅 ${p.startDate} ～ ${p.endDate}</div>
      <div style="font-size:12px;color:var(--text-muted)">登記項目：${(p.fields||[]).join('、') || '—'}</div>
      <div class="card-stats">
        <div class="stat-item"><div class="stat-num">${totalEntries}</div><div class="stat-label">填報天數</div></div>
        <div class="stat-item"><div class="stat-num">${total.toLocaleString()}</div><div class="stat-label">累計總人次</div></div>
      </div>
    </div>`;
  }).join('');
}

function calcTotal(p) {
  let t = 0;
  Object.values(p.entries || {}).forEach(e => Object.values(e).forEach(v => t += (parseInt(v) || 0)));
  return t;
}

// ── DRAG & DROP ──
window.dragStart = function(e) {
  dragSrcEl = e.currentTarget;
  dragSrcEl.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragSrcEl.dataset.id);
};
window.dragOver = function(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
};
window.dragLeave = function(e) { e.currentTarget.classList.remove('drag-over'); };
window.dragEnd = function(e) { e.currentTarget.classList.remove('dragging'); };
window.dropCard = function(e) {
  e.preventDefault();
  const target = e.currentTarget;
  target.classList.remove('drag-over');
  if (!dragSrcEl || dragSrcEl === target) return;
  const srcId = dragSrcEl.dataset.id;
  const tgtId = target.dataset.id;
  const si = projectOrder.indexOf(srcId);
  const ti = projectOrder.indexOf(tgtId);
  if (si < 0 || ti < 0) return;
  projectOrder.splice(si, 1);
  projectOrder.splice(ti, 0, srcId);
  update(_ref(_db, 'tracker'), { projectOrder });
};

// ── PROJECT DETAIL ──
window.openProjectDetail = function(id) {
  currentProjectId = id;
  showView('viewProjectDetail');
  renderProjectDetail(id);
};

window.backToEditorList = function() {
  currentProjectId = null;
  showView('viewEditor');
};

function renderProjectDetail(id) {
  const p = projects[id];
  if (!p) return;
  document.getElementById('detailProjectName').textContent = p.name;
  document.getElementById('detailProjectDates').textContent = p.startDate + ' ～ ' + p.endDate;

  // Status toggle
  const st = document.getElementById('statusToggle');
  st.checked = p.status === 'active';
  document.getElementById('statusLabel').textContent = p.status === 'active' ? '進行中' : '已結束';

  const fields = p.fields || [];
  const entries = p.entries || {};

  // Summary
  const fieldTotals = fields.map((_, fi) => {
    let t = 0;
    Object.values(entries).forEach(e => t += parseInt(e['f' + fi] || 0));
    return t;
  });
  const grandTotal = fieldTotals.reduce((a, b) => a + b, 0);
  const summaryRow = document.getElementById('summaryRow');
  summaryRow.innerHTML = `<div class="summary-card total"><div class="s-num">${grandTotal.toLocaleString()}</div><div class="s-label">累計總人次</div></div>` +
    fields.map((f, i) => `<div class="summary-card"><div class="s-num">${fieldTotals[i].toLocaleString()}</div><div class="s-label">${esc(f)}</div></div>`).join('');

  // Table
  const dates = Object.keys(entries).sort();
  const thead = document.getElementById('tableHead');
  const tbody = document.getElementById('tableBody');
  if (dates.length === 0) {
    thead.innerHTML = '';
    tbody.innerHTML = '<tr><td colspan="99" style="text-align:center;padding:32px;color:var(--text-muted)">尚無數據</td></tr>';
    return;
  }
  thead.innerHTML = '<tr><th class="date-col">日期</th>' + fields.map(f => `<th>${esc(f)}</th>`).join('') + '<th style="text-align:right">當日合計</th></tr>';
  
  const colTotals = fields.map(() => 0);
  let grandSum = 0;
  tbody.innerHTML = dates.map(d => {
    const e = entries[d];
    const rowVals = fields.map((_, i) => parseInt(e['f' + i] || 0));
    const rowSum = rowVals.reduce((a, b) => a + b, 0);
    rowVals.forEach((v, i) => colTotals[i] += v);
    grandSum += rowSum;
    return `<tr><td class="date-cell">${d}</td>${rowVals.map(v => `<td class="num-cell">${v.toLocaleString()}</td>`).join('')}<td class="num-cell highlight">${rowSum.toLocaleString()}</td></tr>`;
  }).join('') +
  `<tr class="total-row"><td class="date-cell">合計</td>${colTotals.map(v => `<td class="num-cell">${v.toLocaleString()}</td>`).join('')}<td class="num-cell">${grandSum.toLocaleString()}</td></tr>`;
}

window.toggleProjectStatus = async function() {
  const st = document.getElementById('statusToggle').checked;
  document.getElementById('statusLabel').textContent = st ? '進行中' : '已結束';
  await _update(_ref(_db, `tracker/projects/${currentProjectId}`), { status: st ? 'active' : 'ended' });
  showToast(st ? '專案已設為進行中' : '專案已設為已結束');
};

// ── NEW/EDIT PROJECT ──
window.openNewProjectModal = function() {
  editingProjectId = null;
  document.getElementById('projectModalTitle').textContent = '新增專案';
  document.getElementById('fieldName').value = '';
  document.getElementById('fieldStart').value = '';
  document.getElementById('fieldEnd').value = '';
  document.getElementById('fieldList').innerHTML = '';
  addFieldItem('一般入場');
  openModal('projectModal');
};

window.openEditProjectModal = function() {
  if (!currentProjectId) return;
  editingProjectId = currentProjectId;
  const p = projects[currentProjectId];
  document.getElementById('projectModalTitle').textContent = '編輯專案';
  document.getElementById('fieldName').value = p.name;
  document.getElementById('fieldStart').value = p.startDate;
  document.getElementById('fieldEnd').value = p.endDate;
  const fl = document.getElementById('fieldList');
  fl.innerHTML = '';
  (p.fields || []).forEach(f => addFieldItem(f));
  openModal('projectModal');
};

window.addFieldItem = function(val = '') {
  const fl = document.getElementById('fieldList');
  const div = document.createElement('div');
  div.className = 'field-item';
  div.innerHTML = `<input class="form-input" placeholder="例：一般入場" value="${esc(val)}" />
    <button class="remove-field-btn" onclick="this.parentElement.remove()">×</button>`;
  fl.appendChild(div);
};

window.saveProject = async function() {
  const name = document.getElementById('fieldName').value.trim();
  const start = document.getElementById('fieldStart').value;
  const end = document.getElementById('fieldEnd').value;
  const fields = [...document.querySelectorAll('#fieldList .field-item input')].map(i => i.value.trim()).filter(Boolean);
  if (!name || !start || !end) { showToast('請填寫活動名稱與日期', 'error'); return; }
  if (fields.length === 0) { showToast('請至少新增一個登記項目', 'error'); return; }

  const id = editingProjectId || 'p_' + Date.now();
  const existing = editingProjectId ? projects[editingProjectId] : {};
  const projectData = {
    name, startDate: start, endDate: end, fields,
    status: existing.status || 'active',
    entries: existing.entries || {}
  };

  setSyncStatus('syncing', '儲存中...');
  await _set(_ref(_db, `tracker/projects/${id}`), projectData);
  if (!editingProjectId) {
    const newOrder = [...projectOrder, id];
    await _update(_ref(_db, 'tracker'), { projectOrder: newOrder });
  }
  closeModal('projectModal');
  showToast('✅ 專案已儲存');
};

// ── MANUAL ENTRY ──
window.openManualEntryModal = function() {
  const p = projects[currentProjectId];
  document.getElementById('manualModalSub').textContent = p.name;
  document.getElementById('manualDate').value = todayStr();
  const mf = document.getElementById('manualFields');
  mf.innerHTML = (p.fields || []).map((f, i) => `
    <div class="form-group">
      <label class="form-label">${esc(f)}</label>
      <input class="form-input" type="number" min="0" id="mf_${i}" placeholder="0" />
    </div>
  `).join('');
  openModal('manualModal');
};

window.saveManualEntry = async function() {
  const date = document.getElementById('manualDate').value;
  if (!date) { showToast('請選擇日期', 'error'); return; }
  const p = projects[currentProjectId];
  const obj = {};
  (p.fields || []).forEach((_, i) => { obj['f' + i] = parseInt(document.getElementById('mf_' + i).value) || 0; });
  setSyncStatus('syncing', '儲存中...');
  await _set(_ref(_db, `tracker/projects/${currentProjectId}/entries/${date}`), obj);
  closeModal('manualModal');
  showToast('✅ 數據已儲存');
};

// ── UTILS ──
function openModal(id) { document.getElementById(id).classList.add('open'); }
window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); };
window.openModal = openModal;

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

window.showToast = function(msg, type = 'success') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3200);
};

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// ── START ──
// (startListening is called automatically after Firebase initialises above)
</script>
</body>
</html>
