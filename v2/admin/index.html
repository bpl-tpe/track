<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>活動管理後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#F5F2EC;
  --bg2:#EDEAE3;
  --surface:#FFFFFF;
  --line:#DDD8CE;
  --line-light:#EDEAE3;
  --amber:#C8900E;
  --amber-pale:#FDF6E0;
  --amber-mid:#EDD080;
  --teal:#1A8F6A;
  --teal-pale:#E3F4EE;
  --red:#C0392B;
  --red-pale:#FDEDEC;
  --text:#1C1A14;
  --text2:#4A4640;
  --text3:#8A8278;
  --sidebar-w:264px;
  --topbar-h:52px;
  --mono:'DM Mono',monospace;
  --sans:'Noto Sans TC',system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1C24;--bg2:#22242E;--surface:#2A2C36;--line:#3A3C48;--line-light:#303240;
  --text:#F0EDE6;--text2:#C8C4BA;--text3:#7A7870;
  --amber-pale:#2A2010;--teal-pale:#0E2A22;--red-pale:#2A1010;
}}
:root[data-theme="dark"]{
  --bg:#1A1C24;--bg2:#22242E;--surface:#2A2C36;--line:#3A3C48;--line-light:#303240;
  --text:#F0EDE6;--text2:#C8C4BA;--text3:#7A7870;
  --amber-pale:#2A2010;--teal-pale:#0E2A22;--red-pale:#2A1010;
}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--text);}

/* ── Login ─────────────────────────────────────── */
#viewLogin{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
.login-card{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:36px 28px;width:100%;max-width:360px;
  box-shadow:0 4px 24px rgba(0,0,0,.08);
}
.login-logo{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--text3);text-transform:uppercase;margin-bottom:24px;}
.login-title{font-size:20px;font-weight:500;color:var(--text);margin-bottom:4px;}
.login-sub{font-size:12px;color:var(--text3);margin-bottom:24px;}
.lbl{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
.login-card input{
  display:block;width:100%;padding:11px 12px;font-size:15px;font-family:var(--sans);
  background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);
  outline:none;transition:border-color .15s;margin-bottom:14px;
}
.login-card input:focus{border-color:var(--amber);}
.pw-wrap{position:relative;margin-bottom:14px;}
.pw-wrap input{margin-bottom:0;}
.pw-toggle{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;font-size:14px;color:var(--text3);padding:4px;
}
.btn-login{
  width:100%;padding:13px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:#fff;background:var(--text);border:none;
  border-radius:10px;cursor:pointer;transition:opacity .15s;
}
.btn-login:hover{opacity:.85;}
.login-err{font-size:12px;color:var(--red);margin-top:10px;min-height:18px;}

/* ── Mobile topbar (hidden on desktop) ─────────── */
.mobile-topbar{
  display:none;position:fixed;top:0;left:0;right:0;height:var(--topbar-h);
  background:var(--bg2);border-bottom:1px solid var(--line);
  align-items:center;padding:0 16px;gap:12px;z-index:200;
}
.hamburger{
  width:36px;height:36px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;cursor:pointer;flex-shrink:0;
}
.hamburger span{display:block;width:14px;height:1.5px;background:var(--text2);border-radius:2px;transition:all .2s;}
.mobile-topbar-title{flex:1;font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mob-btn{
  width:36px;height:36px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;color:var(--text2);flex-shrink:0;
}

/* ── App shell ──────────────────────────────────── */
#viewApp{display:flex;height:100vh;overflow:hidden;}

/* Sidebar drawer overlay (mobile) */
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:299;
}
.sidebar-overlay.open{display:block;}

/* Sidebar */
.sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .25s cubic-bezier(.4,0,.2,1);
}
.sidebar-top{
  padding:18px 18px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.sidebar-logo{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);}
.sidebar-actions{display:flex;gap:6px;}
.icon-btn{
  width:30px;height:30px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:14px;color:var(--text2);transition:border-color .15s,color .15s;
}
.icon-btn:hover{border-color:var(--amber);color:var(--amber);}
.sidebar-search{padding:10px 12px;border-bottom:1px solid var(--line);}
.sidebar-search input{
  width:100%;padding:7px 10px;font-size:13px;font-family:var(--sans);
  background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--text);outline:none;
}
.sidebar-search input:focus{border-color:var(--amber);}
.project-list{flex:1;overflow-y:auto;padding:6px 0;}
.project-item{
  padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;
  border-left:2px solid transparent;transition:background .1s,border-color .1s;
  user-select:none;
}
.project-item:hover{background:var(--bg);}
.project-item.active{background:var(--surface);border-left-color:var(--amber);}
.project-item.dragging{opacity:.4;}
.project-item.drag-over{background:var(--amber-pale);border-left-color:var(--amber);}
.pi-drag{font-size:11px;color:var(--line);cursor:grab;flex-shrink:0;}
.pi-info{flex:1;min-width:0;}
.pi-name{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pi-sub{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:2px;}
.pi-badge{font-family:var(--mono);font-size:8px;letter-spacing:.06em;padding:2px 7px;border-radius:4px;flex-shrink:0;}
.pi-badge.active{background:var(--teal-pale);color:var(--teal);}
.pi-badge.ended{background:var(--bg);color:var(--text3);border:1px solid var(--line);}
.sidebar-footer{
  padding:10px 12px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:6px;
}
.sidebar-footer-row{display:flex;align-items:center;justify-content:space-between;}
.user-info{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn-logout{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--text3);background:none;border:none;cursor:pointer;text-transform:uppercase;padding:6px 0;}
.btn-logout:hover{color:var(--red);}
.sidebar-helper-link{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--teal);background:none;border:none;cursor:pointer;text-align:left;padding:0;text-decoration:none;display:block;}
.sidebar-helper-link:hover{text-decoration:underline;}

/* Main area */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.main-header{
  padding:14px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0;flex-wrap:wrap;gap:10px;
}
.main-title{font-size:17px;font-weight:500;color:var(--text);}
.main-sub{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:2px;}
.header-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.btn{
  padding:7px 13px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--text2);cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;transition:border-color .15s,color .15s;
  white-space:nowrap;
}
.btn:hover{border-color:var(--amber);color:var(--amber);}
.btn.primary{background:var(--text);border-color:var(--text);color:#fff;}
.btn.primary:hover{opacity:.85;}
.btn.danger{border-color:var(--red);color:var(--red);}
.btn.danger:hover{background:var(--red-pale);}
.main-body{flex:1;overflow-y:auto;padding:20px;}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:20px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
.stat-label{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
.stat-num{font-family:var(--mono);font-size:26px;font-weight:500;color:var(--amber);letter-spacing:-1px;line-height:1;}
.stat-unit{font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:4px;}

/* Category tabs */
.cat-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;}
.cat-tab{
  font-family:var(--mono);font-size:10px;padding:8px 14px 10px;
  border-bottom:2px solid transparent;color:var(--text3);cursor:pointer;
  white-space:nowrap;letter-spacing:.05em;flex-shrink:0;
}
.cat-tab.active{color:var(--amber);border-bottom-color:var(--amber);}
.cat-tab:hover:not(.active){color:var(--text2);}

/* Table */
.table-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text3);padding:10px 12px;text-align:left;
  border-bottom:1px solid var(--line);background:var(--bg2);white-space:nowrap;cursor:pointer;
}
th:hover{color:var(--text);}
th .sort-icon{font-size:9px;margin-left:3px;opacity:.5;}
td{padding:10px 12px;border-bottom:1px solid var(--line-light);color:var(--text2);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg);}
.td-num{font-family:var(--mono);font-size:13px;color:var(--text);text-align:right;}
td input.edit-input{
  font-family:var(--mono);font-size:13px;color:var(--amber);
  background:var(--amber-pale);border:1px solid var(--amber-mid);
  border-radius:5px;padding:4px 6px;width:80px;text-align:right;outline:none;
}
.new-row td{background:var(--amber-pale);}
.td-del{color:var(--text3);cursor:pointer;font-size:15px;padding:2px 4px;}
.td-del:hover{color:var(--red);}
tr.total-row td{background:var(--bg2);font-family:var(--mono);font-weight:500;color:var(--text);border-top:2px solid var(--line);}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:1000;padding:0;
}
@media(min-width:600px){
  .modal-overlay{align-items:center;padding:24px;}
}
.modal{
  background:var(--surface);border:1px solid var(--line);
  width:100%;max-width:600px;overflow-y:auto;
  box-shadow:0 16px 48px rgba(0,0,0,.2);
  border-radius:20px 20px 0 0;
  max-height:90vh;
}
@media(min-width:600px){
  .modal{border-radius:16px;max-height:88vh;}
}
.modal-head{
  padding:18px 20px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--surface);z-index:1;
}
.modal-title{font-size:16px;font-weight:500;}
.modal-close{
  width:32px;height:32px;border-radius:8px;background:var(--bg2);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--text3);cursor:pointer;line-height:1;
}
.modal-close:hover{background:var(--line);color:var(--text);}
.modal-body{padding:18px 20px;}
.modal-footer{
  padding:12px 20px 20px;border-top:1px solid var(--line);
  display:flex;justify-content:flex-end;gap:8px;
  position:sticky;bottom:0;background:var(--surface);
}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
.form-group input,.form-group select{
  display:block;width:100%;padding:11px 12px;font-size:15px;font-family:var(--sans);
  background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);
  outline:none;transition:border-color .15s;
}
.form-group input:focus,.form-group select:focus{border-color:var(--amber);}
.form-row{display:flex;gap:10px;}
.form-row .form-group{flex:1;}

/* Category builder */
.cat-builder{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;}
.cat-builder-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.cat-builder-head input{flex:1;padding:8px 10px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--text);outline:none;}
.cat-builder-head input:focus{border-color:var(--amber);}
.field-item{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.field-item input{flex:1;padding:7px 9px;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:6px;color:var(--text);outline:none;}
.field-item input:focus{border-color:var(--amber);}
.field-item input.note-in{flex:.6;font-size:12px;color:var(--text3);}
.field-del{color:var(--text3);cursor:pointer;font-size:14px;padding:4px;}
.field-del:hover{color:var(--red);}
.add-link{font-family:var(--mono);font-size:10px;color:var(--amber);cursor:pointer;letter-spacing:.06em;border:none;background:none;padding:0;}
.add-link:hover{text-decoration:underline;}

/* Manual modal */
.manual-cat-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;}
.manual-cat-tab{font-family:var(--mono);font-size:10px;padding:7px 12px 9px;border-bottom:2px solid transparent;color:var(--text3);cursor:pointer;letter-spacing:.05em;flex-shrink:0;}
.manual-cat-tab.active{color:var(--amber);border-bottom-color:var(--amber);}
.manual-field-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.manual-field-label{flex:1;font-size:14px;color:var(--text2);}
.manual-field-note{font-size:11px;color:var(--text3);}
.manual-field-input{
  font-family:var(--mono);font-size:22px;color:var(--amber);font-weight:500;
  background:var(--amber-pale);border:1px solid var(--amber-mid);
  border-radius:8px;padding:8px 10px;width:110px;text-align:right;outline:none;
}

/* Log */
.log-item{padding:10px 0;border-bottom:1px solid var(--line-light);display:flex;align-items:flex-start;gap:12px;}
.log-item:last-child{border-bottom:none;}
.log-time{font-family:var(--mono);font-size:9px;color:var(--text3);white-space:nowrap;padding-top:2px;}
.log-body{flex:1;min-width:0;}
.log-action-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.log-action{font-size:13px;color:var(--text2);}
.log-tag{font-family:var(--mono);font-size:8px;letter-spacing:.06em;padding:2px 6px;border-radius:4px;}
.log-tag-add{background:var(--teal-pale);color:var(--teal);}
.log-tag-edit{background:var(--amber-pale);color:var(--amber);}
.log-tag-del{background:var(--red-pale);color:var(--red);}
.log-tag-sys{background:var(--bg2);color:var(--text3);}
.log-who{font-family:var(--mono);font-size:9px;color:#1A6AB5;background:#EAF2FF;padding:1px 6px;border-radius:4px;}
.log-detail{font-size:11px;color:var(--text3);margin-top:2px;}

/* Toast */
.toast-wrap{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{
  background:var(--text);color:var(--surface);
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  padding:10px 18px;border-radius:10px;white-space:nowrap;
  animation:toastIn .2s ease both;
}
.toast.err{background:var(--red);}
.toast.ok{background:var(--teal);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

/* ── Mobile layout ──────────────────────────────── */
@media(max-width:680px){
  .mobile-topbar{display:flex;}
  #viewApp{padding-top:var(--topbar-h);}
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:300;
    transform:translateX(-100%);
  }
  .sidebar.open{transform:translateX(0);}
  .main-header{padding:12px 16px;}
  .main-body{padding:14px 14px 80px;}
  .header-actions .btn-label{display:none;}
  .header-actions .btn{padding:8px 10px;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  td{padding:8px 10px;}
}
</style>
</head>
<body>

<!-- Login -->
<div id="viewLogin">
  <div class="login-card">
    <div class="login-logo">BPL Track · Admin v2</div>
    <div class="login-title">後台管理系統</div>
    <div class="login-sub">請使用管理員帳號登入</div>
    <label class="lbl" for="loginUser">帳號</label>
    <div style="display:flex;align-items:center;margin-bottom:14px;">
      <input id="loginUser" type="text" placeholder="username" style="border-radius:8px 0 0 8px;border-right:none;margin:0;flex:1;">
      <div style="padding:11px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:0 8px 8px 0;font-family:var(--mono);font-size:12px;color:var(--text3);white-space:nowrap;">@bpl.com</div>
    </div>
    <label class="lbl" for="loginPass">密碼</label>
    <div class="pw-wrap">
      <input id="loginPass" type="password" placeholder="••••••••">
      <button class="pw-toggle" type="button" onclick="togglePw()" title="顯示/隱藏密碼">👁</button>
    </div>
    <button class="btn-login" onclick="doLogin()">登入</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- App -->
<div id="viewApp" style="display:none;">

  <!-- Mobile topbar -->
  <div class="mobile-topbar" id="mobileTopbar">
    <div class="hamburger" id="hamburger" onclick="toggleSidebar()">
      <span></span><span></span><span></span>
    </div>
    <div class="mobile-topbar-title" id="mobileTitle">BPL Track</div>
    <div class="mob-btn" title="新增專案" onclick="openProjectModal(null)">＋</div>
    <div class="mob-btn" title="操作紀錄" onclick="openLogModal()">📋</div>
  </div>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo">BPL Track</div>
      <div class="sidebar-actions">
        <div class="icon-btn" title="新增專案" onclick="openProjectModal(null)">＋</div>
        <div class="icon-btn" title="操作紀錄" onclick="openLogModal()">📋</div>
      </div>
    </div>
    <div class="sidebar-search">
      <input type="text" placeholder="搜尋專案…" oninput="filterProjects(this.value)" id="searchInput">
    </div>
    <div class="project-list" id="projectList"></div>
    <div class="sidebar-footer">
      <div class="sidebar-footer-row">
        <div class="user-info" id="userEmail">—</div>
        <button class="btn-logout" onclick="doLogout()">登出</button>
      </div>
      <a class="sidebar-helper-link" href="/v2/" title="前往協助者頁面">← 協助者頁面</a>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div id="mainEmpty" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);gap:12px;padding:24px;">
      <div style="font-size:48px;opacity:.3;">📂</div>

<script>
/* ─── Sidebar & password toggle (must be global for onclick) ─── */
function toggleSidebar(){
  const s=document.getElementById('sidebar');
  const o=document.getElementById('sidebarOverlay');
  const open=s.classList.toggle('open');
  o.classList.toggle('open',open);
}
function closeSidebar(){

  document.getElementById('sidebarOverlay').classList.remove('open');

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getDatabase,ref,onValue,set,update,remove,push,get,query,limitToLast,orderByKey}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const FB={
  apiKey:'AIzaSyBFucVUrmJ0eslklp1QZMwLj2JCU05wTIQ',
  authDomain:'project-1794474641398451810.firebaseapp.com',
  databaseURL:'https://project-1794474641398451810-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId:'project-1794474641398451810',
  storageBucket:'project-1794474641398451810.firebasestorage.app',
  messagingSenderId:'660717432614',
  appId:'1:660717432614:web:5067d9a791339b6c275be7'
};
const app=initializeApp(FB);
const auth=getAuth(app);
const db=getDatabase(app);
const DOMAIN='@bpl.com';

let projects={};
let curPid=null;
let curProject=null;
let detailCatIndex=0;
let tableSort={field:'date',asc:false};
let tableEditMode=false;
let projectOrder=[];
let logUnsubscribe=null;

/* ── Global helpers ─────────────────────────────── */
window.closeModal=function(id){document.getElementById(id).style.display='none';};
function fname(f){return typeof f==='string'?f:f.name;}
function fnote(f){return typeof f==='string'?'':f.note||'';}
function toast(msg,type='',dur=2400){
  const w=document.getElementById('toastWrap');
  const el=document.createElement('div');
  el.className='toast'+(type?' '+type:'');
  el.textContent=msg;w.appendChild(el);
  setTimeout(()=>el.remove(),dur);
}
function fmtDate(s){if(!s)return'—';const[y,m,d]=s.split('-');return`${parseInt(m)}月${parseInt(d)}日`;}
function fmtDateFull(s){if(!s)return'—';const[y,m,d]=s.split('-');return`${y}/${m}/${d}`;}
function writeLog(action,detail,tag='sys'){
  push(ref(db,'tracker/logs'),{t:Date.now(),u:auth.currentUser?.email||'admin(v2)',a:action,d:detail,tag});
}

/* ── Auth ────────────────────────────────────────── */
window.doLogin=async function(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr');
  if(!u||!p){err.textContent='請填寫帳號和密碼';return;}
  err.textContent='';
  try{await signInWithEmailAndPassword(auth,u+DOMAIN,p);}
  catch(e){err.textContent='帳號或密碼錯誤';}
};
window.doLogout=async function(){await signOut(auth);};
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')window.doLogin();});

onAuthStateChanged(auth,user=>{
  if(user){
    document.getElementById('viewLogin').style.display='none';
    document.getElementById('viewApp').style.display='flex';
    document.getElementById('userEmail').textContent=user.email.replace(DOMAIN,'');
    loadProjects();
  }else{
    document.getElementById('viewLogin').style.display='flex';
    document.getElementById('viewApp').style.display='none';
  }
});

/* ── Projects ─────────────────────────────────────── */
function loadProjects(){
  onValue(ref(db,'tracker'),snap=>{
    const data=snap.val()||{};
    projects=data.projects||{};
    if(data.projectOrder&&Array.isArray(data.projectOrder)){
      projectOrder=data.projectOrder;
    }
    renderProjectList();
    if(curPid&&projects[curPid])showDetail(curPid);
    else if(curPid&&!projects[curPid]){
      curPid=null;curProject=null;
      document.getElementById('mainEmpty').style.display='flex';
      document.getElementById('mainDetail').style.display='none';
    }
  });
}

function saveProjectOrder(){
  const cur=projectOrder.filter(k=>projects[k]);
  update(ref(db,'tracker'),{projectOrder:cur});
}

function renderProjectList(){
  const q=(document.getElementById('searchInput')?.value||'').trim().toLowerCase();
  const list=document.getElementById('projectList');
  list.innerHTML='';
  const allKeys=Object.keys(projects);
  const stored=projectOrder.filter(k=>allKeys.includes(k));
  projectOrder=[...stored,...allKeys.filter(k=>!stored.includes(k))];
  projectOrder.forEach(pid=>{
    const p=projects[pid];if(!p)return;
    if(q&&!p.name.toLowerCase().includes(q))return;
    const div=document.createElement('div');
    div.className='project-item'+(pid===curPid?' active':'');
    div.draggable=true;div.dataset.pid=pid;
    div.innerHTML=`
      <div class="pi-drag">⠿</div>
      <div class="pi-info">
        <div class="pi-name">${p.name}</div>
        <div class="pi-sub">${p.startDate||'—'} ~ ${p.endDate||'—'} · ${(p.categories||[]).length}類</div>
      </div>
      <div class="pi-badge ${p.status==='active'?'active':'ended'}">${p.status==='active'?'進行中':'已結束'}</div>
    `;
    div.addEventListener('click',()=>{showDetail(pid);closeSidebar();});
    div.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',pid);div.classList.add('dragging');});
    div.addEventListener('dragend',()=>div.classList.remove('dragging'));
    div.addEventListener('dragover',e=>{e.preventDefault();div.classList.add('drag-over');});
    div.addEventListener('dragleave',()=>div.classList.remove('drag-over'));
    div.addEventListener('drop',e=>{
      e.preventDefault();div.classList.remove('drag-over');
      const from=e.dataTransfer.getData('text/plain'),to=pid;
      if(from===to)return;
      const fi=projectOrder.indexOf(from),ti=projectOrder.indexOf(to);
      if(fi<0||ti<0)return;
      projectOrder.splice(fi,1);projectOrder.splice(ti,0,from);
      renderProjectList();
      saveProjectOrder();
    });
    list.appendChild(div);
  });
}

window.filterProjects=function(){renderProjectList();};

function showDetail(pid){
  curPid=pid;curProject=projects[pid];
  detailCatIndex=0;tableEditMode=false;
  document.getElementById('mainEmpty').style.display='none';
  document.getElementById('mainDetail').style.display='flex';
  document.getElementById('detailName').textContent=curProject.name;
  document.getElementById('mobileTitle').textContent=curProject.name;
  document.getElementById('detailPeriod').textContent=
    `${fmtDateFull(curProject.startDate)} — ${fmtDateFull(curProject.endDate)} · ${curProject.status==='active'?'進行中':'已結束'}`;
  renderDetail();renderProjectList();
}

function renderDetail(){
  const p=curProject,cats=p.categories||[],allEntries=p.entries||{};
  const body=document.getElementById('mainBody');
  body.innerHTML='';

  const tabsDiv=document.createElement('div');tabsDiv.className='cat-tabs';
  cats.forEach((cat,i)=>{
    const t=document.createElement('div');
    t.className='cat-tab'+(i===detailCatIndex?' active':'');
    t.textContent=cat.name;
    t.onclick=()=>{detailCatIndex=i;tableEditMode=false;renderDetail();};
    tabsDiv.appendChild(t);
  });
  body.appendChild(tabsDiv);
  if(!cats.length){const e=document.createElement('div');e.style.cssText='color:var(--text3);font-size:13px;';e.textContent='此專案尚無分類';body.appendChild(e);return;}

  const cat=cats[detailCatIndex];const fields=cat.fields||[];
  const prefix=`cat${detailCatIndex}_`;
  const entries=Object.fromEntries(Object.entries(allEntries).filter(([k])=>k.startsWith(prefix)));

  renderStat(body,fields,entries);

  const toolbar=document.createElement('div');toolbar.className='table-toolbar';
  toolbar.innerHTML=`
    <div style="font-family:var(--mono);font-size:10px;color:var(--text3);">共 ${Object.keys(entries).length} 筆</div>
    <div style="display:flex;gap:6px;">
      <button class="btn" id="editModeBtn">${tableEditMode?'完成':'編輯'}</button>
      ${tableEditMode?'<button class="btn" id="addRowBtn">＋ 新增</button>':''}
    </div>`;
  body.appendChild(toolbar);
  toolbar.querySelector('#editModeBtn').onclick=()=>{tableEditMode=!tableEditMode;renderDetail();};
  if(tableEditMode)toolbar.querySelector('#addRowBtn').onclick=()=>window.addNewRow();

  renderTable(body,fields,entries,prefix);
}

function renderStat(container,fields,entries){
  const grid=document.createElement('div');grid.className='stat-grid';
  const days=Object.keys(entries).length;
  grid.innerHTML=`<div class="stat-card"><div class="stat-label">已回報天數</div><div class="stat-num">${days}</div><div class="stat-unit">天</div></div>`;
  fields.forEach((f,fi)=>{
    let total=0;Object.values(entries).forEach(e=>{const v=e[`f${fi}`];if(v!=null&&!isNaN(+v))total+=+v;});
    const c=document.createElement('div');c.className='stat-card';
    c.innerHTML=`<div class="stat-label">${fname(f)}</div><div class="stat-num">${total.toLocaleString()}</div><div class="stat-unit">累計</div>`;
    grid.appendChild(c);
  });
  container.appendChild(grid);
}

function renderTable(container,fields,entries,prefix){
  const wrap=document.createElement('div');wrap.className='table-wrap';wrap.id='tableWrap';
  let rows=Object.entries(entries).map(([k,v])=>({key:k,date:k.replace(prefix,''),data:v}));
  rows.sort((a,b)=>{
    const va=tableSort.field==='date'?a.date:(+a.data[tableSort.field]||0);
    const vb=tableSort.field==='date'?b.date:(+b.data[tableSort.field]||0);
    return tableSort.asc?(va<vb?-1:va>vb?1:0):(va>vb?-1:va<vb?1:0);
  });
  const si=f=>tableSort.field===f?(tableSort.asc?'↑':'↓'):'';
  const table=document.createElement('table');
  const thead=document.createElement('thead');
  let th=`<tr><th data-s="date">日期 <span class="sort-icon">${si('date')}</span></th>`;
  fields.forEach((f,fi)=>`${th+=`<th data-s="f${fi}" style="text-align:right;">${fname(f)} <span class="sort-icon">${si('f'+fi)}</span></th>`}`);
  if(tableEditMode)th+='<th></th>';
  th+='</tr>';thead.innerHTML=th;table.appendChild(thead);

  thead.querySelectorAll('th[data-s]').forEach(t=>t.addEventListener('click',()=>{
    const f=t.dataset.s;
    if(tableSort.field===f)tableSort.asc=!tableSort.asc;else{tableSort.field=f;tableSort.asc=false;}
    renderDetail();
  }));

  const tbody=document.createElement('tbody');
  rows.forEach(row=>{
    const tr=document.createElement('tr');
    let td=`<td>${fmtDate(row.date)}</td>`;
    fields.forEach((f,fi)=>{
      const v=row.data[`f${fi}`];
      td+=tableEditMode
        ?`<td class="td-num"><input class="edit-input" data-key="${row.key}" data-fi="${fi}" type="text" inputmode="numeric" pattern="[0-9]*" value="${v!=null?v:''}"></td>`
        :`<td class="td-num">${v!=null?Number(v).toLocaleString():'<span style="color:var(--text3)">—</span>'}</td>`;
    });
    if(tableEditMode)td+=`<td><span class="td-del" data-key="${row.key}" data-date="${row.date}">🗑</span></td>`;
    tr.innerHTML=td;tbody.appendChild(tr);
  });

  // Total row
  if(rows.length>0){
    const totals=fields.map((f,fi)=>{
      let s=0;rows.forEach(r=>{const v=r.data[`f${fi}`];if(v!=null&&!isNaN(+v))s+=+v;});return s;
    });
    const tr=document.createElement('tr');tr.className='total-row';
    let td=`<td>合計</td>`;
    totals.forEach(t=>{td+=`<td class="td-num">${t.toLocaleString()}</td>`;});
    if(tableEditMode)td+='<td></td>';
    tr.innerHTML=td;tbody.appendChild(tr);
  }

  // New row
  if(tableEditMode){
    const nr=document.createElement('tr');nr.className='new-row';nr.id='newRow';
    let ntd=`<td><input class="edit-input" id="newDate" type="date" style="width:130px;" min="${curProject.startDate||''}" max="${curProject.endDate||''}"></td>`;
    fields.forEach((f,fi)=>{ntd+=`<td class="td-num"><input class="edit-input" id="newF${fi}" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0"></td>`;});
    ntd+='<td></td>';nr.innerHTML=ntd;tbody.appendChild(nr);
  }
  table.appendChild(tbody);wrap.appendChild(table);container.appendChild(wrap);

  if(tableEditMode){
    wrap.querySelectorAll('.edit-input[data-key]').forEach(inp=>inp.addEventListener('blur',()=>window.saveRowEdit(inp)));
    wrap.querySelectorAll('.td-del[data-key]').forEach(s=>s.addEventListener('click',()=>window.deleteRow(s.dataset.key,s.dataset.date)));
  }
}

window.saveRowEdit=async function(inp){
  const v=inp.value.trim();if(v==='')return;
  if(isNaN(+v)||+v<0||!Number.isInteger(+v)){toast('請輸入有效整數','err');return;}
  const oldSnap=await get(ref(db,`tracker/projects/${curPid}/entries/${inp.dataset.key}/f${inp.dataset.fi}`));
  const oldV=oldSnap.val();
  if(String(oldV)===v)return;
  await set(ref(db,`tracker/projects/${curPid}/entries/${inp.dataset.key}/f${inp.dataset.fi}`),+v);
  writeLog('編輯數值',`${inp.dataset.key} f${inp.dataset.fi}: ${oldV}→${v}`,'edit');
};
window.deleteRow=async function(key,date){
  if(!confirm(`確定刪除 ${fmtDate(date)} 的資料？`))return;
  await remove(ref(db,`tracker/projects/${curPid}/entries/${key}`));
  writeLog('刪除列',key,'del');toast('已刪除','ok');
};
window.addNewRow=async function(){
  const d=document.getElementById('newDate')?.value;
  if(!d){toast('請選擇日期','err');return;}
  if(curProject.startDate&&d<curProject.startDate||curProject.endDate&&d>curProject.endDate){toast('日期不在活動期間','err');return;}
  const prefix=`cat${detailCatIndex}_`;const key=`${prefix}${d}`;
  const fields=(curProject.categories||[])[detailCatIndex]?.fields||[];
  const existing=(await get(ref(db,`tracker/projects/${curPid}/entries/${key}`))).val();
  if(existing){toast(`${fmtDate(d)} 已有資料，請直接在表格中修改`,'err');return;}
  const data={};let any=false;
  fields.forEach((f,fi)=>{
    const v=document.getElementById(`newF${fi}`)?.value.trim();
    if(v!==''&&!isNaN(+v)&&+v>=0){data[`f${fi}`]=+v;any=true;}
  });
  if(!any){toast('請至少填寫一個欄位','err');return;}
  await set(ref(db,`tracker/projects/${curPid}/entries/${key}`),data);
  writeLog('新增列',key,'add');toast('已儲存','ok');
};

/* ── Manual modal ─────────────────────────────────── */
let manualCatIndex=0;
window.openManualModal=function(){
  if(!curProject)return;manualCatIndex=0;renderManualModal();
  document.getElementById('manualModal').style.display='flex';
};
async function renderManualModal(){
  const cats=curProject.categories||[];
  const body=document.getElementById('manualModalBody');body.innerHTML='';
  const tabs=document.createElement('div');tabs.className='manual-cat-tabs';
  cats.forEach((c,i)=>{
    const t=document.createElement('div');
    t.className='manual-cat-tab'+(i===manualCatIndex?' active':'');
    t.textContent=c.name;t.onclick=()=>{manualCatIndex=i;renderManualModal();};
    tabs.appendChild(t);
  });
  body.appendChild(tabs);
  const cat=cats[manualCatIndex]||{fields:[]};
  const today=new Date().toISOString().slice(0,10);
  const fg=document.createElement('div');fg.className='form-group';
  fg.innerHTML=`<label>日期</label><input type="date" id="manDate" value="${today}" min="${curProject.startDate||''}" max="${curProject.endDate||''}">`;
  body.appendChild(fg);

  // Load existing values for today
  await loadManualValues(today,cat,body);

  document.getElementById('manDate').addEventListener('change',async function(){
    await loadManualValues(this.value,cat,body);
  });
}
async function loadManualValues(date,cat,body){
  const prefix=`cat${manualCatIndex}_`;
  const key=`${prefix}${date}`;
  const snap=await get(ref(db,`tracker/projects/${curPid}/entries/${key}`));
  const existing=snap.val()||{};
  // Remove old field rows before re-rendering
  body.querySelectorAll('.manual-field-row').forEach(el=>el.remove());
  (cat.fields||[]).forEach((f,fi)=>{
    const row=document.createElement('div');row.className='manual-field-row';
    const existVal=existing[`f${fi}`]!=null?existing[`f${fi}`]:'';
    row.innerHTML=`
      <div class="manual-field-label">${fname(f)}${fnote(f)?`<div class="manual-field-note">${fnote(f)}</div>`:''}</div>
      <input class="manual-field-input" id="manF${fi}" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="—" value="${existVal}">
    `;body.appendChild(row);
  });
}
window.saveManual=async function(){
  const d=document.getElementById('manDate')?.value;
  if(!d){toast('請選擇日期','err');return;}
  if(curProject.startDate&&d<curProject.startDate||curProject.endDate&&d>curProject.endDate){toast('日期不在活動期間','err');return;}
  const cat=(curProject.categories||[])[manualCatIndex]||{fields:[]};
  const prefix=`cat${manualCatIndex}_`;const key=`${prefix}${d}`;
  const data={};let any=false;
  for(let fi=0;fi<(cat.fields||[]).length;fi++){
    const v=document.getElementById(`manF${fi}`)?.value.trim();
    if(!v)continue;
    if(isNaN(+v)||+v<0||!Number.isInteger(+v)){toast('請輸入有效整數','err');return;}
    data[`f${fi}`]=+v;any=true;
  }
  if(!any){toast('請至少填寫一個欄位','err');return;}
  await set(ref(db,`tracker/projects/${curPid}/entries/${key}`),data);
  writeLog('手動填報',`${key}`,'add');toast('已儲存','ok');window.closeModal('manualModal');
};

/* ── Project modal ────────────────────────────────── */
let editingPid=null,modalCats=[],modalDirty=false;
window.tryCloseProjectModal=function(){
  if(modalDirty&&!confirm('設定尚未儲存，確定要關閉嗎？'))return;
  modalDirty=false;
  window.closeModal('projectModal');
};
window.openProjectModal=function(p){
  editingPid=p?curPid:null;modalDirty=false;
  document.getElementById('projectModalTitle').textContent=p?'編輯專案':'新增專案';
  modalCats=p?(p.categories||[]).map(c=>({name:c.name,fields:(c.fields||[]).map(f=>typeof f==='string'?{name:f,note:''}:{name:f.name,note:f.note||''})}))
    :[{name:'人流回報',fields:[{name:'',note:''}]}];
  renderProjectModalBody(p);
  document.getElementById('projectModal').style.display='flex';
};
function markDirty(){modalDirty=true;}
function renderProjectModalBody(p){
  const today=new Date().toISOString().slice(0,10);
  document.getElementById('projectModalBody').innerHTML=`
    <div class="form-group"><label>專案名稱</label><input type="text" id="pName" value="${p?p.name:''}" oninput="markDirty()"></div>
    <div class="form-row">
      <div class="form-group"><label>開始日期</label><input type="date" id="pStart" value="${p?p.startDate||'':today}" oninput="markDirty()"></div>
      <div class="form-group"><label>結束日期</label><input type="date" id="pEnd" value="${p?p.endDate||'':''}" oninput="markDirty()"></div>
    </div>
    <div class="form-group"><label>狀態</label>
      <select id="pStatus" onchange="markDirty()">
        <option value="active" ${(!p||p.status==='active')?'selected':''}>進行中</option>
        <option value="ended" ${p?.status==='ended'?'selected':''}>已結束</option>
      </select>
    </div>
    <div style="font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;">分類與欄位</div>
    <div id="catBuilders"></div>
    <button class="add-link" id="addCatBtn" style="margin-bottom:4px;">＋ 新增分類</button>
  `;
  document.getElementById('addCatBtn').onclick=()=>window.addCat();
  renderCatBuilders();
}
window.markDirty=markDirty;
function renderCatBuilders(){
  const wrap=document.getElementById('catBuilders');wrap.innerHTML='';
  modalCats.forEach((cat,ci)=>{
    const div=document.createElement('div');div.className='cat-builder';
    let fh='';cat.fields.forEach((f,fi)=>{
      fh+=`<div class="field-item">
        <input type="text" placeholder="欄位名稱（最多6字）" maxlength="6" value="${f.name||''}" oninput="window.updateFieldName(${ci},${fi},this.value)">
        <input type="text" class="note-in" placeholder="備註（選填）" value="${f.note||''}" oninput="window.updateFieldNote(${ci},${fi},this.value)">
        <span class="field-del" onclick="window.removeField(${ci},${fi})">✕</span>
      </div>`;
    });
    div.innerHTML=`
      <div class="cat-builder-head">
        <input type="text" placeholder="分類名稱" value="${cat.name||''}" oninput="window.updateCatName(${ci},this.value)">
        <button class="add-link" onclick="window.addField(${ci})">＋ 欄位</button>
        ${modalCats.length>1?`<span class="field-del" onclick="window.removeCat(${ci})" title="刪除分類">🗑</span>`:''}
      </div>
      <div>${fh}</div>
    `;
    wrap.appendChild(div);
  });
}
window.updateCatName=(ci,v)=>{modalCats[ci].name=v;markDirty();};
window.updateFieldName=(ci,fi,v)=>{modalCats[ci].fields[fi].name=v;markDirty();};
window.updateFieldNote=(ci,fi,v)=>{modalCats[ci].fields[fi].note=v;markDirty();};
window.addCat=()=>{modalCats.push({name:'',fields:[{name:'',note:''}]});markDirty();renderCatBuilders();};
window.removeCat=(ci)=>{if(modalCats.length<=1){toast('至少要有一個分類','err');return;}modalCats.splice(ci,1);markDirty();renderCatBuilders();};
window.addField=(ci)=>{modalCats[ci].fields.push({name:'',note:''});markDirty();renderCatBuilders();};
window.removeField=(ci,fi)=>{if(modalCats[ci].fields.length<=1){toast('至少要有一個欄位','err');return;}modalCats[ci].fields.splice(fi,1);markDirty();renderCatBuilders();};

window.saveProject=async function(){
  const name=document.getElementById('pName')?.value.trim();
  const startDate=document.getElementById('pStart')?.value;
  const endDate=document.getElementById('pEnd')?.value;
  const status=document.getElementById('pStatus')?.value;
  if(!name){toast('請輸入專案名稱','err');return;}

  // Validate categories
  const catNames=new Set();
  for(const c of modalCats){
    const cn=(c.name||'').trim();
    if(!cn){toast('分類名稱不能為空','err');return;}
    if(catNames.has(cn)){toast(`分類名稱重複：${cn}`,'err');return;}
    catNames.add(cn);
    const fieldNames=new Set();
    for(const f of c.fields){
      const fn=(f.name||'').trim();
      if(!fn)continue;
      if(fn.length>6){toast(`欄位名稱「${fn}」超過6字元限制`,'err');return;}
      if(fieldNames.has(fn)){toast(`分類「${cn}」內有重複欄位名稱：${fn}`,'err');return;}
      fieldNames.add(fn);
    }
  }

  const categories=modalCats.map(c=>({
    name:c.name||'未命名',
    fields:c.fields.filter(f=>f.name.trim()).map(f=>f.note?{name:f.name,note:f.note}:f.name)
  })).filter(c=>c.fields.length);
  if(!categories.length){toast('請至少新增一個有效分類與欄位','err');return;}

  if(editingPid){
    // Use update to preserve entries
    await update(ref(db,`tracker/projects/${editingPid}`),{name,startDate:startDate||'',endDate:endDate||'',status,categories});
    writeLog('編輯專案',name,'edit');toast('已更新','ok');
  }else{
    const nr=push(ref(db,'tracker/projects'));
    await set(nr,{name,startDate:startDate||'',endDate:endDate||'',status,categories});
    writeLog('新增專案',name,'add');toast('已新增','ok');
  }
  modalDirty=false;
  window.closeModal('projectModal');
};

window.deleteProject=async function(){
  if(!curPid)return;
  if(!confirm(`確定要刪除「${curProject.name}」？此操作無法復原。`))return;
  const name=curProject.name;
  await remove(ref(db,`tracker/projects/${curPid}`));
  writeLog('刪除專案',name,'del');toast('已刪除','ok');
  curPid=null;curProject=null;
};

/* ── Log modal ────────────────────────────────────── */
function getLogTag(v){
  const tag=v.tag||'sys';
  const map={add:'新增',edit:'修改',del:'刪除',overwrite:'覆蓋',sys:'系統'};
  const cls={add:'log-tag-add',edit:'log-tag-edit',del:'log-tag-del',overwrite:'log-tag-del',sys:'log-tag-sys'};
  return`<span class="log-tag ${cls[tag]||'log-tag-sys'}">${map[tag]||tag}</span>`;
}
window.openLogModal=function(){
  document.getElementById('logModal').style.display='flex';
  const body=document.getElementById('logModalBody');
  body.innerHTML='<div style="color:var(--text3);font-size:13px;">載入中…</div>';
  if(logUnsubscribe)logUnsubscribe();
  const q=query(ref(db,'tracker/logs'),orderByKey(),limitToLast(200));
  logUnsubscribe=onValue(q,snap=>{
    const logs=snap.val()||{};
    const entries=Object.entries(logs).sort((a,b)=>b[1].t-a[1].t);
    body.innerHTML='';
    if(!entries.length){body.innerHTML='<div style="color:var(--text3);font-size:13px;">尚無紀錄</div>';return;}
    entries.forEach(([,v])=>{
      const dt=new Date(v.t);
      const ts=`${(dt.getMonth()+1).toString().padStart(2,'0')}/${dt.getDate().toString().padStart(2,'0')} ${dt.getHours().toString().padStart(2,'0')}:${dt.getMinutes().toString().padStart(2,'0')}`;
      const item=document.createElement('div');item.className='log-item';
      item.innerHTML=`
        <div class="log-time">${ts}</div>
        <div class="log-body">
          <div class="log-action-row">
            ${getLogTag(v)}
            <span class="log-action">${v.a}</span>
            <span class="log-who">${(v.u||'').replace(DOMAIN,'')}</span>
          </div>
          ${v.d?`<div class="log-detail">${v.d}</div>`:''}
        </div>`;
      body.appendChild(item);
    });
  });
};
// Unsubscribe log when modal closed
const origClose=window.closeModal;
window.closeModal=function(id){
  if(id==='logModal'&&logUnsubscribe){logUnsubscribe();logUnsubscribe=null;}
  origClose(id);
};

/* ── CSV export ───────────────────────────────────── */
window.downloadCSV=function(){
  if(!curProject)return;
  const p=curProject,cats=p.categories||[],allEntries=p.entries||{};
  const lines=[];
  cats.forEach((cat,ci)=>{
    const prefix=`cat${ci}_`;const fields=cat.fields||[];
    const header=['日期',...fields.map(f=>`${cat.name}_${fname(f)}`)].join(',');
    lines.push(header);
    const catEntries=Object.entries(allEntries).filter(([k])=>k.startsWith(prefix));
    const totals=fields.map(()=>0);
    catEntries.sort((a,b)=>a[0]<b[0]?-1:1).forEach(([k,v])=>{
      const row=[k.replace(prefix,''),...fields.map((f,fi)=>{const val=v[`f${fi}`]!=null?v[`f${fi}`]:'';if(!isNaN(+val)&&val!=='')totals[fi]+=+val;return val;})];
      lines.push(row.join(','));
    });
    lines.push(['合計',...totals].join(','));
    lines.push('');
  });
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=Object.assign(document.createElement('a'),{href:url,download:`${p.name}_export.csv`});
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  writeLog('匯出CSV',p.name,'sys');
};

const DOMAIN='@bpl.com';
</script>
