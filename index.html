<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>活動人次追蹤系統</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'><rect x='2' y='14' width='4' height='6' fill='%23526FBD' opacity='0.35'/><rect x='9' y='9' width='4' height='11' fill='%23526FBD' opacity='0.65'/><rect x='16' y='4' width='4' height='16' fill='%23526FBD'/><polyline points='4,13 11,8 18,3' stroke='%23526FBD' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='18' cy='3' r='1.5' fill='%23526FBD'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#F2F4F8;--surface:#ffffff;--line:#e4e7ed;--line-light:#eef0f4;
  --text:#1a2130;--text2:#3d4a5c;--text3:#8d97a5;
  --accent:#3D7EFF;--accent2:#6BA3FF;--accent-pale:#EBF2FF;
  --success:#16a05a;--success-pale:#e8f7ef;
  --danger:#e05c3a;--danger-pale:#fdf0ec;--warn:#e09a3a;
}
html{font-size:16px;}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-weight:400;line-height:1.7;-webkit-font-smoothing:antialiased;}
.view{display:none;}.view.active{display:block;}
.topbar{height:56px;background:rgba(255,255,255,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:200;box-shadow:0 1px 6px rgba(0,0,0,0.05);}
.brand{font-size:14px;font-weight:500;color:var(--text);letter-spacing:.02em;display:flex;align-items:center;gap:8px;}.brand-icon-wrap{width:24px;height:24px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.admin-link{font-size:12px;color:var(--text3);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:1px;transition:color .15s,border-color .15s;letter-spacing:.02em;}
.admin-link:hover{color:var(--accent);border-color:var(--accent);}
.sync-status{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);letter-spacing:.02em;}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .4s;}
.sdot.synced{background:var(--success);box-shadow:0 0 0 2px var(--success-pale);}.sdot.syncing{background:var(--warn);animation:blink 1.2s infinite;}.sdot.error{background:var(--danger);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.wrap-sm{max-width:480px;margin:0 auto;padding:36px 20px 60px;}
.ph{margin-bottom:32px;}.ph-title{font-size:20px;font-weight:500;letter-spacing:-.3px;color:var(--text);line-height:1.2;}
.ph-sub{font-size:13px;color:var(--text3);margin-top:6px;}.ph-line{height:1px;background:var(--line);margin-top:18px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:inherit;padding:0;margin-bottom:28px;letter-spacing:.03em;transition:color .15s;}
.back-btn:hover{color:var(--text);}.back-btn::before{content:"\2190";font-size:14px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:400;cursor:pointer;font-family:inherit;line-height:1;transition:all .15s;border:none;padding:11px 22px;letter-spacing:.02em;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:10px;box-shadow:0 3px 12px rgba(61,126,255,0.28);}.btn-primary:hover{box-shadow:0 5px 18px rgba(61,126,255,0.38);transform:translateY(-1px);}.btn-primary:active{transform:scale(.98);box-shadow:none;}
.btn-full{width:100%;padding:14px;border-radius:10px;}
.psel-list{display:flex;flex-direction:column;gap:0;margin-top:0;padding-top:4px;}
.psel-item{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:12px;margin-bottom:8px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer;transition:all .2s;box-shadow:0 2px 6px rgba(0,0,0,0.04);}
.psel-item:hover{border-color:#b8c8e8;box-shadow:0 6px 18px rgba(61,126,255,0.10);transform:translateY(-1px);}
.psel-name{font-size:17px;font-weight:500;color:var(--accent);}
.psel-date{font-size:12px;color:var(--text3);margin-top:3px;}
.entry-section{margin-top:0;}
.form-card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:24px 22px 28px;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.form-card-header{margin-bottom:22px;padding-bottom:16px;}
.entry-title{font-size:17px;font-weight:500;letter-spacing:-.1px;margin-bottom:4px;color:var(--accent);}
.entry-date-row{margin-bottom:20px;}
.entry-date-label{font-size:12px;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px;display:block;}
.date-input{background:transparent;border:none;border-bottom:2px solid var(--line);border-radius:0;font-size:16px;font-family:inherit;color:var(--text);padding:4px 0;width:100%;outline:none;-webkit-appearance:none;appearance:none;transition:border-color .15s;}
.date-input:focus{border-bottom-color:var(--accent);}
.entry-fields{display:flex;flex-direction:column;gap:0;margin-bottom:22px;}
.efield-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line-light);}
.efield-row:first-child{border-top:none;}.efield-row:last-child{border-bottom:none;}
.efield-label{font-size:14px;font-weight:500;color:var(--text);}
.efield-input{width:80px;background:transparent;border:none;border-bottom:2px solid var(--line);font-size:22px;font-weight:400;text-align:right;font-family:inherit;color:var(--text);padding:4px 0;outline:none;transition:border-color .15s;-moz-appearance:textfield;}
.efield-input::-webkit-outer-spin-button,.efield-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.efield-input:focus{border-color:var(--accent);}.efield-input:disabled{color:var(--text3);border-color:var(--line-light);}
.efield-input.prefilled{color:var(--warn);}
.status-banner{font-size:12px;padding:10px 14px;margin-bottom:16px;color:var(--text2);letter-spacing:.02em;display:none;border-radius:8px;}
.status-banner.show{display:block;}
.status-banner.warn-text{color:var(--danger);border:1px solid var(--danger);background:var(--danger-pale);}
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 40px);max-width:360px;}
.toast{background:var(--text);color:#fff;padding:12px 18px;font-size:13px;width:100%;text-align:center;letter-spacing:.02em;animation:tIn .2s ease;border-radius:10px;}
.toast.ok{background:var(--success);}.toast.err{background:var(--danger);}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.empty{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-ico{font-size:32px;margin-bottom:12px;opacity:.4;}
.empty p{font-size:13px;letter-spacing:.02em;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:var(--line);}
.offline-banner{background:var(--danger);color:#fff;text-align:center;font-size:12px;padding:8px 20px;letter-spacing:.02em;display:none;}
.offline-banner.show{display:block;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-nav-btn{font-size:12px;color:var(--text2);text-decoration:none;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:5px 12px;letter-spacing:.02em;transition:all .18s;white-space:nowrap;}
.topbar-nav-btn:hover{border-color:var(--text3);color:var(--text);}
@media(max-width:480px){
.brand-name{display:none;}
.topbar-nav-btn{font-size:11px;padding:5px 9px;}
#syncText{display:none;}
}
</style>
</head>
<body>
<div class="offline-banner" id="offlineBanner">⚠ 目前離線，恢復連線後數據將自動同步</div>
<div class="topbar">
  <div class="topbar-left">
    <div class="brand">
      <div class="brand-icon-wrap">
        <svg width="14" height="14" viewBox="0 0 22 22" fill="none">
          <rect x="2" y="14" width="4" height="6" fill="#fff" opacity=".5"/>
          <rect x="9" y="9" width="4" height="11" fill="#fff" opacity=".75"/>
          <rect x="16" y="4" width="4" height="16" fill="#fff"/>
        </svg>
      </div>
      <span class="brand-name">活動人次追蹤系統</span>
    </div>
    <a href="./admin/index.html" class="topbar-nav-btn">編輯者後台</a>
  </div>
  <div class="topbar-right">
    <div class="sync-status">
      <div class="sdot" id="syncDot"></div>
      <span id="syncText">連線中</span>
    </div>
  </div>
</div>

<div class="view active" id="viewList">
  <div class="wrap-sm">
    <div class="ph">
      <div class="ph-title">填報人次</div>
      <div class="ph-sub">請選擇活動</div>
      <div class="ph-line"></div>
    </div>
    <div id="listInner" class="psel-list"></div>
  </div>
</div>

<div class="view" id="viewForm">
  <div class="wrap-sm">
    <button class="back-btn" onclick="backToList()">返回</button>
    <div class="form-card">
      <div class="form-card-header">
        <div class="entry-title" id="entryName"></div>
        <div style="margin-top:16px;">
          <span class="entry-date-label">填報日期</span>
          <input type="date" class="date-input" id="entryDate">
        </div>
      </div>
      <div id="statusBanner" class="status-banner"></div>
      <div id="entryFields" class="entry-fields"></div>
      <button class="btn btn-primary btn-full" id="submitBtn" onclick="handleSubmit()">送出</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
var projects = {};
var projectOrder = [];
var currentProjectId = null;

function setSyncStatus(s,t){document.getElementById('syncDot').className='sdot '+s;document.getElementById('syncText').textContent=t;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,type){var w=document.getElementById('toastWrap');var t=document.createElement('div');t.className='toast'+(type==='err'?' err':type==='ok'?' ok':'');t.textContent=msg;w.appendChild(t);setTimeout(function(){t.remove();},3000);}
function showView(id){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});document.getElementById(id).classList.add('active');}

function renderList(){
  var el=document.getElementById('listInner');
  var active=projectOrder.filter(function(k){return projects[k]&&projects[k].status==='active';});
  if(!active.length){el.innerHTML='<div class="empty"><div class="empty-ico">&#128237;</div><p>目前沒有進行中的活動</p></div>';return;}
  el.innerHTML=active.map(function(k){
    var p=projects[k];
    return '<div class="psel-item" onclick="selectProject(\''+k+'\')">'+
      '<div><div class="psel-name">'+esc(p.name)+'</div><div class="psel-date">'+p.startDate+' ～ '+p.endDate+'</div></div>'+
      '<span style="color:var(--text3);font-size:16px">&#8250;</span></div>';
  }).join('');
}

window.selectProject=function(id){
  currentProjectId=id;
  var p=projects[id];
  document.getElementById('entryName').textContent=p.name;
  document.getElementById('statusBanner').className='status-banner';
  document.getElementById('submitBtn').disabled=false;
  var today=todayStr();
  // clamp today to project date range
  var d=today;
  if(p.startDate && d < p.startDate) d=p.startDate;
  if(p.endDate   && d > p.endDate)   d=p.endDate;
  var dateEl=document.getElementById('entryDate');
  dateEl.value=d;
  dateEl.min=p.startDate||'';
  dateEl.max=p.endDate||'';
  loadFields(d);
  dateEl.onchange=function(){loadFields(this.value);};
  showView('viewForm');
};

function loadFields(d){
  var p=projects[currentProjectId];
  var existing=(p.entries&&p.entries[d])||null;
  document.getElementById('entryFields').innerHTML=(p.fields||[]).map(function(f,i){
    var v=existing?parseInt(existing['f'+i]||0):'';
    return '<div class="efield-row"><div class="efield-label">'+esc(f)+'</div>'+
      '<input class="efield-input'+(existing?' prefilled':'')+'" type="number" min="0" id="ef_'+i+'" value="'+(v!==''?v:'')+'" placeholder="0"></div>';
  }).join('');
  var sb=document.getElementById('statusBanner');
  if(existing){sb.textContent='此日期已有填報數字，修改後可重新送出';sb.className='status-banner warn-text show';}
  else{sb.className='status-banner';}
  document.getElementById('submitBtn').disabled=false;
}

window.backToList=function(){showView('viewList');};

window.handleSubmit=function(){
  var date=document.getElementById('entryDate').value;
  if(!date){toast('請選擇填報日期','err');return;}
  var p=projects[currentProjectId];
  var values=(p.fields||[]).map(function(f,i){return{label:f,value:parseInt(document.getElementById('ef_'+i).value)||0};});
  var alreadyFilled=p.entries&&p.entries[date];
  if(alreadyFilled){if(!confirm('該日期已填報過，確認是否重新填報？'))return;}
  if(window._dbSet){window._dbSet(currentProjectId,date,values,!!alreadyFilled);}
  else{toast('資料庫尚未就緒，請稍後','err');}
};

(async function(){
  try{
    var fbApp=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    var fbDb=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
    var initializeApp=fbApp.initializeApp,getApps=fbApp.getApps;
    var getDatabase=fbDb.getDatabase,ref=fbDb.ref,set=fbDb.set,onValue=fbDb.onValue;
    var app=getApps().length?getApps()[0]:initializeApp({databaseURL:'https://project-1794474641398451810-default-rtdb.asia-southeast1.firebasedatabase.app/'});
    var db=getDatabase(app);
    window.addEventListener('online',function(){document.getElementById('offlineBanner').classList.remove('show');});
    window.addEventListener('offline',function(){document.getElementById('offlineBanner').classList.add('show');setSyncStatus('error','離線中');});
    if(!navigator.onLine)document.getElementById('offlineBanner').classList.add('show');
    if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});

    setSyncStatus('syncing','連線中...');
    onValue(ref(db,'tracker'),function(snap){
      var d=snap.val()||{};
      projects=d.projects||{};
      projectOrder=d.projectOrder||Object.keys(projects);
      Object.keys(projects).forEach(function(k){if(projectOrder.indexOf(k)<0)projectOrder.push(k);});
      projectOrder=projectOrder.filter(function(k){return!!projects[k];});
      setSyncStatus('synced','已同步');
      renderList();
    },function(err){setSyncStatus('error','連線失敗');toast('連線失敗：'+err.message,'err');});

    window._dbSet=async function(pid,date,values,isOverwrite){
      var p=projects[pid],obj={};values.forEach(function(v,i){obj['f'+i]=v.value;});
      try{
        await set(ref(db,'tracker/projects/'+pid+'/entries/'+date),obj);
        values.forEach(function(_,i){var el=document.getElementById('ef_'+i);if(el){el.disabled=true;}});
        var sb=document.getElementById('statusBanner');sb.textContent='數據已送出';sb.className='status-banner show';
        document.getElementById('submitBtn').disabled=true;
        toast('\u2705 數據已送出！','ok');
        var vals=values.map(function(v){return v.label+':'+v.value;}).join('、');
        var action=isOverwrite?'覆蓋填報':'填報數據';
        var t=Date.now();
        set(ref(db,'tracker/logs/'+t),{t:t,u:'協助者',a:action,d:date+' @ '+(p?p.name:pid)+'｜'+vals}).catch(function(){});
      }catch(e){toast('送出失敗：'+e.message,'err');}
    };
  }catch(err){setSyncStatus('error','連線失敗');toast('初始化失敗：'+err.message,'err');}
})();
</script>
</body>
</html>
