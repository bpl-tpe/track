<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>編輯者後台｜活動人次追蹤系統</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'><rect x='2' y='14' width='4' height='6' fill='%23526FBD' opacity='0.35'/><rect x='9' y='9' width='4' height='11' fill='%23526FBD' opacity='0.65'/><rect x='16' y='4' width='4' height='16' fill='%23526FBD'/><polyline points='4,13 11,8 18,3' stroke='%23526FBD' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='18' cy='3' r='1.5' fill='%23526FBD'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#F5F4F4;--surface:#ffffff;--line:#e2e2e2;--line-light:#ebebeb;
  --text:#212A33;--text2:#3a4450;--text3:#8a95a0;
  --accent:#526FBD;--accent-pale:#eef1f9;
  --success:#1a8a5a;--danger:#CB7758;--warn:#CB7758;
}
html{font-size:16px;}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-weight:400;line-height:1.7;-webkit-font-smoothing:antialiased;}
.view{display:none;}.view.active{display:block;}
.topbar{height:54px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:200;}
.brand{font-size:13px;font-weight:500;color:var(--text);letter-spacing:.02em;display:flex;align-items:center;gap:8px;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.sync-status{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);}
.sdot{width:5px;height:5px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .4s;}
.sdot.synced{background:var(--success);}.sdot.syncing{background:var(--warn);animation:blink 1.2s infinite;}.sdot.error{background:var(--danger);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.topbar-link{font-size:12px;color:var(--text3);text-decoration:none;border-bottom:1px solid var(--text3);padding-bottom:1px;transition:color .15s,border-color .15s;letter-spacing:.02em;}
.topbar-link:hover{color:var(--accent);border-color:var(--accent);}
.user-info{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2);border:1px solid var(--line);padding:4px 10px;}
.logout-btn{font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:inherit;padding:0;border-bottom:1px solid var(--text3);line-height:1;transition:all .15s;}
.logout-btn:hover{color:var(--danger);border-color:var(--danger);}
.login-screen{min-height:calc(100vh - 54px);display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.login-box{width:100%;max-width:320px;}
.login-title{font-size:20px;font-weight:500;letter-spacing:-.3px;margin-bottom:6px;color:var(--text);}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:32px;line-height:1.6;}
.login-form{display:flex;flex-direction:column;gap:18px;}
.lf-group{display:flex;flex-direction:column;gap:6px;}
.lf-label{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;}
.lf-input{background:none;border:none;border-bottom:1px solid var(--line);font-size:16px;font-family:inherit;color:var(--text);padding:8px 0;outline:none;transition:border-color .15s;width:100%;}
.lf-input:focus{border-color:var(--text);}
.lf-input-wrap{position:relative;display:flex;align-items:center;}
.lf-input-wrap .lf-input{padding-right:40px;}
.pw-toggle{position:absolute;right:0;background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;display:flex;align-items:center;transition:color .15s;}
.pw-toggle:hover{color:var(--text);}
.login-error{font-size:12px;color:var(--danger);display:none;padding:8px 0;}
.login-btn{background:var(--accent);color:#fff;border:none;padding:13px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;transition:background .15s;width:100%;letter-spacing:.02em;}
.login-btn:hover{background:#3d5aa8;}
.login-btn:active{transform:scale(.98);}
.wrap{max-width:680px;margin:0 auto;padding:36px 20px 60px;}
.ph{margin-bottom:32px;}.ph-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.ph-title{font-size:20px;font-weight:500;letter-spacing:-.3px;color:var(--text);line-height:1.2;}
.ph-sub{font-size:13px;color:var(--text3);margin-top:6px;}.ph-line{height:1px;background:var(--line);margin-top:18px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:inherit;padding:0;margin-bottom:28px;letter-spacing:.03em;transition:color .15s;}
.back-btn:hover{color:var(--text);}.back-btn::before{content:"\2190";font-size:14px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:400;cursor:pointer;font-family:inherit;line-height:1;transition:all .15s;border:none;padding:11px 22px;letter-spacing:.02em;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:#3d5aa8;}.btn-primary:active{transform:scale(.98);}
.btn-outline{background:none;color:var(--text);border:1px solid var(--line);}.btn-outline:hover{border-color:var(--text);}
.btn-ghost{background:none;color:var(--text2);border:none;padding:8px 12px;font-size:12px;}.btn-ghost:hover{color:var(--text);}
.btn-danger-txt{background:none;color:var(--danger);border:none;font-size:12px;padding:8px 0;cursor:pointer;font-family:inherit;letter-spacing:.02em;}
.btn-danger-txt:hover{text-decoration:underline;}
.btn-sm{padding:7px 14px;font-size:12px;}
.add-field-btn{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:12px;cursor:pointer;background:none;border:none;font-family:inherit;padding:6px 0;margin-top:6px;}
.add-field-btn:hover{text-decoration:underline;}
.project-grid{display:flex;flex-direction:column;gap:12px;}
.pcard{background:var(--surface);border:1.5px solid var(--line);padding:20px;cursor:pointer;transition:border-color .18s,box-shadow .18s;display:flex;align-items:stretch;}
.pcard:hover{border-color:var(--text3);box-shadow:0 2px 10px rgba(0,0,0,.07);}
.pcard.dragging{opacity:.35;}.pcard.drag-over{border-color:var(--accent);}
.pcard-left{width:60%;display:flex;flex-direction:column;justify-content:space-between;padding-right:16px;border-right:1px solid var(--line);}
.pcard-title{font-size:17px;font-weight:500;color:var(--accent);margin-bottom:5px;line-height:1.4;}
.pcard-date{font-size:12px;color:var(--text3);}.pcard-badge-wrap{margin-top:14px;}
.badge{font-size:10px;font-weight:500;padding:2px 8px;letter-spacing:.04em;border:1px solid;display:inline-block;}
.badge-on{color:#fff;background:var(--success);border-color:var(--success);}.badge-off{color:#fff;background:var(--text3);border-color:var(--text3);}
.pcard-right{width:40%;display:flex;flex-direction:column;gap:12px;padding-left:16px;justify-content:center;}
.stat-item{display:flex;flex-direction:column;gap:6px;}
.stat-l{font-size:12px;color:var(--text3);line-height:1;}
.stat-n{font-size:22px;font-weight:400;color:var(--text);letter-spacing:-.5px;line-height:1.1;}
.summary-row{display:flex;gap:0;border-top:1px solid var(--line);margin-bottom:32px;}
.scard{flex:1;padding:20px 0;border-right:1px solid var(--line);text-align:center;background:#f9f9f9;}
.scard:last-child{border-right:none;}
.scard-n{font-size:26px;font-weight:400;color:var(--text);letter-spacing:-.5px;line-height:1;}
.scard-l{font-size:14px;color:var(--text2);margin-bottom:6px;}
.table-section{margin-bottom:10px;}
.table-header{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.filter-bar{
  overflow:hidden;max-height:0;opacity:0;
  transition:max-height .35s ease, opacity .3s ease, padding .3s ease;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  border-bottom:1px solid var(--line-light);padding:0;
}
.filter-bar.open{max-height:120px;opacity:1;padding:8px 0;}
.filter-bar .fi{max-width:140px;padding:4px 0;font-size:13px;}
.filter-bar-label{font-size:11px;color:var(--text3);letter-spacing:.03em;white-space:nowrap;}
#filterBtn{transition:transform .3s ease;}
#editDataBtn.editing{background:var(--text);color:#fff;border-color:var(--text);}
/* 編輯模式 input — 無框無線，完全透明 */
.td-input{
  width:100%;
  background:transparent;
  border:none;outline:none;
  font-size:13px;font-weight:400;
  text-align:center;
  font-family:inherit;color:var(--text);
  padding:4px 0;
  -moz-appearance:textfield;
}
.td-input::-webkit-outer-spin-button,.td-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.td-input:focus{color:var(--accent);}

/* 刪除按鈕 — 圓形紅色 */
.del-row-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:50%;
  background:rgba(203,119,88,.1);
  border:none;
  cursor:pointer;color:var(--danger);
  transition:all .18s;vertical-align:middle;
}
.del-row-btn:hover{
  background:var(--danger);color:#fff;
  transform:scale(1.12);
}

/* 新增列 */
.add-row-tr td{padding:12px 14px 12px 16px;border-top:1.5px dashed var(--line);}
.add-row-tr{background:#fafafa !important;}
.add-date-input{
  background:transparent;
  border:none;outline:none;
  font-size:13px;font-family:inherit;color:var(--text);
  padding:4px 0;
}
.add-row-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:50%;
  background:rgba(82,111,189,.12);
  border:none;
  cursor:pointer;color:var(--accent);
  font-size:16px;line-height:1;font-family:inherit;
  transition:all .18s;
}
.add-row-btn:hover{
  background:var(--accent);color:#fff;
  transform:scale(1.12);
}
.table-label{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;}
.table-actions{display:flex;gap:6px;}
.tbl-btn{font-size:11px;font-weight:500;color:var(--text2);background:none;border:1px solid var(--line);cursor:pointer;font-family:inherit;padding:5px 10px;letter-spacing:.02em;transition:all .15s;}
.tbl-btn:hover{border-color:var(--text);color:var(--text);}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:320px;}
th{padding:9px 14px;text-align:center;font-size:11px;font-weight:500;color:var(--text3);border-bottom:1.5px solid var(--line);letter-spacing:.04em;white-space:nowrap;}
th:first-child{text-align:left;padding-left:16px;}
th:last-child{padding-right:16px;}
td{padding:13px 14px;font-size:13px;text-align:center;color:var(--text);border-bottom:none;}
td:first-child{text-align:left;padding-left:16px;color:var(--text);font-weight:500;white-space:nowrap;}
td:last-child{padding-right:16px;}
tbody tr:nth-child(even) td{background:#f9f9f9;}
tbody tr:hover td{background:var(--accent-pale);}
.total-row td{font-weight:500;color:var(--accent);border-top:1.5px solid var(--line);font-size:13px;background:none !important;padding-top:14px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;align-items:flex-end;justify-content:center;padding:0;}
.overlay.open{display:flex;}
.modal{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:28px 24px 36px;animation:mIn .22s ease;border-top:1px solid var(--line);}
@keyframes mIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:3px;background:var(--line);border-radius:2px;margin:0 auto 22px;}
.modal-title{font-size:17px;font-weight:500;letter-spacing:-.2px;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:22px;}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:1px solid var(--line);align-items:center;}
.modal-foot-space{justify-content:space-between;}
.fg{margin-bottom:18px;}
.fl{display:block;font-size:11px;font-weight:500;color:var(--text3);margin-bottom:7px;letter-spacing:.06em;text-transform:uppercase;}
.fi{width:100%;padding:10px 0;border:none;border-bottom:1px solid var(--line);font-size:15px;font-family:inherit;color:var(--text);background:none;outline:none;transition:border-color .15s;border-radius:0;}
.fi:focus{border-color:var(--text);}
.field-list{display:flex;flex-direction:column;gap:8px;}
.field-item{display:flex;gap:8px;align-items:center;}.field-item .fi{flex:1;}
.rm-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:0 4px;line-height:1;transition:color .15s;flex-shrink:0;}
.rm-btn:hover{color:var(--danger);}
.section-divider{font-size:11px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin:22px 0 12px;border-top:1px solid var(--line);padding-top:18px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;}
.toggle-label{font-size:14px;color:var(--text);}.toggle-desc{font-size:12px;color:var(--text3);margin-top:2px;}
.tog{position:relative;width:40px;height:22px;flex-shrink:0;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;inset:0;background:var(--line);border-radius:22px;cursor:pointer;transition:.25s;}
.tog-sl:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.15);}
input:checked+.tog-sl{background:var(--text);}
input:checked+.tog-sl:before{transform:translateX(18px);}
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 40px);max-width:360px;}
.toast{background:var(--text);color:#fff;padding:12px 18px;font-size:13px;width:100%;text-align:center;letter-spacing:.02em;animation:tIn .2s ease;}
.toast.ok{background:var(--success);}.toast.err{background:var(--danger);}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.empty{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-ico{font-size:32px;margin-bottom:12px;opacity:.4;}
.empty p{font-size:13px;letter-spacing:.02em;}
#detailName{color:var(--accent);font-size:20px;font-weight:500;}
::-webkit-scrollbar{width:3px;height:3px;}::-webkit-scrollbar-thumb{background:var(--line);}
@media(min-width:600px){.overlay{align-items:center;padding:20px;}.modal{border-radius:2px;border:1px solid var(--line);}}
.offline-banner{background:var(--danger);color:#fff;text-align:center;font-size:12px;padding:8px 20px;letter-spacing:.02em;display:none;}
.offline-banner.show{display:block;}
.log-wrap{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);}
.log-header-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:2px 0;user-select:none;}
.log-label{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;}
.log-item{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line-light);font-size:12px;flex-wrap:wrap;}
.log-ts{font-size:11px;color:var(--text3);flex-shrink:0;white-space:nowrap;}
.log-who{color:var(--accent);flex-shrink:0;}
.log-what{color:var(--text2);}
</style>
</head>
<body>

<div class="offline-banner" id="offlineBanner">⚠ 目前離線，數據將在恢復連線後自動同步</div>

<div class="topbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="14" width="4" height="6" fill="var(--accent)" opacity="0.35"/>
      <rect x="9" y="9" width="4" height="11" fill="var(--accent)" opacity="0.65"/>
      <rect x="16" y="4" width="4" height="16" fill="var(--accent)"/>
      <polyline points="4,13 11,8 18,3" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="18" cy="3" r="1.5" fill="var(--accent)"/>
    </svg>
    編輯者後台
  </div>
  <div class="topbar-right">
    <div class="sync-status">
      <div class="sdot" id="syncDot"></div>
      <span id="syncText">—</span>
    </div>
    <a href="../index.html" class="topbar-link">協助者頁面</a>
    <div class="user-info" id="userInfo" style="display:none">
      <span id="userName"></span>
      <button class="logout-btn" onclick="doLogout()">登出</button>
    </div>
  </div>
</div>

<!-- 登入畫面 -->
<div class="view active" id="viewLogin">
  <div class="login-screen">
    <div class="login-box">
      <div class="login-title">編輯者登入</div>
      <div class="login-sub">請輸入帳號與密碼</div>
      <div class="login-form">
        <div class="lf-group">
          <label class="lf-label">帳號</label>
          <input class="lf-input" type="text" id="loginUser" placeholder="" autocomplete="off" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
        </div>
        <div class="lf-group">
          <label class="lf-label">密碼</label>
          <div class="lf-input-wrap">
            <input class="lf-input" type="password" id="loginPass" placeholder="" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
            <button type="button" class="pw-toggle" onclick="togglePw('loginPass',this)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="login-error" id="loginError">帳號或密碼錯誤，請再試一次</div>
        <button class="login-btn" onclick="doLogin()">登入</button>
      </div>
    </div>
  </div>
</div>

<!-- 編輯者：專案列表 -->
<div class="view" id="viewEditor">
  <div class="wrap">
    <div class="ph">
      <div class="ph-row">
        <div class="ph-title">專案</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm" onclick="downloadAllCSV()">匯出全部</button>
          <button class="btn btn-outline btn-sm" onclick="openNewProjectModal()">新增</button>
        </div>
      </div>
      <div class="ph-line"></div>
    </div>
    <div class="project-grid" id="editorGrid"></div>
    <div class="log-wrap" id="logWrap" style="display:none">
      <div class="log-header-row" onclick="toggleLogList()">
        <span class="log-label">操作記錄</span>
        <span id="logArrow" style="font-size:10px;color:var(--text3)">▾</span>
      </div>
      <div id="logList" style="display:none"></div>
    </div>
  </div>
</div>

<!-- 編輯者：專案詳情 -->
<div class="view" id="viewDetail">
  <div class="wrap">
    <button class="back-btn" onclick="backToEditor()">返回</button>
    <div class="ph">
      <div class="ph-row">
        <div>
          <div class="ph-title" id="detailName"></div>
          <div class="ph-sub" id="detailDates"></div>
        </div>
        <button class="tbl-btn" onclick="openEditModal()">活動設定</button>
      </div>
      <div class="ph-line"></div>
    </div>
    <div id="summaryRow" class="summary-row"></div>
    <div class="table-section">
      <div class="table-header">
        <span class="table-label" style="color:var(--accent);font-weight:500;font-size:13px;">活動數據</span>
        <div class="table-actions">
          <button class="tbl-btn" id="filterBtn" onclick="toggleFilterBar()" title="篩選日期">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <button class="tbl-btn" id="editDataBtn" onclick="toggleEditMode()" title="編輯數據" style="padding:5px 8px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>

<script>

function renderEditorProjects(){
  var el=document.getElementById('editorGrid');
  if(!projectOrder.length){el.innerHTML='<div class="empty"><div class="empty-ico">&#128193;</div><p>尚無專案，點擊「新增」開始</p></div>';return;}
  el.innerHTML=projectOrder.filter(function(k){return!!projects[k];}).map(function(k){
    var p=projects[k],fields=p.fields||[],entries=p.entries||{};
    var ft=fields.map(function(_,fi){var t=0;Object.values(entries).forEach(function(e){t+=parseInt(e['f'+fi]||0);});return t;});
    var on=p.status==='active';
    return '<div class="pcard" draggable="true" data-id="'+k+'"'+
      ' ondragstart="onDS(event)" ondragover="onDO(event)" ondrop="onDP(event)" ondragleave="onDL(event)" ondragend="onDE(event)"'+
      ' onclick="openDetail(\''+k+'\')">'+
      '<div class="pcard-left">'+
        '<div><div class="pcard-title">'+esc(p.name)+'</div>'+
        '<div class="pcard-date">'+formatDate(p.startDate)+' ～<br>'+formatDate(p.endDate)+'</div></div>'+
        '<div class="pcard-badge-wrap"><span class="badge '+(on?'badge-on':'badge-off')+'">'+(on?'進行中':'已結束')+'</span></div>'+
      '</div>'+
      '<div class="pcard-right">'+
      (fields.length?fields.map(function(f,i){return '<div class="stat-item"><div class="stat-l">'+esc(f)+'</div><div class="stat-n">'+ft[i].toLocaleString()+'</div></div>';}).join(''):'<div class="stat-item"><div class="stat-n" style="color:var(--text3)">—</div></div>')+
      '</div></div>';

function formatDate(d){
  // d = 'YYYY-MM-DD'
  var parts=d.split('-');
  var dt=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  var week=['日','一','二','三','四','五','六'][dt.getDay()];
  return d+'（'+week+'）';
}
function formatDateRange(start,end){
  return formatDate(start)+' ～ '+formatDate(end);
}

var tableSort = 'asc';
var tableFilterFrom = '';
var tableFilterTo = '';

var SVG_ASC  = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>';
var SVG_DESC = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

window.toggleSort = function() {
  tableSort = tableSort === 'asc' ? 'desc' : 'asc';
  renderDetail(currentProjectId);
};

window.toggleFilterBar = function() {
  var bar = document.getElementById('filterBar');
  var btn = document.getElementById('filterBtn');
  var isOpen = bar.classList.contains('open');
  if (isOpen) {
    bar.classList.remove('open');
    btn.classList.remove('active');
  } else {
    // 關閉編輯模式
    if (tableEditMode) {
      tableEditMode = false;
      var editBtn = document.getElementById('editDataBtn');
      editBtn.innerHTML = SVG_PENCIL;
      editBtn.title = '編輯數據';
      editBtn.classList.remove('editing');
      renderDetail(currentProjectId);
    }
    bar.classList.add('open');
    btn.classList.add('active');
    setTimeout(function(){ document.getElementById('filterFrom').focus(); }, 320);
  }
};

window.applyFilter = function() {
  tableFilterFrom = document.getElementById('filterFrom').value || '';
  tableFilterTo   = document.getElementById('filterTo').value   || '';
  renderDetail(currentProjectId);
};

window.clearFilter = function() {
  tableFilterFrom = ''; tableFilterTo = '';
  document.getElementById('filterFrom').value = '';
  document.getElementById('filterTo').value = '';
  document.getElementById('filterBar').classList.remove('open');
  document.getElementById('filterBtn').classList.remove('active');
  renderDetail(currentProjectId);
};

var tableEditMode = false;

var SVG_PENCIL = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
var SVG_CHECK  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

window.toggleEditMode = function() {
  tableEditMode = !tableEditMode;
  var btn = document.getElementById('editDataBtn');
  btn.innerHTML = SVG_PENCIL;
  btn.title = tableEditMode ? '完成編輯' : '編輯數據';
  if (tableEditMode) {
    btn.classList.add('editing');
    // 關閉查詢列
    document.getElementById('filterBar').classList.remove('open');
    document.getElementById('filterBtn').classList.remove('active');
  } else {
    btn.classList.remove('editing');
  }
  renderDetail(currentProjectId);
};

function renderDetail(id){
  var p=projects[id];if(!p)return;
  document.getElementById('detailName').textContent=p.name;
  document.getElementById('detailDates').textContent=formatDateRange(p.startDate,p.endDate);
  var fields=p.fields||[],entries=p.entries||{};
  var ft=fields.map(function(_,fi){var t=0;Object.values(entries).forEach(function(e){t+=parseInt(e['f'+fi]||0);});return t;});
  document.getElementById('summaryRow').innerHTML=fields.map(function(f,i){
    return '<div class="scard"><div class="scard-l">'+esc(f)+'</div><div class="scard-n">'+ft[i].toLocaleString()+'</div></div>';
  }).join('');

  var allDates=Object.keys(entries).sort();
  if(tableSort==='desc') allDates=allDates.slice().reverse();
  var dates=allDates.filter(function(d){
    if(tableFilterFrom && d<tableFilterFrom) return false;
    if(tableFilterTo   && d>tableFilterTo)   return false;
    return true;
  });

  var th=document.getElementById('tHead'),tb=document.getElementById('tBody');
  if(!allDates.length){
    th.innerHTML='';
    tb.innerHTML='<tr><td colspan="99" style="text-align:center;padding:32px;color:var(--text3)">尚無數據</td></tr>';
    return;
  }

  var sortIcon=tableSort==='asc'?SVG_ASC:SVG_DESC;
  var editCol = tableEditMode ? '<th style="width:32px"></th>' : '';
  th.innerHTML='<tr><th style="cursor:pointer;user-select:none;" onclick="toggleSort()">日期 <span style="vertical-align:middle;opacity:.6">'+sortIcon+'</span></th>'+
    fields.map(function(f){return '<th>'+esc(f)+'</th>';}).join('')+editCol+'</tr>';

  if(!dates.length){
    tb.innerHTML='<tr><td colspan="99" style="text-align:center;padding:24px;color:var(--text3)">此日期無數據</td></tr>';
    return;
  }

  var ct=fields.map(function(){return 0;});

  var rows = dates.map(function(d){
    var e=entries[d]||{},rv=fields.map(function(_,i){return parseInt(e['f'+i]||0);});
    rv.forEach(function(v,i){ct[i]+=v;});
    if(tableEditMode){
      var inputCells = rv.map(function(v,i){
        return '<td><input class="td-input" type="number" min="0" id="edit_'+d+'_'+i+'" value="'+v+'" onblur="saveRowEdit(\''+d+'\')"></td>';
      }).join('');
      return '<tr><td style="padding-left:16px;font-weight:500;white-space:nowrap">'+formatDate(d)+'</td>'+inputCells+
        '<td style="padding-right:16px"><button class="del-row-btn" onclick="deleteRow(\''+d+'\')" title="刪除此日"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></td></tr>';
    } else {
      return '<tr><td>'+formatDate(d)+'</td>'+rv.map(function(v){return '<td>'+v.toLocaleString()+'</td>';}).join('')+'</tr>';
    }
  }).join('');

  // add-row in edit mode
  var addRow = '';
  if(tableEditMode){
    var addInputs = fields.map(function(_,i){
      return '<td><input class="td-input" type="number" min="0" id="newRowVal_'+i+'" placeholder="0"></td>';
    }).join('');
    addRow = '<tr class="add-row-tr" style="background:var(--accent-pale)">'+
      '<td style="padding-left:16px"><input type="date" class="add-date-input" id="newRowDate" min="'+(p.startDate||'')+'" max="'+(p.endDate||'')+'"></td>'+
      addInputs+
      '<td style="padding-right:16px"><button class="add-row-btn" onclick="addNewRow()" title="新增此日數據"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></td></tr>';
  }

  tb.innerHTML = rows + addRow +
    '<tr class="total-row"><td>合計</td>'+ct.map(function(v){return '<td>'+v.toLocaleString()+'</td>';}).join('')+(tableEditMode?'<td></td>':'')+'</tr>';
}

function addFieldItem(val){
  var fl=document.getElementById('fieldList');
  var div=document.createElement('div');div.className='field-item';

window.openManualModal=function(date){
  var p=projects[currentProjectId];
  document.getElementById('manualSub').textContent=p.name;
  var d=date||todayStr();
  // clamp to project date range
  if(p.startDate && d < p.startDate) d=p.startDate;
  if(p.endDate   && d > p.endDate)   d=p.endDate;
  var dateEl=document.getElementById('manualDate');
  dateEl.value=d;
  dateEl.min=p.startDate||'';
  dateEl.max=p.endDate||'';
  var existing=(p.entries&&p.entries[d])||{};
  document.getElementById('manualFields').innerHTML=(p.fields||[]).map(function(f,i){
    return '<div class="fg"><label class="fl">'+esc(f)+'</label><input class="fi" type="number" min="0" id="mf_'+i+'" value="'+(parseInt(existing['f'+i]||0)||'')+'"></div>';
  }).join('');
  dateEl.onchange=function(){
    var nd=this.value,ex=(p.entries&&p.entries[nd])||{};
    (p.fields||[]).forEach(function(_,i){var el=document.getElementById('mf_'+i);if(el)el.value=parseInt(ex['f'+i]||0)||'';});
  };
  openModal('manualModal');
};
window.downloadCSV=function(){
  var p=projects[currentProjectId];if(!p)return;
  var fields=p.fields||[],entries=p.entries||{},dates=Object.keys(entries).sort();
  if(!dates.length){toast('尚無數據可下載','err');return;}
  var rows=dates.map(function(d){var e=entries[d]||{};return[d].concat(fields.map(function(_,i){return parseInt(e['f'+i]||0);}));});
  var ct=fields.map(function(_,fi){return dates.reduce(function(s,d){return s+parseInt((entries[d]||{})['f'+fi]||0);},0);});
  rows.push(['合計'].concat(ct));
  var csv=[['日期'].concat(fields)].concat(rows).map(function(r){return r.join(',');}).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=p.name+'_數據.csv';a.click();URL.revokeObjectURL(url);
};
var logOpen=false;
window.toggleLogList=function(){
  logOpen=!logOpen;
  document.getElementById('logList').style.display=logOpen?'block':'none';
  document.getElementById('logArrow').textContent=logOpen?'▴':'▾';
};

window.downloadAllCSV=function(){
  var keys=projectOrder.filter(function(k){return!!projects[k];});
  if(!keys.length){toast('尚無專案可匯出','err');return;}
  var lines=[];
  keys.forEach(function(k){
    var p=projects[k],fields=p.fields||[],entries=p.entries||{},dates=Object.keys(entries).sort();
    lines.push('活動：'+p.name+' ('+p.startDate+' ～ '+p.endDate+')');
    lines.push(['日期'].concat(fields).join(','));
    dates.forEach(function(d){var e=entries[d]||{};lines.push([d].concat(fields.map(function(_,i){return parseInt(e['f'+i]||0);})).join(','));});
    var ct=fields.map(function(_,fi){return dates.reduce(function(s,d){return s+parseInt((entries[d]||{})['f'+fi]||0);},0);});
    lines.push(['合計'].concat(ct).join(','));
    lines.push('');
  });
  var blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='全部活動數據_'+todayStr()+'.csv';a.click();
  URL.revokeObjectURL(url);
};

      var user=auth.currentUser;if(!user)return;
      var t=Date.now();
      set(ref(db,'tracker/logs/'+t),{t:t,u:user.email.replace(DOMAIN,''),a:action,d:detail||''}).catch(function(){});
    }

    window.doLogin=async function(){
      var user=document.getElementById('loginUser').value.trim();
      var pass=document.getElementById('loginPass').value;
      var errEl=document.getElementById('loginError');
      errEl.style.display='none';
      if(!user||!pass){errEl.style.display='block';return;}
      var email=user+DOMAIN;
      try{
        await signInWithEmailAndPassword(auth,email,pass);
      }catch(e){
        errEl.style.display='block';
        document.getElementById('loginPass').value='';
      }
    };

    window.doLogout=async function(){
      await signOut(auth);
    };

    onAuthStateChanged(auth,function(user){
      if(!user){
        showView('viewLogin');
        document.getElementById('userInfo').style.display='none';
        setSyncStatus('','—');
        return;
      }
      var displayName=user.email.replace(DOMAIN,'');
      document.getElementById('userInfo').style.display='flex';
      document.getElementById('userName').textContent=displayName;
      setSyncStatus('syncing','連線中...');
      onValue(ref(db,'tracker'),function(snap){
        var d=snap.val()||{};
        projects=d.projects||{};
        projectOrder=d.projectOrder||Object.keys(projects);
        Object.keys(projects).forEach(function(k){if(projectOrder.indexOf(k)<0)projectOrder.push(k);});
        projectOrder=projectOrder.filter(function(k){return!!projects[k];});
        setSyncStatus('synced','已同步');
        if(document.getElementById('viewLogin').classList.contains('active')){
          showView('viewEditor');
        }
        refreshView();
      },function(err){setSyncStatus('error','連線失敗');});

      onValue(query(ref(db,'tracker/logs'),limitToLast(50)),function(snap){
        var logs=snap.val()||{};
        var keys=Object.keys(logs).sort().reverse();
        var wrap=document.getElementById('logWrap');
        wrap.style.display=keys.length?'block':'none';
        var el=document.getElementById('logList');
        if(!keys.length){el.innerHTML='';return;}
        el.innerHTML=keys.map(function(k){
          var l=logs[k],dt=new Date(parseInt(k));
          var ts=(dt.getMonth()+1)+'/'+dt.getDate()+' '+dt.getHours().toString().padStart(2,'0')+':'+dt.getMinutes().toString().padStart(2,'0');
          return '<div class="log-item"><span class="log-ts">'+ts+'</span><span class="log-who">'+esc(l.u||'?')+'</span><span class="log-what">'+esc(l.a||'')+(l.d?' · '+esc(l.d):'')+'</span></div>';
        }).join('');
      },function(){});
    });

    window.saveProject=async function(){
      var name=document.getElementById('fieldName').value.trim();
      var start=document.getElementById('fieldStart').value;
      var end=document.getElementById('fieldEnd').value;
      var fields=Array.from(document.querySelectorAll('#fieldList .field-item .fi')).map(function(i){return i.value.trim();}).filter(Boolean);
      var status=document.getElementById('statusToggle').checked?'active':'ended';
      if(!name||!start||!end){toast('請填寫活動名稱與日期','err');return;}
      if(!fields.length){toast('請至少新增一個登記項目','err');return;}
      var isNew=!editingProjectId;
      var id=editingProjectId||'p_'+Date.now();
      setSyncStatus('syncing','儲存中...');
      try{
        await update(ref(db,'tracker/projects/'+id),{name:name,startDate:start,endDate:end,fields:fields,status:status});
        if(isNew){
          var snap=await get(ref(db,'tracker/projectOrder'));
          var cur=snap.val();
          if(!cur||!Array.isArray(cur))cur=projectOrder.slice();
          if(cur.indexOf(id)<0)cur=cur.concat([id]);
          await update(ref(db,'tracker'),{projectOrder:cur});
        }
        closeModal('projectModal');toast('\u2705 已儲存','ok');
        writeLog(isNew?'新增專案':'編輯專案',name);
      }catch(e){toast('儲存失敗：'+e.message,'err');setSyncStatus('error','儲存失敗');}
    };

    window.deleteProject=async function(){
      if(!editingProjectId)return;
      var p=projects[editingProjectId];
      if(!confirm('確定要刪除「'+(p?p.name:editingProjectId)+'」？此操作無法復原。'))return;
      try{
        await remove(ref(db,'tracker/projects/'+editingProjectId));
        var newOrder=projectOrder.filter(function(k){return k!==editingProjectId;});
        await update(ref(db,'tracker'),{projectOrder:newOrder});
        // 立即更新本地狀態，不等 Firebase callback
        delete projects[editingProjectId];
        projectOrder=newOrder;
        closeModal('projectModal');
        currentProjectId=null;
        showView('viewEditor');
        renderEditorProjects();
        toast('專案已刪除');
        writeLog('刪除專案',p?p.name:editingProjectId);
      }catch(e){toast('刪除失敗：'+e.message,'err');}
    };

    window.saveManualEntry=async function(){
      var date=document.getElementById('manualDate').value;
      if(!date){toast('請選擇日期','err');return;}
      var p=projects[currentProjectId],obj={};
      (p.fields||[]).forEach(function(_,i){obj['f'+i]=parseInt(document.getElementById('mf_'+i).value)||0;});
      try{
        await set(ref(db,'tracker/projects/'+currentProjectId+'/entries/'+date),obj);
        writeLog('手動新增數據',date+' @ '+projects[currentProjectId].name);
        closeModal('manualModal');toast('\u2705 數據已儲存','ok');
      }catch(e){toast('儲存失敗：'+e.message,'err');}
    };

    window.saveRowEdit=async function(date){
      var p=projects[currentProjectId],fields=p.fields||[],obj={};
      fields.forEach(function(_,i){
        var el=document.getElementById('edit_'+date+'_'+i);
        obj['f'+i]=parseInt(el?el.value:0)||0;
      });
      try{await set(ref(db,'tracker/projects/'+currentProjectId+'/entries/'+date),obj);}
      catch(e){toast('儲存失敗：'+e.message,'err');}
    };

    window.deleteRow=async function(date){
      if(!confirm(date+' 的數據確定刪除？'))return;
      try{
        await remove(ref(db,'tracker/projects/'+currentProjectId+'/entries/'+date));
        writeLog('刪除數據',date+' @ '+projects[currentProjectId].name);
        toast('已刪除 '+date);
      }catch(e){toast('刪除失敗：'+e.message,'err');}
    };

    window.addNewRow=async function(){
      var dateEl=document.getElementById('newRowDate');
      var d=dateEl?dateEl.value:'';
      if(!d){toast('請選擇日期','err');return;}
      var p=projects[currentProjectId];
      if(p.entries&&p.entries[d]){toast('此日期已有數據，請直接修改','err');return;}
      var fields=p.fields||[],obj={};
      fields.forEach(function(_,i){
        var el=document.getElementById('newRowVal_'+i);
        obj['f'+i]=parseInt(el?el.value:0)||0;
      });
      try{
        await set(ref(db,'tracker/projects/'+currentProjectId+'/entries/'+d),obj);
        dateEl.value='';
        fields.forEach(function(_,i){var el=document.getElementById('newRowVal_'+i);if(el)el.value='';});
        writeLog('新增數據',d+' @ '+projects[currentProjectId].name);
        toast('\u2705 已新增 '+d,'ok');
      }catch(e){toast('新增失敗：'+e.message,'err');}
    };

    window.onDP=function(e){
      e.preventDefault();
      var tgt=e.currentTarget;tgt.classList.remove('drag-over');
      if(!dragSrcEl||dragSrcEl===tgt)return;
      var si=projectOrder.indexOf(dragSrcEl.dataset.id),ti=projectOrder.indexOf(tgt.dataset.id);
      if(si<0||ti<0)return;
      projectOrder.splice(si,1);projectOrder.splice(ti,0,dragSrcEl.dataset.id);
      update(ref(db,'tracker'),{projectOrder:projectOrder.slice()});
    };

  }catch(err){
    setSyncStatus('error','初始化失敗');
    toast('初始化失敗：'+err.message,'err');
    console.error(err);
  }
})();
</script>
</body>
</html>
